openapi: 3.1.0
info:
  title: Vault API
  description: >
    Vault service contract — CRUD over the 9 Canvas Marketing OS Vault
    object types (signals, opportunity_cards, briefs, assets, campaigns,
    agent_runs, gate_decisions, costs, consent_register), plus consent
    checking, retention-expiry job control, and utilisation roll-up
    reporting.

    Every writable object carries six mandatory taxonomy fields —
    `vertical`, `function_id`, `campaign`, `evidence_grade`,
    `consent_status`, `retention_class` — as first-class request/response
    properties. These fields are immutable once an object is created: for
    v1, PATCH requests that attempt to change any of them are rejected
    with 422 (see each PATCH operation's description). How the Vault
    service physically stores these fields (which columns vs. which
    internal bookkeeping tables) is a service implementation detail and is
    intentionally not described by this contract.

    Any create request that includes `data_subject_ref` is treated as
    client-derived personal data and is gated on an active, matching
    consent record (see `consent_channel` / `consent_purpose`); requests
    without `data_subject_ref` are not consent-gated.
  version: "1.0.0"
servers:
  - url: https://vault.internal.cmos.dev
    description: In-VNet Container Apps endpoint (internal ingress only)
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness/readiness probe
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                required: [status]

  /signals:
    post:
      operationId: createSignal
      summary: Create a signal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignalCreate"
            examples:
              plausible:
                value:
                  source: "semrush"
                  signal_type: "keyword_spike"
                  payload: { keyword: "electric bike finance", volume_delta_pct: 42 }
                  vertical: "mobility"
                  function_id: "signal-ingestion-v1"
                  campaign: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  evidence_grade: "B"
                  consent_status: "not_required"
                  retention_class: "standard_1y"
      responses:
        "201":
          description: Signal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Signal"
        "403":
          description: Client-derived write rejected — no matching active consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Missing/invalid taxonomy field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listSignals
      summary: List signals
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: List of signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Signal"
  /signals/{id}:
    get:
      operationId: getSignal
      summary: Get a signal by id
      parameters:
        - $ref: "#/components/parameters/ObjectId"
        - $ref: "#/components/parameters/CallerService"
      responses:
        "200":
          description: Signal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Signal"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateSignal
      summary: >
        Update a signal's business fields. Taxonomy fields are immutable
        post-create: if the request body includes any of vertical,
        function_id, campaign, evidence_grade, consent_status,
        retention_class with a value different from the stored value, the
        whole request is rejected with 422.
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignalUpdate"
      responses:
        "200":
          description: Updated signal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Signal"
        "422":
          description: Attempted to change an immutable taxonomy field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteSignal
      summary: Delete a signal
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "204":
          description: Deleted

