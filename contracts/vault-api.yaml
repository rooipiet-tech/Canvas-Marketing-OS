      parameters:
        - $ref: "#/components/parameters/ObjectId"
        - $ref: "#/components/parameters/CallerService"
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
