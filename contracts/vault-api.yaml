      parameters:
        - $ref: "#/components/parameters/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRegisterEntryUpdate"
      responses:
        "200":
          description: Updated consent register entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentRegisterEntry"
        "422":
          description: Attempted to change an immutable taxonomy field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /consent/check:
    get:
      operationId: checkConsent
      summary: >
        Check whether an active (non-revoked) consent_register row exists
        for a data subject/channel/purpose at request time.
      parameters:
        - name: data_subject_ref
          in: query
          required: true
          schema:
            type: string
        - name: channel
          in: query
          required: true
          schema:
            type: string
        - name: purpose
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Consent check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentCheckResult"

  /retention-expiry-runs:
    post:
      operationId: triggerRetentionExpiry
      summary: >
        Trigger a retention-expiry sweep across every object type
        (including non-asset-backed objects). Blob-backed assets also
        have their underlying blob deleted. Every deletion is logged to a
        queryable audit trail.
      responses:
        "202":
          description: Retention-expiry run accepted/started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionExpiryRun"
    get:
      operationId: listRetentionExpiryRuns
      summary: List retention-expiry runs
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: List of retention-expiry runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RetentionExpiryRun"
  /retention-expiry-runs/{id}:
    get:
      operationId: getRetentionExpiryRun
      summary: Get a retention-expiry run's status
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200":
          description: Retention-expiry run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionExpiryRun"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /utilisation/rollup:
    post:
      operationId: runUtilisationRollup
      summary: Compute (upsert) the daily utilisation roll-up for a given date.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                  description: Date to roll up (defaults to today, UTC, if omitted).
      responses:
        "200":
          description: Roll-up computed
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                    format: date
                  rows_upserted:
                    type: integer
                required: [date, rows_upserted]
    get:
      operationId: getUtilisationRollup
      summary: Read daily utilisation roll-up rows, optionally filtered.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Inclusive start date (defaults to earliest available).
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Inclusive end date (defaults to today, UTC).
        - name: object_class
          in: query
          required: false
          schema:
            type: string
          description: Restrict to one Vault object type (e.g. "signals").
      responses:
        "200":
          description: Utilisation roll-up rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UtilisationRollupRow"

  # Appendix D PR 5. Not one of the generic object types below (see
  # services/vault/vault/routers/option_cards.py's own header for why):
  # keyed on card_id, not id, and `card` IS the OptionCard document
  # (contracts/option-card.schema.json), not a generic taxonomy-fields
  # payload. services/gatekeeper/app/option_decisions.py writes
  # approval_decisions directly against the same Postgres and has no
  # need of this API; it exists for services/orchestrator, which only
  # ever talks to Vault over HTTP.
  /option-cards:
    post:
      operationId: createOptionCard
      summary: Create an option card (services/orchestrator's Fn 116, compose_options_handler).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptionCardCreate"
      responses:
        "201":
          description: Option card created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptionCard"
        "422":
          description: Missing required field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listOptionCards
      summary: List option cards, optionally restricted to pending (undecided AND unexpired) ones.
      parameters:
        - name: pending
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: List of option cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OptionCard"
  /option-cards/{card_id}:
    get:
      operationId: getOptionCard
      summary: Get one option card by card_id.
      parameters:
        - name: card_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Option card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptionCard"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    ObjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    CallerService:
      name: X-Caller-Service
      in: header
      required: false
      schema:
        type: string
      description: >
        Identifies the calling service for utilisation roll-up
        attribution. Every GET on an object resource records an access
        event keyed by this header (defaults to "unknown" if absent).

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code]
          properties:
            message:
              type: string
            code:
              type: string
            field:
              type: string
              description: Name of the offending field, when applicable (e.g. a missing taxonomy field).

    TaxonomyFields:
      type: object
      required: [vertical, function_id, campaign, evidence_grade, consent_status, retention_class]
      properties:
        vertical:
          type: string
          description: Business vertical this object belongs to (e.g. "mobility", "finance").
        function_id:
          type: string
          description: Identifier of the producing function/capability (e.g. "signal-ingestion-v1").
        campaign:
          type: string
          format: uuid
          description: >
            FK to campaigns.id. Persisted to the real campaign_id column
            for opportunity_cards, briefs, assets, and agent_runs; tracked
            as taxonomy metadata for other object types.
        evidence_grade:
          type: string
          enum: [A, B, C, D, unverified]
          description: Confidence grade of the evidence backing this object.
        consent_status:
          type: string
          enum: [granted, revoked, not_required, pending]
        retention_class:
          type: string
          enum: [ephemeral_30d, standard_1y, extended_3y, legal_hold]
          description: Governs the retention-expiry job's deletion schedule for this object.

    ClientDerivedFields:
      type: object
      properties:
        data_subject_ref:
          type: string
          description: >
            Presence marks this write as client-derived personal data,
            requiring an active matching consent_register row. Omit for
            non-personal-data writes.
        consent_channel:
          type: string
          description: Required alongside data_subject_ref — the channel the consent applies to (e.g. "email").
        consent_purpose:
          type: string
          description: Required alongside data_subject_ref — the purpose the consent applies to (e.g. "campaign_targeting").

    ObjectMeta:
      type: object
      required: [id, created_at]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    SignalCreate:
      allOf:
        - $ref: "#/components/schemas/TaxonomyFields"
        - $ref: "#/components/schemas/ClientDerivedFields"
        - type: object
          required: [source, signal_type]
          properties:
            source:
              type: string
            signal_type:
              type: string
            payload:
              type: object
              additionalProperties: true
    SignalUpdate:
      type: object
      properties:
        source:
          type: string
        signal_type:
          type: string
        payload:
          type: object
          additionalProperties: true
    Signal:
      allOf:
        - $ref: "#/components/schemas/ObjectMeta"
        - $ref: "#/components/schemas/TaxonomyFields"
        - type: object
          required: [source, signal_type]
          properties:
            source:
              type: string
            signal_type:
              type: string
            payload:
              type: object
              additionalProperties: true
            received_at:
              type: string
              format: date-time

    CampaignCreate:
      allOf:
        - $ref: "#/components/schemas/TaxonomyFields"
        - type: object
          required: [name]
          properties:
            name:
              type: string
            status:
              type: string
              default: draft
            starts_at:
              type: string
              format: date-time
            ends_at:
              type: string
              format: date-time
    CampaignUpdate:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
    Campaign:
      allOf:
        - $ref: "#/components/schemas/ObjectMeta"
        - $ref: "#/components/schemas/TaxonomyFields"
        - type: object
          required: [name, status]
          properties:
            name:
              type: string
            status:
              type: string
            starts_at:
              type: string
              format: date-time
            ends_at:
              type: string
              format: date-time

    OpportunityCardCreate:
      allOf:
        - $ref: "#/components/schemas/TaxonomyFields"
        - $ref: "#/components/schemas/ClientDerivedFields"
        - type: object
          required: [title]
          properties:
            signal_id:
              type: string
              format: uuid
            title:
              type: string
            score:
              type: number
            status:
              type: string
              default: new
            pillar:
              type: string
              description: >
                Function 09's positioning pillar for the signal this card
                scores. Added after v1 froze; nullable, because cards
                written before that carry no value for it.
            so_what:
              type: string
              description: >
                Function 09's "why it matters" line for the signal — the
                claim the card is asserting, carried so a reader (and a
                downstream brief) has the point, not only the headline.
            source_url:
              type: string
              format: uri
              description: >
                The evidence this card's score rests on, so a reader can
                check the claim without joining back to the signal batch.
            confidence:
              type: string
              description: >
                Function 09's own confidence for the signal — the input the
                score is computed from, carried alongside the output so a
                score can be audited rather than taken on trust.
    OpportunityCardUpdate:
      type: object
      properties:
        title:
          type: string
        score:
          type: number
        status:
          type: string
        pillar:
          type: string
        so_what:
          type: string
        source_url:
          type: string
          format: uri
        confidence:
          type: string
    OpportunityCard:
      allOf:
        - $ref: "#/components/schemas/ObjectMeta"
        - $ref: "#/components/schemas/TaxonomyFields"
        - type: object
          required: [title, status]
          properties:
            signal_id:
              type: string
              format: uuid
            title:
              type: string
            score:
              type: number
            status:
              type: string
            pillar:
              type: string
              description: >
                Function 09's positioning pillar for the signal this card
                scores. Added after v1 froze; nullable, because cards
                written before that carry no value for it.
            so_what:
              type: string
              description: >
                Function 09's "why it matters" line for the signal — the
                claim the card is asserting, carried so a reader (and a
                downstream brief) has the point, not only the headline.
            source_url:
              type: string
              format: uri
              description: >
                The evidence this card's score rests on, so a reader can
                check the claim without joining back to the signal batch.
            confidence:
              type: string
              description: >
                Function 09's own confidence for the signal — the input the
                score is computed from, carried alongside the output so a
                score can be audited rather than taken on trust.

    BriefCreate:
      allOf:
        - $ref: "#/components/schemas/TaxonomyFields"
        - type: object
          required: [title]
          properties:
            opportunity_card_id:
              type: string
              format: uuid
            title:
              type: string
            body:
              type: string
    BriefUpdate:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
    Brief:
      allOf:
        - $ref: "#/components/schemas/ObjectMeta"
        - $ref: "#/components/schemas/TaxonomyFields"
        - type: object
          required: [title]
          properties:
            opportunity_card_id:
              type: string
              format: uuid
            title:
              type: string
            body:
              type: string

    AssetCreate:
      allOf:
        - $ref: "#/components/schemas/TaxonomyFields"
        - type: object
          required: [asset_type, agent_run_id, content_base64]
          properties:
            brief_id:
              type: string
              format: uuid
            asset_type:
              type: string
            agent_run_id:
              type: string
              format: uuid
            predecessor_asset_id:
              type: string
              format: uuid
            content_base64:
              type: string
              description: Raw asset bytes, base64-encoded. Deduplicated by sha256 content hash.
    AssetUpdate:
      type: object
      properties:
        approval_state:
          type: string
          enum: [draft, pending_review, approved, rejected, superseded]
    AssetSummary:
      allOf:
        - $ref: "#/components/schemas/ObjectMeta"
        - $ref: "#/components/schemas/TaxonomyFields"
        - type: object
          required: [asset_type, version, approval_state, agent_run_id, content_hash]
          properties:
            brief_id:
              type: string
              format: uuid
            asset_type:
              type: string
            version:
              type: integer
            approval_state:
              type: string
              enum: [draft, pending_review, approved, rejected, superseded]
            agent_run_id:
              type: string
              format: uuid
            predecessor_asset_id:
              type: string
              format: uuid
            content_hash:
              type: string
            storage_uri:
              type: string
    Asset:
      allOf:
        - $ref: "#/components/schemas/AssetSummary"
        - type: object
          required: [content_base64]
          properties:
            content_base64:
              type: string
              description: Byte-identical to what was submitted at creation for this version.

    AgentRunCreate:
      allOf:
        - $ref: "#/components/schemas/TaxonomyFields"
        - type: object
          required: [agent_name]
          properties:
            agent_name:
              type: string
            status:
              type: string
              enum: [pending, running, succeeded, failed, cancelled]
              default: pending
            input:
              type: object
              additionalProperties: true
            output:
              type: object
              additionalProperties: true
    AgentRunUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, running, succeeded, failed, cancelled]
        output:
          type: object
          additionalProperties: true
        completed_at:
          type: string
          format: date-time
    AgentRun:
      allOf:
        - $ref: "#/components/schemas/ObjectMeta"
        - $ref: "#/components/schemas/TaxonomyFields"
        - type: object
          required: [agent_name, status, started_at]
          properties:
            agent_name:
              type: string
            status:
              type: string
              enum: [pending, running, succeeded, failed, cancelled]
            input:
              type: object
              additionalProperties: true
            output:
              type: object
              additionalProperties: true
            started_at:
              type: string
              format: date-time
            completed_at:
              type: string
              format: date-time

    GateDecisionCreate:
      allOf:
        - $ref: "#/components/schemas/TaxonomyFields"
        - type: object
          required: [agent_run_id, decided_by, outcome]
          properties:
            agent_run_id:
              type: string
              format: uuid
            decided_by:
              type: string
            outcome:
              type: string
              enum: [approved, rejected, escalated]
            reason:
              type: string
    GateDecision:
      allOf:
        - $ref: "#/components/schemas/ObjectMeta"
        - $ref: "#/components/schemas/TaxonomyFields"
        - type: object
          required: [agent_run_id, decided_by, outcome, decided_at]
          properties:
            agent_run_id:
              type: string
              format: uuid
            decided_by:
              type: string
            outcome:
              type: string
              enum: [approved, rejected, escalated]
            reason:
              type: string
            decided_at:
              type: string
              format: date-time

    CostCreate:
      allOf:
        - $ref: "#/components/schemas/TaxonomyFields"
        - type: object
          required: [agent_run_id, provider, amount]
          properties:
            agent_run_id:
              type: string
              format: uuid
            provider:
              type: string
            unit:
              type: string
              default: usd
            amount:
              type: number
    Cost:
      allOf:
        - $ref: "#/components/schemas/ObjectMeta"
        - $ref: "#/components/schemas/TaxonomyFields"
        - type: object
          required: [agent_run_id, provider, unit, amount, incurred_at]
          properties:
            agent_run_id:
              type: string
              format: uuid
            provider:
              type: string
            unit:
              type: string
            amount:
              type: number
            incurred_at:
              type: string
              format: date-time

    ConsentRegisterEntryCreate:
      allOf:
        - $ref: "#/components/schemas/TaxonomyFields"
        - type: object
          required: [data_subject_ref, lawful_basis, channel, purpose]
          properties:
            data_subject_ref:
              type: string
            lawful_basis:
              type: string
            channel:
              type: string
            purpose:
              type: string
    ConsentRegisterEntryUpdate:
      type: object
      required: [revoked_at]
      properties:
        revoked_at:
          type: string
          format: date-time
    ConsentRegisterEntry:
      allOf:
        - $ref: "#/components/schemas/ObjectMeta"
        - $ref: "#/components/schemas/TaxonomyFields"
        - type: object
          required: [data_subject_ref, lawful_basis, channel, purpose, consented_at]
          properties:
            data_subject_ref:
              type: string
            lawful_basis:
              type: string
            channel:
              type: string
            purpose:
              type: string
            consented_at:
              type: string
              format: date-time
            revoked_at:
              type: string
              format: date-time

    ConsentCheckResult:
      type: object
      required: [consented]
      properties:
        consented:
          type: boolean
        consent_register_id:
          type: string
          format: uuid

    RetentionExpiryRun:
      type: object
      required: [id, status, started_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [running, succeeded, failed]
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        deleted_count:
          type: integer

    UtilisationRollupRow:
      type: object
      required: [date, object_class, caller_service, read_count]
      properties:
        date:
          type: string
          format: date
        object_class:
          type: string
        caller_service:
          type: string
        read_count:
          type: integer

    OptionCardCreate:
      type: object
      required: [kind, autonomy_level, risk_tier, produced_by_function, card, expires_at]
      properties:
        card_id:
          type: string
          format: uuid
          description: Optional; server-generated if omitted.
        kind:
          type: string
        autonomy_level:
          type: integer
          minimum: 0
          maximum: 4
        risk_tier:
          type: string
        agent_run_id:
          type: string
          format: uuid
          description: Must reference a real agent_runs row (the PR #105 lesson).
        produced_by_function:
          type: integer
        card:
          type: object
          description: The full OptionCard document (contracts/option-card.schema.json).
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    OptionCard:
      allOf:
        - $ref: "#/components/schemas/OptionCardCreate"
        - type: object
          required: [card_id, created_at]
