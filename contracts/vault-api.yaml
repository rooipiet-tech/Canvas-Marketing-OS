  /assets:
    post:
      operationId: createAsset
      summary: >
        Create an asset. `content_base64` is content-addressed: bytes are
        hashed (sha256) and deduplicated against any existing asset with
        the same content_hash before a new blob is written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetCreate"
            examples:
              plausible:
                value:
                  brief_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  asset_type: "social_post_image"
                  agent_run_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  predecessor_asset_id: null
                  content_base64: "aGVsbG8gd29ybGQ="
                  vertical: "mobility"
                  function_id: "asset-generation-v1"
                  campaign: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  evidence_grade: "A"
                  consent_status: "not_required"
                  retention_class: "standard_1y"
