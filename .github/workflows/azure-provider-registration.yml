name: azure-provider-registration

# Design rule (see .compound/learnings): free, idempotent preflight steps
# live outside approval gates so retries are unattended. This workflow does
# ONLY subscription-level resource-provider/feature registration — it is
# never gated behind an environment, never spends money, and is always safe
# to re-run. deploy-infra.yml's environment-gated `deploy` job only starts
# after THIS workflow succeeds (via deploy-infra.yml's own workflow_run
# trigger pointed at this workflow), so retries here never require cmos-dev
# approval.
#
# NOTE: GitHub Actions forbids a workflow_run trigger that references its
# OWN workflow ("cannot listen to itself") — a cross-workflow workflow_run
# trigger (like deploy-infra.yml watching this workflow) is fine, but this
# workflow cannot watch itself. So all retry logic for THIS workflow lives
# as bash loops inside the job below, not as a self-triggering workflow_run.

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  register:
    name: register-providers-and-features
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Register resource providers (retries transient failures, up to 3 attempts each)
        run: |
          retry() {
            local desc="$1"; shift
            local max_attempts=3
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "$desc failed after $max_attempts attempts"
                return 1
              fi
              echo "$desc failed (attempt $attempt/$max_attempts) - retrying in 10s..."
              attempt=$((attempt + 1))
              sleep 10
            done
          }

          retry "Register Microsoft.App" az provider register --namespace Microsoft.App --wait
          retry "Register Microsoft.DBforPostgreSQL" az provider register --namespace Microsoft.DBforPostgreSQL --wait
          retry "Register Microsoft.ServiceBus" az provider register --namespace Microsoft.ServiceBus --wait

      - name: Register WorkloadProfiles feature and wait for it (fast path + 40-minute bound, self-retried up to 3 attempts)
        run: |
          retry() {
            local desc="$1"; shift
            local max_attempts=3
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "$desc failed after $max_attempts attempts"
                return 1
              fi
              echo "$desc failed (attempt $attempt/$max_attempts) - retrying in 10s..."
              attempt=$((attempt + 1))
              sleep 10
            done
          }

          register_feature() {
            set +e
            OUTPUT=$(az feature register --namespace Microsoft.App --name WorkloadProfiles 2>&1)
            STATUS=$?
            echo "$OUTPUT"
            set -e
            if [ $STATUS -ne 0 ]; then
              # Tolerate the specific case where the feature name is
              # unrecognized/already-default-on for the current API version —
              # treat as non-fatal (feature implicitly available), not a
              # failure worth retrying.
              if echo "$OUTPUT" | grep -qiE "not found|NotFound|InvalidFeatureName|does not exist"; then
                echo "WorkloadProfiles feature name not recognized by this API version; treating as non-fatal (implicitly available)."
                return 0
              else
                return $STATUS
              fi
            fi
            return 0
          }

          retry "Register WorkloadProfiles feature" register_feature

          # Fast path: a single check before entering any poll loop. Most
          # runs after the first successful registration hit this path and
          # finish immediately.
          STATE=$(az feature show --namespace Microsoft.App --name WorkloadProfiles --query properties.state -o tsv 2>/dev/null || echo "Unknown")
          echo "Initial check: WorkloadProfiles feature state = $STATE"

          if [ "$STATE" = "Registered" ]; then
            echo "Already registered — no poll needed."
          else
            # Azure resource-provider/feature registration is a one-time,
            # asynchronous operation whose first-time propagation is not a
            # fixed SLA and can legitimately take a long time. Bound
            # generously (40 minutes) rather than failing fast on what is
            # very likely just registration still in flight.
            MAX_ATTEMPTS=80
            SLEEP_SECONDS=30
            ATTEMPT=1
            while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
              STATE=$(az feature show --namespace Microsoft.App --name WorkloadProfiles --query properties.state -o tsv 2>/dev/null || echo "Unknown")
              echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: WorkloadProfiles feature state = $STATE"
              if [ "$STATE" = "Registered" ]; then
                break
              fi
              ATTEMPT=$((ATTEMPT + 1))
              if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
                sleep "$SLEEP_SECONDS"
              fi
            done
            if [ "$STATE" != "Registered" ]; then
              echo "WorkloadProfiles feature registration did not complete after 40 minutes."
              echo "This is a one-time Azure propagation delay, not a build defect - it is safe and expected to retry."
              echo ""
              echo "Recovery: wait for registration to finish, then re-run this workflow. To check/finish it manually:"
              echo "  az feature show --namespace Microsoft.App --name WorkloadProfiles --query properties.state -o tsv"
              echo "  # once the above prints Registered, run:"
              echo "  az provider register --namespace Microsoft.App --wait"
              echo "  # then re-run this workflow (deploy-infra.yml's what-if job starts automatically once this succeeds)."
              exit 1
            fi
          fi

      - name: Re-register Microsoft.App (propagate feature registration, retried up to 3 attempts)
        run: |
          retry() {
            local desc="$1"; shift
            local max_attempts=3
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "$desc failed after $max_attempts attempts"
                return 1
              fi
              echo "$desc failed (attempt $attempt/$max_attempts) - retrying in 10s..."
              attempt=$((attempt + 1))
              sleep 10
            done
          }
          retry "Re-register Microsoft.App" az provider register --namespace Microsoft.App --wait
