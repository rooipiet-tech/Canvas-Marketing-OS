name: azure-provider-registration

# Design rule (see .compound/learnings): free, idempotent preflight steps
# live outside approval gates so retries are unattended. This workflow does
# ONLY subscription-level resource-provider/feature registration — it is
# never gated behind an environment, never spends money, and is always safe
# to re-run. deploy-infra.yml's environment-gated `deploy` job only starts
# after THIS workflow succeeds (via deploy-infra.yml's own workflow_run
# trigger pointed at this workflow), so retries here never require cmos-dev
# approval.
#
# NOTE: GitHub Actions forbids a workflow_run trigger that references its
# OWN workflow ("cannot listen to itself") — a cross-workflow workflow_run
# trigger (like deploy-infra.yml watching this workflow) is fine, but this
# workflow cannot watch itself. So all retry logic for THIS workflow lives
# as bash loops inside the job below, not as a self-triggering workflow_run.

on:
  # Callable by deploy-pipeline.yml -- see that workflow's header.
  workflow_call:
  workflow_dispatch: {}
permissions:
  id-token: write
  contents: read

jobs:
  register:
    name: register-providers-and-features
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Register resource providers (retries transient failures, up to 3 attempts each)
        run: |
          retry() {
            local desc="$1"; shift
            local max_attempts=3
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "$desc failed after $max_attempts attempts"
                return 1
              fi
              echo "$desc failed (attempt $attempt/$max_attempts) - retrying in 10s..."
              attempt=$((attempt + 1))
              sleep 10
            done
          }

          retry "Register Microsoft.App" az provider register --namespace Microsoft.App --wait
          retry "Register Microsoft.DBforPostgreSQL" az provider register --namespace Microsoft.DBforPostgreSQL --wait
          retry "Register Microsoft.ServiceBus" az provider register --namespace Microsoft.ServiceBus --wait

      - name: Register WorkloadProfiles feature (retried up to 3 attempts; registration request only, not the wait)
        run: |
          retry() {
            local desc="$1"; shift
            local max_attempts=3
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "$desc failed after $max_attempts attempts"
                return 1
              fi
              echo "$desc failed (attempt $attempt/$max_attempts) - retrying in 10s..."
              attempt=$((attempt + 1))
              sleep 10
            done
          }

          register_feature() {
            set +e
            OUTPUT=$(az feature register --namespace Microsoft.App --name WorkloadProfiles 2>&1)
            STATUS=$?
            echo "$OUTPUT"
            set -e
            if [ $STATUS -ne 0 ]; then
              # Tolerate the specific case where the feature name is
              # unrecognized/already-default-on for the current API version —
              # treat as non-fatal (feature implicitly available), not a
              # failure worth retrying.
              if echo "$OUTPUT" | grep -qiE "not found|NotFound|InvalidFeatureName|does not exist"; then
                echo "WorkloadProfiles feature name not recognized by this API version; treating as non-fatal (implicitly available)."
                return 0
              else
                return $STATUS
              fi
            fi
            return 0
          }

          retry "Register WorkloadProfiles feature" register_feature

      - name: Check WorkloadProfiles feature state (advisory only, non-blocking)
        run: |
          # WorkloadProfiles has been generally available for a long time on
          # Azure Container Apps. This AFEC (feature-exposure-control) flag
          # sat Pending for 90+ minutes across two full registration/polling
          # attempts on this subscription, including an unregister/re-register
          # cycle — evidence it is likely vestigial, not a genuine gate on
          # whether workload-profile environments actually deploy. Per budget
          # owner direction, this check is now a single, non-blocking probe:
          # log the state and warn loudly if it isn't Registered, but always
          # proceed. The authoritative test is the real what-if/deploy outcome
          # in deploy-infra.yml — if Azure genuinely rejects the
          # workload-profile environment because of this flag, that deploy
          # will fail with a clear feature-related error, and THIS check
          # should be reverted to blocking at that point (see .compound
          # learning on AFEC flags for long-GA capabilities).
          STATE=$(az feature show --namespace Microsoft.App --name WorkloadProfiles --query properties.state -o tsv 2>/dev/null || echo "Unknown")
          echo "WorkloadProfiles feature state = $STATE"
          if [ "$STATE" != "Registered" ]; then
            echo "::warning::Microsoft.App/WorkloadProfiles feature state is '$STATE', not 'Registered'. Proceeding anyway — this check is advisory only (see .compound learning on AFEC flags for long-GA capabilities). If the workload-profile Container Apps environment deploy in deploy-infra.yml fails with a feature-related error, revert this check to blocking."
          fi

      - name: Re-register Microsoft.App (propagate feature registration if/when it lands, retried up to 3 attempts)
        run: |
          retry() {
            local desc="$1"; shift
            local max_attempts=3
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "$desc failed after $max_attempts attempts"
                return 1
              fi
              echo "$desc failed (attempt $attempt/$max_attempts) - retrying in 10s..."
              attempt=$((attempt + 1))
              sleep 10
            done
          }
          retry "Re-register Microsoft.App" az provider register --namespace Microsoft.App --wait
