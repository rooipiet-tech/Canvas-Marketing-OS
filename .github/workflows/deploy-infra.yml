name: deploy-infra

# Registration of Azure resource providers/features lives entirely in
# azure-provider-registration.yml (free, idempotent, never gated). This
# workflow's `what-if` job only starts once that workflow succeeds, and only
# the real deploy sits behind the cmos-dev approval gate — per the design
# rule: free idempotent preflight steps live outside approval gates so
# retries are unattended; only spend-triggering steps sit behind the gate.
#
# That real deploy is one of two mutually exclusive jobs, deploy-gated
# (environment: cmos-dev, requires approval) or deploy-autopass (no
# environment, runs unattended) — `what-if`'s "Determine autopass
# eligibility" step decides which, based on two signals: did this push
# touch any infra-defining file, and does what-if report any
# Create/Delete/Deploy/Unsupported change. See that step's own comment for
# why a naive "what-if reports zero changes" check doesn't work on this
# template (L-0034) and why both signals are required.

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: >
          Target environment. cmos-dev is the unchanged default path this
          session actually deploys to; cmos-prod is the additive
          promotion mechanism DE-1 authorizes as "prove the mechanism
          exists", NOT a live prod deploy -- selecting it here still only
          builds/validates against cmos-prod's own resource group/params,
          no cmos-prod deploy is executed by this session's own commits.
        required: false
        default: cmos-dev
        type: choice
        options:
          - cmos-dev
          - cmos-prod
  workflow_run:
    workflows: ["azure-provider-registration"]
    types: [completed]

# Shared with deploy-gateway.yml's group on purpose (not per-workflow): both
# touch the SAME live cmos-dev resources (this workflow's `deploy` job does
# an `az deployment group create` that PUTs vault-query-job.bicep/
# migration-job.bicep, among others; deploy-gateway.yml calls those same
# jobs' `/start` action and updates ca-model-gateway's image). Live evidence
# this is a real race, not a hypothetical one: Azure Activity Log showed a
# `Microsoft.App/jobs/write` (this workflow's Bicep PUT on caj-vault-query)
# landing seconds before a chained deploy-gateway run started using that
# same job. `cancel-in-progress: false` queues a second trigger rather than
# killing an in-flight Bicep deployment or job execution mid-way, which
# could leave cmos-dev half-applied.
concurrency:
  # DE-1/AC-13: additive parameterization -- resolves to 'cmos-dev-deploy'
  # for every trigger this session actually exercises (workflow_run always
  # takes this branch; workflow_dispatch without an explicit cmos-prod
  # selection also does), byte-for-byte unchanged from before. Only a
  # human explicitly dispatching with environment_name=cmos-prod (never
  # done by this session) resolves to a separate group.
  group: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment_name == 'cmos-prod' && 'cmos-prod-deploy') || 'cmos-dev-deploy' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  # DE-1/AC-13: same additive-parameterization shape as the concurrency
  # group above -- 'cmos-dev' for every existing trigger path, unchanged.
  RESOURCE_GROUP: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment_name == 'cmos-prod' && 'cmos-prod') || 'cmos-dev' }}
  LOCATION: southafricanorth
  # DE-1/AC-13: infra/prod.parameters.json is a new sibling file to
  # dev.parameters.json (step 22) -- resolves to the unchanged
  # dev.parameters.json path for every existing trigger path.
  PARAMETERS_FILE: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment_name == 'cmos-prod' && 'infra/prod.parameters.json') || 'infra/dev.parameters.json' }}

jobs:
  what-if:
    name: what-if
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    # can_autopass feeds deploy-autopass/deploy-gated's mutually exclusive
    # `if:` conditions below — see the "Determine autopass eligibility" step
    # for what it actually checks and why (a naive "what-if reports zero
    # changes" gate never fires on this template at all; see L-0034).
    outputs:
      can_autopass: ${{ steps.autopass.outputs.can_autopass }}
    steps:
      # fetch-depth: 2 (not the default shallow depth-1 clone) so the
      # "did this push touch infra-defining files" check below can diff
      # against HEAD~1. `ref` pins to the EXACT commit that triggered the
      # upstream azure-provider-registration run (its head_sha) rather than
      # whatever main happens to be by the time this workflow starts —
      # falls back to github.sha for a manual workflow_dispatch, which has
      # no upstream run to inherit a ref from.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bootstrap az CLI extensions (non-interactive)
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az config set extension.dynamic_install_allow_preview=true
          az extension add --name containerapp --yes

      - name: Verify prerequisite registration (fast check, not a poll)
        run: |
          # Safety net for a manual workflow_dispatch that bypasses
          # azure-provider-registration.yml entirely: fail fast with a clear
          # message rather than letting `what-if`/`deploy` hit a confusing
          # MissingSubscriptionRegistration error deep into the run.
          MISSING=0
          for ns in Microsoft.App Microsoft.DBforPostgreSQL Microsoft.ServiceBus; do
            STATE=$(az provider show --namespace "$ns" --query registrationState -o tsv 2>/dev/null || echo "Unknown")
            echo "$ns registrationState = $STATE"
            if [ "$STATE" != "Registered" ]; then
              MISSING=1
            fi
          done
          # WorkloadProfiles feature-flag state is advisory only (see
          # .compound learning: AFEC flags for long-GA capabilities can wedge
          # in Pending indefinitely and may be vestigial) — checked and
          # logged, but does not gate this workflow. The real test is the
          # what-if/deploy outcome below: if it genuinely fails because of
          # this flag, revert this check to blocking.
          FEATURE_STATE=$(az feature show --namespace Microsoft.App --name WorkloadProfiles --query properties.state -o tsv 2>/dev/null || echo "Unknown")
          echo "Microsoft.App/WorkloadProfiles feature state = $FEATURE_STATE (advisory only)"
          if [ "$FEATURE_STATE" != "Registered" ]; then
            echo "::warning::WorkloadProfiles feature state is '$FEATURE_STATE', not 'Registered' — proceeding anyway (advisory only)."
          fi
          if [ "$MISSING" -ne 0 ]; then
            echo ""
            echo "Prerequisite provider/feature registration is not complete."
            echo "Run (or wait for) the 'azure-provider-registration' workflow first:"
            echo "  gh workflow run azure-provider-registration.yml"
            echo "Then re-run this workflow (or let its workflow_run trigger start it automatically on success)."
            exit 1
          fi

      - name: Create resource group (idempotent)
        run: az group create -n "$RESOURCE_GROUP" -l "$LOCATION"

      - name: Generate throwaway password for what-if
        id: pw
        run: |
          PG_PW=$(openssl rand -hex 32)
          echo "::add-mask::$PG_PW"
          echo "value=$PG_PW" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------
      # Resolve the model-gateway image for this deployment.
      #
      # gateway.bicep's containerImage parameter must never regress a real,
      # already-running gateway image back to the bootstrap placeholder on a
      # routine infra-only redeploy. If ca-model-gateway already exists AND
      # has ever produced a ready revision (latestReadyRevisionName is
      # non-empty), use its CURRENT live image (a no-op for the image
      # field); otherwise — first-ever provision, OR a prior deploy created
      # the app but its first revision never went healthy (e.g. it's still
      # stuck on a private-ACR image reference from before the identity had
      # pull rights) — bootstrap with a public, unauthenticated MCR
      # quickstart image that needs no dependency on our own registry at
      # all. Trusting the configured image string alone (without the
      # ready-revision check) reproduced deploy-infra's round-2 failure: a
      # partially-failed first deploy left the app pointing at an image that
      # had never actually pulled, and every subsequent run kept "preserving"
      # that same broken reference forever. deploy-gateway.yml remains the
      # only thing that ever sets a real gateway image, via
      # `az containerapp update --image` — this step never does that.
      # ---------------------------------------------------------------
      - name: Resolve gateway container image (preserve live image, bootstrap with placeholder)
        id: gateway_image
        run: |
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          READY=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-model-gateway \
            --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
          CURRENT=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-model-gateway \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -n "$READY" ] && [ -n "$CURRENT" ]; then
            echo "ca-model-gateway has a ready revision ($READY) — preserving its current image: $CURRENT"
            echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "ca-model-gateway has no ready revision yet (latestReadyRevisionName='$READY') — bootstrapping with placeholder: $PLACEHOLDER"
            echo "value=$PLACEHOLDER" >> "$GITHUB_OUTPUT"
          fi

      # Same fix, same reasoning, for ca-orchestrator — see
      # infra/main.bicep's orchestratorContainerImage param header for the
      # incident this closes (run 30624109154: ca-orchestrator failed to
      # provision with MANIFEST_UNKNOWN because nothing before this step
      # ever verified an image tag actually existed at the registry this
      # template points at).
      - name: Resolve orchestrator container image (preserve live image, bootstrap with placeholder)
        id: orchestrator_image
        run: |
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          READY=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-orchestrator \
            --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
          CURRENT=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-orchestrator \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -n "$READY" ] && [ -n "$CURRENT" ]; then
            echo "ca-orchestrator has a ready revision ($READY) — preserving its current image: $CURRENT"
            echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "ca-orchestrator has no ready revision yet (latestReadyRevisionName='$READY') — bootstrapping with placeholder: $PLACEHOLDER"
            echo "value=$PLACEHOLDER" >> "$GITHUB_OUTPUT"
          fi

      # Same fix, same reasoning, for ca-console — see console-app.bicep's
      # MAIDEN-DEPLOY INCIDENT header comment: ca-console's registries[]
      # (ACR pull identity) is set exclusively by deploy-console.yml's
      # `az containerapp registry set`, never by this template, so
      # bootstrapping with a public placeholder here needs no registry auth
      # at all on first create.
      - name: Resolve console container image (preserve live image, bootstrap with placeholder)
        id: console_image
        run: |
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          READY=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-console \
            --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
          CURRENT=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-console \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -n "$READY" ] && [ -n "$CURRENT" ]; then
            echo "ca-console has a ready revision ($READY) — preserving its current image: $CURRENT"
            echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "ca-console has no ready revision yet (latestReadyRevisionName='$READY') — bootstrapping with placeholder: $PLACEHOLDER"
            echo "value=$PLACEHOLDER" >> "$GITHUB_OUTPUT"
          fi

      # Same fix, same reasoning, for the 3 mcp-* Container Apps — see
      # infra/main.bicep's mcpWebContainerImage param header for the
      # incident this closes (mcp-web/mcp-buffer/mcp-canva all failed to
      # provision with MANIFEST_UNKNOWN: none of their images had ever
      # been built).
      - name: Resolve mcp-web container image (preserve live image, bootstrap with placeholder)
        id: mcp_web_image
        run: |
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          READY=$(az containerapp show -g "$RESOURCE_GROUP" -n mcp-web \
            --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
          CURRENT=$(az containerapp show -g "$RESOURCE_GROUP" -n mcp-web \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -n "$READY" ] && [ -n "$CURRENT" ]; then
            echo "mcp-web has a ready revision ($READY) — preserving its current image: $CURRENT"
            echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "mcp-web has no ready revision yet (latestReadyRevisionName='$READY') — bootstrapping with placeholder: $PLACEHOLDER"
            echo "value=$PLACEHOLDER" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve mcp-buffer container image (preserve live image, bootstrap with placeholder)
        id: mcp_buffer_image
        run: |
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          READY=$(az containerapp show -g "$RESOURCE_GROUP" -n mcp-buffer \
            --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
          CURRENT=$(az containerapp show -g "$RESOURCE_GROUP" -n mcp-buffer \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -n "$READY" ] && [ -n "$CURRENT" ]; then
            echo "mcp-buffer has a ready revision ($READY) — preserving its current image: $CURRENT"
            echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "mcp-buffer has no ready revision yet (latestReadyRevisionName='$READY') — bootstrapping with placeholder: $PLACEHOLDER"
            echo "value=$PLACEHOLDER" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve mcp-canva container image (preserve live image, bootstrap with placeholder)
        id: mcp_canva_image
        run: |
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          READY=$(az containerapp show -g "$RESOURCE_GROUP" -n mcp-canva \
            --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
          CURRENT=$(az containerapp show -g "$RESOURCE_GROUP" -n mcp-canva \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -n "$READY" ] && [ -n "$CURRENT" ]; then
            echo "mcp-canva has a ready revision ($READY) — preserving its current image: $CURRENT"
            echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "mcp-canva has no ready revision yet (latestReadyRevisionName='$READY') — bootstrapping with placeholder: $PLACEHOLDER"
            echo "value=$PLACEHOLDER" >> "$GITHUB_OUTPUT"
          fi

      # caj-mcp-smoke is a one-shot Manual-trigger JOB, not a long-running
      # app — it has no latestReadyRevisionName concept. "preserve if it
      # already exists with any image" is the job-shaped equivalent:
      # deploy-mcp.yml's gated deploy job is the only thing that ever sets
      # a real image here, and it always runs after this template is
      # applied (chained via workflow_run), so by the time this template
      # is re-applied for any later commit, caj-mcp-smoke's persisted image
      # is either already real (preserve it) or still the placeholder from
      # a not-yet-completed first bootstrap (also preserve it — re-writing
      # it to the same placeholder is a no-op either way).
      - name: Resolve mcp-smoke container image (preserve current, bootstrap with placeholder)
        id: mcp_smoke_image
        run: |
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          CURRENT=$(az containerapp job show -g "$RESOURCE_GROUP" -n caj-mcp-smoke \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -n "$CURRENT" ]; then
            echo "caj-mcp-smoke already exists — preserving its current image: $CURRENT"
            echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "caj-mcp-smoke does not exist yet — bootstrapping with placeholder: $PLACEHOLDER"
            echo "value=$PLACEHOLDER" >> "$GITHUB_OUTPUT"
          fi

      - name: az deployment group what-if
        run: |
          az deployment group what-if \
            -g "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters @$PARAMETERS_FILE \
            --parameters administratorLoginPassword='${{ steps.pw.outputs.value }}' \
            --parameters gatewayContainerImage='${{ steps.gateway_image.outputs.value }}' \
            --parameters orchestratorContainerImage='${{ steps.orchestrator_image.outputs.value }}' \
            --parameters consoleContainerImage='${{ steps.console_image.outputs.value }}' \
            --parameters mcpWebContainerImage='${{ steps.mcp_web_image.outputs.value }}' \
            --parameters mcpBufferContainerImage='${{ steps.mcp_buffer_image.outputs.value }}' \
            --parameters mcpCanvaContainerImage='${{ steps.mcp_canva_image.outputs.value }}' \
            --parameters mcpSmokeContainerImage='${{ steps.mcp_smoke_image.outputs.value }}' \
            --parameters consoleClientId='00000000-0000-0000-0000-000000000000'

      # ---------------------------------------------------------------
      # AUTOPASS ELIGIBILITY — two independent signals, both required.
      #
      # A literal "what-if reports zero changes" gate never fires on this
      # template: live-verified (L-0034), what-if ALWAYS shows Modify on
      # the Postgres server (this workflow mints a fresh throwaway admin
      # password every run — see the "Generate throwaway password" step —
      # so what-if always sees a "changed" password), plus persistent
      # false-positive Modify noise on ServiceBus queues, private DNS zone
      # groups, and role assignments that Azure's own what-if engine cannot
      # diff cleanly. A gate keyed on "zero Modify entries" would simply
      # never trigger.
      #
      # Signal (a) — did this push touch infra-defining files at all
      # (`infra/**`, or the two deploy workflows themselves), compared to
      # the previous main commit. This is the precise "this merge didn't
      # change infrastructure" signal, and closes the gap signal (b) alone
      # would leave open: a genuine property-level edit (e.g. bumping a
      # container's CPU/memory in gateway.bicep) necessarily touches
      # infra/**, so it can never slip through as unreviewed "just Modify
      # noise" the way it could if autopass relied on what-if alone.
      #
      # Signal (b) — what-if reports no Create/Delete/Deploy/Unsupported
      # changes (the unambiguous "resource topology changed" signal,
      # distinct from the property-level Modify noise above). This is the
      # safety net: it catches drift that shows up at apply time even when
      # the DIFF looks clean (e.g. a resource that was deleted out-of-band
      # since the last deploy).
      #
      # Autopass requires BOTH — either signal alone gates. Every run logs
      # which signal(s) blocked or allowed autopass, so a gated run is
      # self-explanatory without re-deriving this reasoning from scratch.
      # ---------------------------------------------------------------
      - name: Check whether this push touched infra-defining files
        id: infra_diff
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- infra/ .github/workflows/deploy-infra.yml .github/workflows/deploy-gateway.yml)
          else
            # No parent commit reachable (unexpected — fetch-depth: 2 above
            # should always provide one on a repo with any history). Fail
            # safe: treat as "changed" so the gate is never silently
            # skipped over a checkout anomaly rather than a real signal.
            CHANGED="(HEAD~1 unavailable — failing safe, treating as changed)"
          fi
          if [ -n "$CHANGED" ]; then
            echo "infra-defining files changed since the previous main commit:"
            echo "$CHANGED"
            echo "infra_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "no infra-defining files changed since the previous main commit"
            echo "infra_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check what-if for resource-topology changes (Create/Delete/Deploy)
        id: whatif_risk
        run: |
          RISKY=$(az deployment group what-if \
            -g "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters @$PARAMETERS_FILE \
            --parameters administratorLoginPassword='${{ steps.pw.outputs.value }}' \
            --parameters gatewayContainerImage='${{ steps.gateway_image.outputs.value }}' \
            --parameters orchestratorContainerImage='${{ steps.orchestrator_image.outputs.value }}' \
            --parameters consoleContainerImage='${{ steps.console_image.outputs.value }}' \
            --parameters mcpWebContainerImage='${{ steps.mcp_web_image.outputs.value }}' \
            --parameters mcpBufferContainerImage='${{ steps.mcp_buffer_image.outputs.value }}' \
            --parameters mcpCanvaContainerImage='${{ steps.mcp_canva_image.outputs.value }}' \
            --parameters mcpSmokeContainerImage='${{ steps.mcp_smoke_image.outputs.value }}' \
            --parameters consoleClientId='00000000-0000-0000-0000-000000000000' \
            --no-pretty-print -o json --query "changes[?contains(['Create','Delete','Deploy','Unsupported'], changeType)]")
          if [ "$RISKY" != "[]" ] && [ -n "$RISKY" ]; then
            echo "what-if reports resource-topology changes (Create/Delete/Deploy/Unsupported):"
            echo "$RISKY"
            echo "risky_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "what-if reports no Create/Delete/Deploy/Unsupported changes (Modify-only noise, if any, does not block autopass)"
            echo "risky_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine autopass eligibility
        id: autopass
        run: |
          INFRA_CHANGED="${{ steps.infra_diff.outputs.infra_changed }}"
          RISKY_CHANGES="${{ steps.whatif_risk.outputs.risky_changes }}"
          if [ "$INFRA_CHANGED" = "false" ] && [ "$RISKY_CHANGES" = "false" ]; then
            echo "AUTOPASS: no infra-defining files changed since the previous main commit, and what-if reports no resource-topology changes. Skipping the cmos-dev approval gate — see deploy-autopass below."
            echo "can_autopass=true" >> "$GITHUB_OUTPUT"
          else
            echo "GATED: infra_changed=$INFRA_CHANGED, risky_whatif_changes=$RISKY_CHANGES — at least one signal indicates this deploy needs human review. Routing to deploy-gated (requires cmos-dev environment approval)."
            echo "can_autopass=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------
  # deploy-gated and deploy-autopass run the IDENTICAL step sequence — a
  # YAML anchor (&deploy_steps / *deploy_steps) ties them to one literal
  # definition so the two can never drift out of sync with each other via a
  # copy-paste edit to just one of them. Verified this parses and expands
  # correctly via `python -c "import yaml; yaml.safe_load(...)"` before
  # relying on it (a real YAML 1.1 parser, the same class GitHub Actions'
  # own workflow processor uses — anchor/alias resolution happens at the
  # YAML-parsing stage, before any Actions-specific schema logic runs).
  #
  # Exactly one of the two runs per what-if execution — their `if:`
  # conditions are exact complements of `needs.what-if.outputs.can_autopass`
  # (see the "Determine autopass eligibility" step in what-if above for what
  # that actually checks and why a naive "what-if reports zero changes"
  # check doesn't work on this template).
  # ---------------------------------------------------------------
  deploy-gated:
    name: deploy (gated — requires cmos-dev approval)
    needs: what-if
    if: needs.what-if.outputs.can_autopass != 'true'
    runs-on: ubuntu-latest
    # DE-1/AC-13: same additive-parameterization shape as RESOURCE_GROUP/
    # concurrency-group above -- resolves to the unchanged 'cmos-dev' GH
    # Environment gate for every trigger this session exercises.
    environment: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment_name == 'cmos-prod' && 'cmos-prod') || 'cmos-dev' }}
    steps: &deploy_steps
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bootstrap az CLI extensions (non-interactive)
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az config set extension.dynamic_install_allow_preview=true
          az extension add --name containerapp --yes

      - name: Generate fresh Postgres admin password
        id: pw
        run: |
          PG_PW=$(openssl rand -hex 32)
          echo "::add-mask::$PG_PW"
          echo "value=$PG_PW" >> "$GITHUB_OUTPUT"

      # Same resolution as the what-if job above (see its comment) — this is
      # the copy that actually governs the real deploy.
      - name: Resolve gateway container image (preserve live image, bootstrap with placeholder)
        id: gateway_image
        run: |
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          READY=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-model-gateway \
            --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
          CURRENT=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-model-gateway \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -n "$READY" ] && [ -n "$CURRENT" ]; then
            echo "ca-model-gateway has a ready revision ($READY) — preserving its current image: $CURRENT"
            echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "ca-model-gateway has no ready revision yet (latestReadyRevisionName='$READY') — bootstrapping with placeholder: $PLACEHOLDER"
            echo "value=$PLACEHOLDER" >> "$GITHUB_OUTPUT"
          fi

      # Same resolution as the what-if job above (see its comment) — this is
      # the copy that actually governs the real deploy.
      - name: Resolve orchestrator container image (preserve live image, bootstrap with placeholder)
        id: orchestrator_image
        run: |
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          READY=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-orchestrator \
            --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
          CURRENT=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-orchestrator \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -n "$READY" ] && [ -n "$CURRENT" ]; then
            echo "ca-orchestrator has a ready revision ($READY) — preserving its current image: $CURRENT"
            echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "ca-orchestrator has no ready revision yet (latestReadyRevisionName='$READY') — bootstrapping with placeholder: $PLACEHOLDER"
            echo "value=$PLACEHOLDER" >> "$GITHUB_OUTPUT"
          fi

