      - name: Resolve mcp-canva container image (preserve live image, bootstrap with placeholder)
        id: mcp_canva_image
        run: |
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          READY=$(az containerapp show -g "$RESOURCE_GROUP" -n mcp-canva \
            --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
          CURRENT=$(az containerapp show -g "$RESOURCE_GROUP" -n mcp-canva \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -n "$READY" ] && [ -n "$CURRENT" ]; then
            echo "mcp-canva has a ready revision ($READY) — preserving its current image: $CURRENT"
            echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "mcp-canva has no ready revision yet (latestReadyRevisionName='$READY') — bootstrapping with placeholder: $PLACEHOLDER"
            echo "value=$PLACEHOLDER" >> "$GITHUB_OUTPUT"
