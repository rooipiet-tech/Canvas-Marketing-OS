          CURRENT=$(az containerapp show -g "$RESOURCE_GROUP" -n mcp-web \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -n "$READY" ] && [ -n "$CURRENT" ]; then
            echo "mcp-web has a ready revision ($READY) — preserving its current image: $CURRENT"
            echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "mcp-web has no ready revision yet (latestReadyRevisionName='$READY') — bootstrapping with placeholder: $PLACEHOLDER"
