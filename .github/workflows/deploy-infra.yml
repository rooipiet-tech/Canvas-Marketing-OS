name: deploy-infra

# Registration of Azure resource providers/features lives entirely in
# azure-provider-registration.yml (free, idempotent, never gated). This
# workflow's `what-if` job only starts once that workflow succeeds, and
# only its `deploy` job sits behind the cmos-dev approval gate — per the
# design rule: free idempotent preflight steps live outside approval gates
# so retries are unattended; only spend-triggering steps sit behind the gate.

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["azure-provider-registration"]
    types: [completed]

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: cmos-dev
  LOCATION: southafricanorth

jobs:
  what-if:
    name: what-if
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bootstrap az CLI extensions (non-interactive)
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az config set extension.dynamic_install_allow_preview=true
          az extension add --name containerapp --yes

      - name: Verify prerequisite registration (fast check, not a poll)
        run: |
          # Safety net for a manual workflow_dispatch that bypasses
          # azure-provider-registration.yml entirely: fail fast with a clear
          # message rather than letting `what-if`/`deploy` hit a confusing
          # MissingSubscriptionRegistration error deep into the run.
          MISSING=0
          for ns in Microsoft.App Microsoft.DBforPostgreSQL Microsoft.ServiceBus; do
            STATE=$(az provider show --namespace "$ns" --query registrationState -o tsv 2>/dev/null || echo "Unknown")
            echo "$ns registrationState = $STATE"
            if [ "$STATE" != "Registered" ]; then
              MISSING=1
            fi
          done
          # WorkloadProfiles feature-flag state is advisory only (see
          # .compound learning: AFEC flags for long-GA capabilities can wedge
          # in Pending indefinitely and may be vestigial) — checked and
          # logged, but does not gate this workflow. The real test is the
          # what-if/deploy outcome below: if it genuinely fails because of
          # this flag, revert this check to blocking.
          FEATURE_STATE=$(az feature show --namespace Microsoft.App --name WorkloadProfiles --query properties.state -o tsv 2>/dev/null || echo "Unknown")
          echo "Microsoft.App/WorkloadProfiles feature state = $FEATURE_STATE (advisory only)"
          if [ "$FEATURE_STATE" != "Registered" ]; then
            echo "::warning::WorkloadProfiles feature state is '$FEATURE_STATE', not 'Registered' — proceeding anyway (advisory only)."
          fi
          if [ "$MISSING" -ne 0 ]; then
            echo ""
            echo "Prerequisite provider/feature registration is not complete."
            echo "Run (or wait for) the 'azure-provider-registration' workflow first:"
            echo "  gh workflow run azure-provider-registration.yml"
            echo "Then re-run this workflow (or let its workflow_run trigger start it automatically on success)."
            exit 1
          fi

      - name: Create resource group (idempotent)
        run: az group create -n "$RESOURCE_GROUP" -l "$LOCATION"

      - name: Generate throwaway password for what-if
        id: pw
        run: |
          PG_PW=$(openssl rand -hex 32)
          echo "::add-mask::$PG_PW"
          echo "value=$PG_PW" >> "$GITHUB_OUTPUT"

      - name: az deployment group what-if
        run: |
          az deployment group what-if \
            -g "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters @infra/dev.parameters.json \
            --parameters administratorLoginPassword='${{ steps.pw.outputs.value }}'

  deploy:
    name: deploy
    needs: what-if
    runs-on: ubuntu-latest
    environment: cmos-dev
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate fresh Postgres admin password
        id: pw
        run: |
          PG_PW=$(openssl rand -hex 32)
          echo "::add-mask::$PG_PW"
          echo "value=$PG_PW" >> "$GITHUB_OUTPUT"

      - name: az deployment group create (real deploy)
        run: |
          az deployment group create \
            -g "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters @infra/dev.parameters.json \
            --parameters administratorLoginPassword='${{ steps.pw.outputs.value }}'

      - name: Start Vault-schema migration job
        run: az containerapp job start -g "$RESOURCE_GROUP" -n caj-vault-migrate

      - name: Poll migration job execution to Succeeded
        run: |
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=15
          ATTEMPT=1
          STATUS=""
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            STATUS=$(az containerapp job execution list -g "$RESOURCE_GROUP" -n caj-vault-migrate --query "[0].properties.status" -o tsv 2>/dev/null || echo "Unknown")
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: migration job status = $STATUS"
            if [ "$STATUS" = "Succeeded" ] || [ "$STATUS" = "Failed" ]; then
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          if [ "$STATUS" != "Succeeded" ]; then
            echo "caj-vault-migrate did not reach Succeeded (last status: $STATUS)"
            exit 1
          fi

      - name: Re-check Postgres public network access remains Disabled
        run: |
          PG=$(az resource list -g "$RESOURCE_GROUP" --resource-type Microsoft.DBforPostgreSQL/flexibleServers --query '[0].name' -o tsv)
          ACCESS=$(az postgres flexible-server show -g "$RESOURCE_GROUP" -n "$PG" --query network.publicNetworkAccess -o tsv)
          echo "Postgres publicNetworkAccess = $ACCESS"
          test "$ACCESS" = "Disabled"
