            echo "value=$PLACEHOLDER" >> "$GITHUB_OUTPUT"
          fi

      - name: az deployment group create (real deploy)
        run: |
          az deployment group create \
            -g "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters @$PARAMETERS_FILE \
            --parameters administratorLoginPassword='${{ steps.pw.outputs.value }}' \
            --parameters gatewayContainerImage='${{ steps.gateway_image.outputs.value }}' \
            --parameters orchestratorContainerImage='${{ steps.orchestrator_image.outputs.value }}' \
            --parameters consoleContainerImage='${{ steps.console_image.outputs.value }}' \
            --parameters mcpWebContainerImage='${{ steps.mcp_web_image.outputs.value }}' \
            --parameters mcpBufferContainerImage='${{ steps.mcp_buffer_image.outputs.value }}' \
            --parameters mcpCanvaContainerImage='${{ steps.mcp_canva_image.outputs.value }}' \
            --parameters mcpSmokeContainerImage='${{ steps.mcp_smoke_image.outputs.value }}' \
            --parameters consoleClientId="${{ secrets.CONSOLE_ENTRA_CLIENT_ID || '00000000-0000-0000-0000-000000000000' }}"

      - name: Start Vault-schema migration job
        run: az containerapp job start -g "$RESOURCE_GROUP" -n caj-vault-migrate

      - name: Poll migration job execution to Succeeded
        run: |
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=15
          ATTEMPT=1
          STATUS=""
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            STATUS=$(az containerapp job execution list -g "$RESOURCE_GROUP" -n caj-vault-migrate --query "[0].properties.status" -o tsv 2>/dev/null || echo "Unknown")
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: migration job status = $STATUS"
            if [ "$STATUS" = "Succeeded" ] || [ "$STATUS" = "Failed" ]; then
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          if [ "$STATUS" != "Succeeded" ]; then
            echo "caj-vault-migrate did not reach Succeeded (last status: $STATUS)"
            exit 1
          fi

      - name: Re-check Postgres public network access remains Disabled
        run: |
          PG=$(az resource list -g "$RESOURCE_GROUP" --resource-type Microsoft.DBforPostgreSQL/flexibleServers --query '[0].name' -o tsv)
          ACCESS=$(az postgres flexible-server show -g "$RESOURCE_GROUP" -n "$PG" --query network.publicNetworkAccess -o tsv)
          echo "Postgres publicNetworkAccess = $ACCESS"
          test "$ACCESS" = "Disabled"

      # -- session/s2-vault: begin --
      # Vault deploy sequence: secret-writer (loads vault-db-connection-string
      # into Key Vault from inside the VNet — never opens publicNetworkAccess,
      # L-0012) -> sidecar-migration (applies vault_internal schema) ->
      # smoke-test (the full test_contract_smoke.py suite against ca-vault's
      # internal-ingress endpoint). Each job is started then polled to a
      # terminal state with a bounded attempt count (L-0006); the deploy job
      # fails if the smoke-test job does not reach Succeeded.
      - name: Re-check Key Vault public network access remains Disabled
        run: |
          KV=$(az resource list -g "$RESOURCE_GROUP" --resource-type Microsoft.KeyVault/vaults --query '[0].name' -o tsv)
          ACCESS=$(az keyvault show -g "$RESOURCE_GROUP" -n "$KV" --query properties.publicNetworkAccess -o tsv)
          echo "Key Vault publicNetworkAccess = $ACCESS"
          test "$ACCESS" = "Disabled"

      # ACR MIGRATION verification (L-0021 class): confirms ca-vault is
      # actually pulling its image from the canonical shared ACR
      # (container-registry.bicep's module, the same registry
      # ca-model-gateway uses) rather than the orphaned pre-convention
      # acrcmosdev registry vault used to be provisioned against. This is
      # the "verify the app runs from the new image" gate the acrcmosdev...
      # registry's eventual decommission depends on; this workflow does not
      # delete that registry itself (a live Azure resource deletion is a
      # human call, not automated here). Readiness itself (latestReady vs
      # latest) is checked separately below, as a bounded poll rather than
      # a one-shot check — see that step's comment for why.
      - name: Verify ca-vault is running from the canonical shared ACR
        run: |
          set -e
          CANONICAL=$(az deployment group show -g "$RESOURCE_GROUP" -n container-registry --query "properties.outputs.loginServer.value" -o tsv)
          test -n "$CANONICAL" || { echo "could not resolve the canonical registry from the container-registry deployment output"; exit 1; }
          LIVE_IMAGE=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-vault --query "properties.template.containers[0].image" -o tsv)
          echo "canonical registry:  $CANONICAL"
          echo "ca-vault live image: $LIVE_IMAGE"
          case "$LIVE_IMAGE" in
            "$CANONICAL"/*) echo "ca-vault is pulling from the canonical shared ACR." ;;
            *) echo "ca-vault's image ($LIVE_IMAGE) is not on the canonical registry ($CANONICAL) — ACR migration incomplete"; exit 1 ;;
          esac

      # ca-vault/container-app.bicep now carries a `deployToken`-driven
      # revisionSuffix (same governance-round-4 pattern as
      # gatekeeper-app.bicep/publisher-app.bicep — see its header comment):
      # every deploy genuinely creates a new revision now, not just when the
      # image tag changes, so a rotated Postgres-adjacent secret value can
      # never strand ca-vault on a stale revision. That in turn means a new
      # revision is not instantly Ready (image pull, health probe warm-up),
      # so wait for latestReadyRevisionName to catch up to latestRevisionName
      # BEFORE the secret-writer/sidecar-migration/smoke-test sequence below
      # — mirroring deploy-governance.yml's "Wait for governance app
      # revisions to be Ready" step for ca-gatekeeper/ca-publisher.
      - name: Wait for ca-vault revision to be Ready
        run: |
          LATEST=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-vault --query "properties.latestRevisionName" -o tsv)
          echo "ca-vault latestRevisionName=$LATEST"
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=15
          ATTEMPT=1
          READY=""
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            READY=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-vault --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: ca-vault latestReadyRevisionName=$READY (waiting for $LATEST)"
            if [ "$READY" = "$LATEST" ]; then
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          if [ "$READY" != "$LATEST" ]; then
            echo "ca-vault never reported $LATEST as its latestReadyRevisionName (last seen: $READY)"
            exit 1
          fi

      - name: Start Vault secret-writer job (loads vault-db-connection-string in-VNet)
        run: az containerapp job start -g "$RESOURCE_GROUP" -n caj-vault-secret-writer

      - name: Poll secret-writer job execution to Succeeded
        run: |
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=15
          ATTEMPT=1
          STATUS=""
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            STATUS=$(az containerapp job execution list -g "$RESOURCE_GROUP" -n caj-vault-secret-writer --query "[0].properties.status" -o tsv 2>/dev/null || echo "Unknown")
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: secret-writer job status = $STATUS"
            if [ "$STATUS" = "Succeeded" ] || [ "$STATUS" = "Failed" ]; then
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          if [ "$STATUS" != "Succeeded" ]; then
            echo "caj-vault-secret-writer did not reach Succeeded (last status: $STATUS)"
            exit 1
          fi

      - name: Start Vault sidecar-migration job (vault_internal schema)
        run: az containerapp job start -g "$RESOURCE_GROUP" -n caj-vault-sidecar-migrate

      - name: Poll sidecar-migration job execution to Succeeded
        run: |
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=15
          ATTEMPT=1
          STATUS=""
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            STATUS=$(az containerapp job execution list -g "$RESOURCE_GROUP" -n caj-vault-sidecar-migrate --query "[0].properties.status" -o tsv 2>/dev/null || echo "Unknown")
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: sidecar-migration job status = $STATUS"
            if [ "$STATUS" = "Succeeded" ] || [ "$STATUS" = "Failed" ]; then
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          if [ "$STATUS" != "Succeeded" ]; then
            echo "caj-vault-sidecar-migrate did not reach Succeeded (last status: $STATUS)"
            exit 1
          fi

      - name: Start Vault smoke-test job (full test_contract_smoke.py suite)
        run: az containerapp job start -g "$RESOURCE_GROUP" -n caj-vault-smoke-test

      - name: Poll smoke-test job execution to Succeeded (fails the deploy on smoke-test failure)
        run: |
          MAX_ATTEMPTS=40
          SLEEP_SECONDS=15
          ATTEMPT=1
          STATUS=""
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            STATUS=$(az containerapp job execution list -g "$RESOURCE_GROUP" -n caj-vault-smoke-test --query "[0].properties.status" -o tsv 2>/dev/null || echo "Unknown")
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: smoke-test job status = $STATUS"
            if [ "$STATUS" = "Succeeded" ] || [ "$STATUS" = "Failed" ]; then
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          if [ "$STATUS" != "Succeeded" ]; then
            echo "caj-vault-smoke-test did not reach Succeeded (last status: $STATUS) — failing deploy"
            EXECUTION_NAME=$(az containerapp job execution list -g "$RESOURCE_GROUP" -n caj-vault-smoke-test --query "[0].name" -o tsv 2>/dev/null || echo "")
            echo "Retrieve logs with: az containerapp job logs show -g $RESOURCE_GROUP -n caj-vault-smoke-test --execution $EXECUTION_NAME"
            exit 1
          fi
      # -- session/s2-vault: end --

      # -- session/s3-orchestrator: begin --
      # Append-only block (C10): starts the orchestrator schema migration
      # job, then the live heartbeat-injection-and-golden-compare smoke
      # test job (AC-028), each polled to a terminal state with a bounded
      # attempt count (mirrors caj-vault-migrate's own poll pattern above —
      # a bounded-attempt loop only, never an unconditional/unbounded
      # poll, per L-0006). This block runs inside the `deploy` job, which
      # already sits behind the
      # `environment: cmos-dev` approval gate (AC-035).
      #
      # ca-orchestrator/container-app.bicep now carries a `deployToken`-driven
      # revisionSuffix (same governance-round-4 pattern as ca-vault/
      # ca-gatekeeper/ca-publisher — see container-app.bicep's header
      # comment): every deploy genuinely creates a new revision, not just
      # when the image tag changes, so a rotated Postgres-adjacent secret
      # value can never strand ca-orchestrator on a stale revision. That in
      # turn means a new revision is not instantly Ready (image pull,
      # health probe warm-up), so wait for latestReadyRevisionName to catch
      # up to latestRevisionName BEFORE the migration/smoke-test sequence
      # below — mirroring the "Wait for ca-vault revision to be Ready" step
      # above.
      - name: Wait for ca-orchestrator revision to be Ready
        run: |
          LATEST=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-orchestrator --query "properties.latestRevisionName" -o tsv)
          echo "ca-orchestrator latestRevisionName=$LATEST"
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=15
          ATTEMPT=1
          READY=""
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            READY=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-orchestrator --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: ca-orchestrator latestReadyRevisionName=$READY (waiting for $LATEST)"
            if [ "$READY" = "$LATEST" ]; then
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          if [ "$READY" != "$LATEST" ]; then
            echo "ca-orchestrator never reported $LATEST as its latestReadyRevisionName (last seen: $READY)"
            exit 1
          fi

      - name: Start orchestrator schema migration job
        run: az containerapp job start -g "$RESOURCE_GROUP" -n caj-orchestrator-migrate

      - name: Poll orchestrator migration job execution to Succeeded
        run: |
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=15
          ATTEMPT=1
          STATUS=""
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            STATUS=$(az containerapp job execution list -g "$RESOURCE_GROUP" -n caj-orchestrator-migrate --query "[0].properties.status" -o tsv 2>/dev/null || echo "Unknown")
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: orchestrator migration job status = $STATUS"
            if [ "$STATUS" = "Succeeded" ] || [ "$STATUS" = "Failed" ]; then
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          if [ "$STATUS" != "Succeeded" ]; then
            echo "caj-orchestrator-migrate did not reach Succeeded (last status: $STATUS)"
            # L-0024: job logs show requires an explicit --container even for
            # a single-container job (matches migration-job.bicep's declared
            # container name 'orchestrator-migrate').
            echo "Retrieve logs with: az containerapp job logs show -g $RESOURCE_GROUP -n caj-orchestrator-migrate --container orchestrator-migrate"
            exit 1
          fi

      # INCIDENT (2026-07-31, execution caj-orchestrator-smoke-test-e7e7956):
      # this job ran to completion in ~13s — "Successfully pulled image
      # 'mcr.microsoft.com/azuredocs/containerapps-helloworld:latest'" then
      # "Container 'orchestrator-smoke-test' was terminated with exit code
      # '1' ... exec: \"python\": executable file not found in $PATH"
      # (confirmed live via ContainerAppSystemLogs_CL) — because
      # ca-orchestrator/caj-orchestrator-smoke-test were BOTH still on the
      # bootstrap placeholder image (steps.orchestrator_image resolved to it
      # since ca-orchestrator had no Ready revision on a real image yet;
      # orchestrator-image.yml's gated deploy job — the only thing that ever
      # sets a real image, see infra/main.bicep's orchestratorContainerImage
      # param header — hadn't run). The hello-world placeholder has no
      # Python interpreter, so `python -m orchestrator.smoke_test` can never
      # execute against it, ever. But Container Apps Jobs does not mark the
      # EXECUTION "Failed" until the full replicaTimeout (900s,
      # smoke-test-job.bicep) elapses via "DeadlineExceeded" — so the poll
      # below (a 600s budget) silently burned its whole budget reporting
      # "still Running" for a failure that actually happened in 13s.
      # ContainerAppConsoleLogs_CL/ServiceBus queue counts (0 active
      # messages on both `event`/`task`) confirmed the synthetic heartbeat
      # never even got published — the container crashed before any Python
      # ran.
      #
      # This precondition (real image or bust) is knowable BEFORE ever
      # starting the job — steps.orchestrator_image already resolved it
      # earlier in this same job — so check it here and fail in <1s with a
      # clear diagnostic instead of starting a job we already know cannot
      # succeed.
      - name: "Guard: refuse to run the live smoke test against the bootstrap placeholder image"
        run: |
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          CURRENT='${{ steps.orchestrator_image.outputs.value }}'
          if [ "$CURRENT" = "$PLACEHOLDER" ]; then
            echo "::error::ca-orchestrator is still running the bootstrap placeholder image ($PLACEHOLDER) — it has never received a real orchestrator image."
            echo "caj-orchestrator-smoke-test runs 'python -m orchestrator.smoke_test' inside whatever image ca-orchestrator currently uses; against the placeholder this fails in ~13s with 'exec: \"python\": executable file not found in \$PATH', but the job EXECUTION doesn't report Failed until the full 900s replicaTimeout elapses — so running it here would just silently burn this poll's whole budget again."
            echo "A real image is only ever set by orchestrator-image.yml's gated 'deploy' job (az containerapp update --image ...) — see infra/main.bicep's orchestratorContainerImage param header."
            echo "Check whether that workflow has run and been approved:"
            echo "  gh run list --workflow=orchestrator-image.yml --limit 5"
            echo "If it hasn't, trigger it (workflow_dispatch is one of its triggers), approve the cmos-dev environment gate on its deploy job, then re-run this workflow."
            exit 1
          fi
          echo "ca-orchestrator's resolved image is not the placeholder ($CURRENT) — proceeding with the live smoke test."

      - name: Start orchestrator live smoke test job (AC-028)
        run: az containerapp job start -g "$RESOURCE_GROUP" -n caj-orchestrator-smoke-test

      - name: Poll orchestrator smoke test job execution to Succeeded
        run: |
          MAX_ATTEMPTS=40
          SLEEP_SECONDS=15
          ATTEMPT=1
          STATUS=""
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            STATUS=$(az containerapp job execution list -g "$RESOURCE_GROUP" -n caj-orchestrator-smoke-test --query "[0].properties.status" -o tsv 2>/dev/null || echo "Unknown")
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: orchestrator smoke test job status = $STATUS"
            # Diagnostic checkpoint every 10 attempts (~150s) — the guard
            # above already rules out the one KNOWN cause of a silent hang
            # (placeholder image), so a genuinely new hang past this point
            # is a different bug; print live signal on what's actually
            # happening instead of a bare, unexplained "still Running".
            if [ $((ATTEMPT % 10)) -eq 0 ] && [ "$STATUS" != "Succeeded" ] && [ "$STATUS" != "Failed" ]; then
              echo "--- diagnostic at attempt $ATTEMPT/$MAX_ATTEMPTS: what caj-orchestrator-smoke-test may still be waiting for ---"
              CURRENT_IMAGE=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-orchestrator --query "properties.template.containers[0].image" -o tsv 2>/dev/null || echo "unknown")
              CURRENT_READY=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-orchestrator --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || echo "unknown")
              echo "ca-orchestrator current image: $CURRENT_IMAGE (latestReadyRevisionName: $CURRENT_READY)"
              echo "If this still says the placeholder image, the guard step above should have caught it — check for a race between this run and orchestrator-image.yml's deploy job."
              echo "Otherwise: check the synthetic heartbeat reached the event/task Service Bus queues (az rest GET .../queues/<name> --query properties.countDetails), and ca-orchestrator's own console logs for worker startup / message-receipt lines."
            fi
            if [ "$STATUS" = "Succeeded" ] || [ "$STATUS" = "Failed" ]; then
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          if [ "$STATUS" != "Succeeded" ]; then
            echo "caj-orchestrator-smoke-test did not reach Succeeded (last status: $STATUS)"
            # L-0024: job logs show requires an explicit --container even for
            # a single-container job (matches smoke-test-job.bicep's
            # declared container name 'orchestrator-smoke-test').
            EXECUTION_NAME=$(az containerapp job execution list -g "$RESOURCE_GROUP" -n caj-orchestrator-smoke-test --query "[0].name" -o tsv 2>/dev/null || echo "")
            echo "Retrieve logs with: az containerapp job logs show -g $RESOURCE_GROUP -n caj-orchestrator-smoke-test --execution $EXECUTION_NAME --container orchestrator-smoke-test"
            exit 1
          fi
      # -- session/s3-orchestrator: end --

  deploy-autopass:
    name: deploy (auto-pass — no infra changes detected)
    needs: what-if
    if: needs.what-if.outputs.can_autopass == 'true'
    runs-on: ubuntu-latest
    # Deliberately NO `environment:` here — that is the entire reason this
    # job exists separately from deploy-gated rather than as a conditional
    # environment expression on one job. AZURE_CLIENT_ID/AZURE_TENANT_ID/
    # AZURE_SUBSCRIPTION_ID are repo-level secrets, not environment-scoped —
    # the what-if job above already proves they're reachable with no
    # `environment:` at all — so nothing is lost by skipping it here; only
    # the required-reviewers protection rule is skipped, which is the point.
    steps: *deploy_steps
