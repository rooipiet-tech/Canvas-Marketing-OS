name: deploy-governance

# Deploys the S4 governance layer (Gatekeeper, Publisher, the gate-token
# signing key + RBAC, the governance schema migration job and the live
# gate-cycle smoke test) and then proves it works end to end in-VNet.
#
# This is a SEPARATE workflow file, deliberately: deploy-infra.yml is out
# of scope to edit. It mirrors deploy-infra.yml's shape — ungated
# what-if, then a `deploy` job behind the cmos-dev environment gate, so
# free idempotent preflight retries stay unattended and only the
# spend-triggering step sits behind an approval.
#
# workflow_run watches deploy-infra (a DIFFERENT workflow). A workflow can
# never listen to itself — GitHub rejects that at validation time with
# "Workflow 'X' cannot listen to itself" (L-0009) — so all retry logic
# lives inside jobs as bounded bash polls, never as a self-trigger.
#
# No secret value is written into this file. Every credential is an OIDC
# federated login (azure/login@v2 with id-token: write) or a
# ${{ secrets.* }} reference resolved at run time.

on:
  # Callable by deploy-pipeline.yml, which runs the whole cmos-dev deploy
  # in one fixed order instead of eight workflows racing in a shared
  # concurrency group. Inputs are read through the `inputs` context, which
  # is populated for workflow_dispatch AND workflow_call alike.
  workflow_call:
    inputs:
      environment_name:
        required: false
        type: string
        default: cmos-dev
  workflow_dispatch:
    inputs:
      environment_name:
        description: >
          Target environment (DE-1/AC-13: additive promotion mechanism
          only -- cmos-dev is the unchanged default; selecting cmos-prod
          here still does not perform a live cmos-prod deploy by itself).
        required: false
        default: cmos-dev
        type: choice
        options:
          - cmos-dev
          - cmos-prod
# Concurrency is owned by deploy-pipeline.yml, the single caller that
# runs every deploy stage in one fixed order. A called workflow must
# NOT take the `cmos-dev-deploy` group its own caller already holds --
# it would wait forever on a group the parent cannot release until the
# child finishes. Pinned by test_deploy_pipeline_shape.py.

permissions:
  id-token: write
  contents: read

env:
  # DE-1/AC-13: same additive-parameterization shape as deploy-infra.yml —
  # 'cmos-dev'/dev.parameters.json for every existing trigger path, unchanged.
  RESOURCE_GROUP: ${{ (inputs.environment_name == 'cmos-prod' && 'cmos-prod') || 'cmos-dev' }}
  PARAMETERS_FILE: ${{ (inputs.environment_name == 'cmos-prod' && 'infra/prod.parameters.json') || 'infra/dev.parameters.json' }}
  LOCATION: southafricanorth
  GOVERNANCE_MIGRATE_JOB: caj-governance-migrate
  GOVERNANCE_SMOKE_JOB: caj-governance-smoke

jobs:
  verify-bundles:
    name: verify-bundles
    # Inverted deliberately. Under `workflow_call` github.event_name is the
    # CALLER's event (push), never 'workflow_call' -- so the old allow-list
    # of event names evaluated false and would have skipped this job
    # silently, disabling the deploy while reporting green. Stated as "run
    # unless I was chained off a workflow_run that did not succeed", which
    # is identical on the workflow_run path and correct on the other three.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install governance service dependencies
        run: |
          pip install -r services/gatekeeper/requirements.txt
          pip install -r services/publisher/requirements.txt

      # Catches a bundle/manifest/unpack-script defect here, on a free
      # runner, instead of at container start inside the VNet where the
      # only symptom is a crash-looping revision.
      - name: Verify governance bundle reconstruction (with fault injection)
        run: python scripts/verify_governance_bundle_reconstruction.py --self-test

  what-if:
    name: what-if
    needs: verify-bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bootstrap az CLI extensions (non-interactive)
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az config set extension.dynamic_install_allow_preview=true
          az extension add --name containerapp --yes

      - name: Generate throwaway password for what-if
        id: pw
        run: |
          # hex, never base64: base64's '/', '+' and '=' break a
          # postgresql://user:PASSWORD@host URI a large fraction of the
          # time (L-0004).
          PG_PW=$(openssl rand -hex 32)
          echo "::add-mask::$PG_PW"
          echo "value=$PG_PW" >> "$GITHUB_OUTPUT"

      # infra/main.bicep now includes gateway.bicep (merged from
      # session s1-gateway after this branch was rebased onto main), whose
      # `gatewayContainerImage` param has no safe static default for a
      # redeploy — defaulting it would silently reset ca-model-gateway back
      # to the bootstrap placeholder image on every governance deploy,
      # undoing whatever deploy-gateway.yml last published (L-0018's
      # bootstrap-image pattern). Mirrors deploy-infra.yml's own preflight
      # step exactly, so both workflows agree on what "the current image" is.
      - name: Resolve current gateway image (preserve it across this unrelated deploy)
        id: gateway_image
        run: |
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          READY=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-model-gateway \
            --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
          CURRENT=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-model-gateway \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -n "$READY" ] && [ -n "$CURRENT" ]; then
            echo "ca-model-gateway has a ready revision ($READY) — preserving its current image: $CURRENT"
            echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "ca-model-gateway has no ready revision yet (latestReadyRevisionName='$READY') — bootstrapping with placeholder: $PLACEHOLDER"
            echo "value=$PLACEHOLDER" >> "$GITHUB_OUTPUT"
          fi

      # MAIDEN-DEPLOY INCIDENT (2026-08-01, live): this workflow redeploys
      # the ENTIRE shared infra/main.bicep template (per its own header
      # comment) but, until this fix, only ever preserved
      # gatewayContainerImage — orchestratorContainerImage/
      # consoleContainerImage/mcpWebContainerImage/mcpBufferContainerImage/
      # mcpCanvaContainerImage/mcpSmokeContainerImage were never passed at
      # all, so Bicep silently fell back to each param's own placeholder
      # default on every governance deploy — resetting 6 live services'
      # images out from under them. Confirmed live: ca-orchestrator's
      # active, Ready revision was running the real orchestrator image;
      # this workflow's own real `az deployment group create` (below)
      # nonetheless PUT the app's template back to the bootstrap
      # placeholder, and the NEXT deploy-infra run's own preflight (which
      # trusts the app-level properties.template as ground truth, exactly
      # like this one) picked up that placeholder as "current" and
      # deployed a broken revision. Same bug class L-0065 already fixed
      # for consoleClientId — just never extended to these 6 sibling
      # image params. Fix: copy deploy-infra.yml's own working preflight
      # steps for all 6, verbatim.
      - name: Resolve current orchestrator image (preserve it across this unrelated deploy)
        id: orchestrator_image
        run: |
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          READY=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-orchestrator \
            --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
          CURRENT=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-orchestrator \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -n "$READY" ] && [ -n "$CURRENT" ]; then
            echo "ca-orchestrator has a ready revision ($READY) — preserving its current image: $CURRENT"
            echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "ca-orchestrator has no ready revision yet (latestReadyRevisionName='$READY') — bootstrapping with placeholder: $PLACEHOLDER"
            echo "value=$PLACEHOLDER" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve current console image (preserve it across this unrelated deploy)
        id: console_image
        run: |
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          READY=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-console \
            --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
          CURRENT=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-console \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -n "$READY" ] && [ -n "$CURRENT" ]; then
            echo "ca-console has a ready revision ($READY) — preserving its current image: $CURRENT"
            echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "ca-console has no ready revision yet (latestReadyRevisionName='$READY') — bootstrapping with placeholder: $PLACEHOLDER"
            echo "value=$PLACEHOLDER" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve current mcp-web image (preserve it across this unrelated deploy)
        id: mcp_web_image
        run: |
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          READY=$(az containerapp show -g "$RESOURCE_GROUP" -n mcp-web \
            --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
          CURRENT=$(az containerapp show -g "$RESOURCE_GROUP" -n mcp-web \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -n "$READY" ] && [ -n "$CURRENT" ]; then
            echo "mcp-web has a ready revision ($READY) — preserving its current image: $CURRENT"
            echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "mcp-web has no ready revision yet (latestReadyRevisionName='$READY') — bootstrapping with placeholder: $PLACEHOLDER"
            echo "value=$PLACEHOLDER" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve current mcp-buffer image (preserve it across this unrelated deploy)
        id: mcp_buffer_image
        run: |
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          READY=$(az containerapp show -g "$RESOURCE_GROUP" -n mcp-buffer \
            --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
          CURRENT=$(az containerapp show -g "$RESOURCE_GROUP" -n mcp-buffer \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -n "$READY" ] && [ -n "$CURRENT" ]; then
            echo "mcp-buffer has a ready revision ($READY) — preserving its current image: $CURRENT"
            echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "mcp-buffer has no ready revision yet (latestReadyRevisionName='$READY') — bootstrapping with placeholder: $PLACEHOLDER"
            echo "value=$PLACEHOLDER" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve current mcp-canva image (preserve it across this unrelated deploy)
        id: mcp_canva_image
        run: |
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          READY=$(az containerapp show -g "$RESOURCE_GROUP" -n mcp-canva \
            --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
          CURRENT=$(az containerapp show -g "$RESOURCE_GROUP" -n mcp-canva \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -n "$READY" ] && [ -n "$CURRENT" ]; then
            echo "mcp-canva has a ready revision ($READY) — preserving its current image: $CURRENT"
            echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "mcp-canva has no ready revision yet (latestReadyRevisionName='$READY') — bootstrapping with placeholder: $PLACEHOLDER"
            echo "value=$PLACEHOLDER" >> "$GITHUB_OUTPUT"
          fi

      # caj-mcp-smoke is a one-shot JOB, not a long-running app — no
      # latestReadyRevisionName concept; "preserve current, whatever it is"
      # is the job-shaped equivalent (mirrors deploy-infra.yml exactly).
      - name: Resolve current mcp-smoke image (preserve it across this unrelated deploy)
        id: mcp_smoke_image
        run: |
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          CURRENT=$(az containerapp job show -g "$RESOURCE_GROUP" -n caj-mcp-smoke \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -n "$CURRENT" ]; then
            echo "caj-mcp-smoke already exists — preserving its current image: $CURRENT"
            echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "caj-mcp-smoke does not exist yet — bootstrapping with placeholder: $PLACEHOLDER"
            echo "value=$PLACEHOLDER" >> "$GITHUB_OUTPUT"
          fi

      # --name is explicit and distinct from deploy-infra.yml's implicit
      # default deployment name ("main", derived from the template file).
      # Without it a manual workflow_dispatch of both workflows at once
      # collides on the same ARM deployment name; with it, a genuine
      # concurrent run fails fast and legibly instead of racing (M-5).
      # infra/main.bicep's consoleClientId param has NO Bicep default —
      # AUTH-003 requires it stay a required parameter, so this workflow
      # (which redeploys the ENTIRE shared template, not just its own
      # governance modules) must supply a value explicitly or `az
      # deployment group what-if` fails outright with "Missing input
      # parameters: consoleClientId". Live-confirmed 2026-08-01. This job
      # is deliberately ungated (runs before the cmos-dev environment
      # gate), so the real CONSOLE_ENTRA_CLIENT_ID environment secret is
      # out of scope here by design — same placeholder deploy-infra.yml's
      # own ungated what-if job uses; validating the template SHAPE never
      # needs the real value, and this job never actually applies anything.
      - name: az deployment group what-if
        run: |
          az deployment group what-if \
            -g "$RESOURCE_GROUP" \
            --name governance-what-if \
            --template-file infra/main.bicep \
            --parameters @$PARAMETERS_FILE \
            --parameters administratorLoginPassword='${{ steps.pw.outputs.value }}' \
            --parameters gatewayContainerImage='${{ steps.gateway_image.outputs.value }}' \
            --parameters orchestratorContainerImage='${{ steps.orchestrator_image.outputs.value }}' \
            --parameters consoleContainerImage='${{ steps.console_image.outputs.value }}' \
            --parameters mcpWebContainerImage='${{ steps.mcp_web_image.outputs.value }}' \
            --parameters mcpBufferContainerImage='${{ steps.mcp_buffer_image.outputs.value }}' \
            --parameters mcpCanvaContainerImage='${{ steps.mcp_canva_image.outputs.value }}' \
            --parameters mcpSmokeContainerImage='${{ steps.mcp_smoke_image.outputs.value }}' \
            --parameters consoleClientId='00000000-0000-0000-0000-000000000000'

  deploy:
    name: deploy
    needs: what-if
    runs-on: ubuntu-latest
    # DE-1/AC-13: resolves to the unchanged 'cmos-dev' GH Environment gate
    # for every trigger this session exercises.
    environment: ${{ (inputs.environment_name == 'cmos-prod' && 'cmos-prod') || 'cmos-dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bootstrap az CLI extensions (non-interactive)
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az config set extension.dynamic_install_allow_preview=true
          az extension add --name containerapp --yes

      - name: Generate fresh Postgres admin password
        id: pw
        run: |
          PG_PW=$(openssl rand -hex 32)
          echo "::add-mask::$PG_PW"
          echo "value=$PG_PW" >> "$GITHUB_OUTPUT"

      # Same reasoning as the what-if job's identically-named step above —
      # this is the copy that actually governs the real deploy, kept
      # independent since this runs in a separate job/runner.
      - name: Resolve current gateway image (preserve it across this unrelated deploy)
        id: gateway_image
        run: |
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          READY=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-model-gateway \
            --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
          CURRENT=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-model-gateway \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -n "$READY" ] && [ -n "$CURRENT" ]; then
            echo "ca-model-gateway has a ready revision ($READY) — preserving its current image: $CURRENT"
            echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "ca-model-gateway has no ready revision yet (latestReadyRevisionName='$READY') — bootstrapping with placeholder: $PLACEHOLDER"
            echo "value=$PLACEHOLDER" >> "$GITHUB_OUTPUT"
          fi

      # MAIDEN-DEPLOY INCIDENT (2026-08-01, live) — the copy that actually
      # governs the real deploy; see the what-if job's identically-named
      # steps above for the full incident writeup (ca-orchestrator's live,
      # Ready revision got silently reset to the bootstrap placeholder by
      # THIS exact step's prior absence).
      - name: Resolve current orchestrator image (preserve it across this unrelated deploy)
        id: orchestrator_image
        run: |
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          READY=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-orchestrator \
            --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
          CURRENT=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-orchestrator \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -n "$READY" ] && [ -n "$CURRENT" ]; then
            echo "ca-orchestrator has a ready revision ($READY) — preserving its current image: $CURRENT"
            echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "ca-orchestrator has no ready revision yet (latestReadyRevisionName='$READY') — bootstrapping with placeholder: $PLACEHOLDER"
            echo "value=$PLACEHOLDER" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve current console image (preserve it across this unrelated deploy)
        id: console_image
        run: |
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          READY=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-console \
            --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
          CURRENT=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-console \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -n "$READY" ] && [ -n "$CURRENT" ]; then
            echo "ca-console has a ready revision ($READY) — preserving its current image: $CURRENT"
            echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "ca-console has no ready revision yet (latestReadyRevisionName='$READY') — bootstrapping with placeholder: $PLACEHOLDER"
            echo "value=$PLACEHOLDER" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve current mcp-web image (preserve it across this unrelated deploy)
        id: mcp_web_image
        run: |
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          READY=$(az containerapp show -g "$RESOURCE_GROUP" -n mcp-web \
            --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
          CURRENT=$(az containerapp show -g "$RESOURCE_GROUP" -n mcp-web \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -n "$READY" ] && [ -n "$CURRENT" ]; then
            echo "mcp-web has a ready revision ($READY) — preserving its current image: $CURRENT"
            echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "mcp-web has no ready revision yet (latestReadyRevisionName='$READY') — bootstrapping with placeholder: $PLACEHOLDER"
            echo "value=$PLACEHOLDER" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve current mcp-buffer image (preserve it across this unrelated deploy)
        id: mcp_buffer_image
        run: |
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          READY=$(az containerapp show -g "$RESOURCE_GROUP" -n mcp-buffer \
            --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
          CURRENT=$(az containerapp show -g "$RESOURCE_GROUP" -n mcp-buffer \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -n "$READY" ] && [ -n "$CURRENT" ]; then
            echo "mcp-buffer has a ready revision ($READY) — preserving its current image: $CURRENT"
            echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "mcp-buffer has no ready revision yet (latestReadyRevisionName='$READY') — bootstrapping with placeholder: $PLACEHOLDER"
            echo "value=$PLACEHOLDER" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve current mcp-canva image (preserve it across this unrelated deploy)
        id: mcp_canva_image
        run: |
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          READY=$(az containerapp show -g "$RESOURCE_GROUP" -n mcp-canva \
            --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
          CURRENT=$(az containerapp show -g "$RESOURCE_GROUP" -n mcp-canva \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -n "$READY" ] && [ -n "$CURRENT" ]; then
            echo "mcp-canva has a ready revision ($READY) — preserving its current image: $CURRENT"
            echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "mcp-canva has no ready revision yet (latestReadyRevisionName='$READY') — bootstrapping with placeholder: $PLACEHOLDER"
            echo "value=$PLACEHOLDER" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve current mcp-smoke image (preserve it across this unrelated deploy)
        id: mcp_smoke_image
        run: |
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          CURRENT=$(az containerapp job show -g "$RESOURCE_GROUP" -n caj-mcp-smoke \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -n "$CURRENT" ]; then
            echo "caj-mcp-smoke already exists — preserving its current image: $CURRENT"
            echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "caj-mcp-smoke does not exist yet — bootstrapping with placeholder: $PLACEHOLDER"
            echo "value=$PLACEHOLDER" >> "$GITHUB_OUTPUT"
          fi

      # Explicit --name, distinct from both deploy-infra.yml's implicit
      # default and from the what-if job above (M-5).
      #
      # consoleClientId: this job runs under `environment: cmos-dev`, so
      # (unlike the ungated what-if job above) it CAN see the real
      # CONSOLE_ENTRA_CLIENT_ID environment secret once a human has run
      # scripts/bootstrap-console-auth.sh's Phase 2 — and it MUST use it,
      # not the what-if job's placeholder: this `az deployment group
      # create` is a REAL apply of the ENTIRE shared template, so passing
      # the placeholder here would silently regress the console's Easy
      # Auth authConfig back to a fail-closed dummy GUID on every
      # governance deploy, undoing Phase 3 of the three-phase bootstrap
      # (see infra/modules/console/console-app.bicep's header). Falls back
      # to the same placeholder only when the secret hasn't been set yet
      # (pre-Phase-2), mirroring deploy-infra.yml's own deploy-gated job
      # exactly, so both workflows agree on Phase 3's real value the
      # moment it exists.
      - name: az deployment group create (real deploy)
        run: |
          az deployment group create \
            -g "$RESOURCE_GROUP" \
            --name governance-deploy \
            --template-file infra/main.bicep \
            --parameters @$PARAMETERS_FILE \
            --parameters administratorLoginPassword='${{ steps.pw.outputs.value }}' \
            --parameters gatewayContainerImage='${{ steps.gateway_image.outputs.value }}' \
            --parameters orchestratorContainerImage='${{ steps.orchestrator_image.outputs.value }}' \
            --parameters consoleContainerImage='${{ steps.console_image.outputs.value }}' \
            --parameters mcpWebContainerImage='${{ steps.mcp_web_image.outputs.value }}' \
            --parameters mcpBufferContainerImage='${{ steps.mcp_buffer_image.outputs.value }}' \
            --parameters mcpCanvaContainerImage='${{ steps.mcp_canva_image.outputs.value }}' \
            --parameters mcpSmokeContainerImage='${{ steps.mcp_smoke_image.outputs.value }}' \
            --parameters consoleClientId="${{ secrets.CONSOLE_ENTRA_CLIENT_ID || '00000000-0000-0000-0000-000000000000' }}"

      # INCIDENT (2026-08-03, live — escalation 9, deploy-loop-e2e-smoke
      # #14): the `az deployment group create` above redeploys the ENTIRE
      # shared infra/main.bicep template, including ca-orchestrator's
      # container app — and container-app.bicep's `env` block only ever
      # declares VAULT_API_URL (default ''), never
      # CMOS_MCP_WEB_BASE_URL/CMOS_GATEWAY_BASE_URL/CMOS_GATEKEEPER_BASE_URL
      # at all. The only thing that has ever set the real values for all 4
      # of these is orchestrator-image.yml's own "Wire live FQDNs..." step,
      # which never runs as part of THIS workflow. Container Apps revisions
      # are full template snapshots, so every real governance deploy
      # silently wipes out whatever orchestrator-image.yml had previously
      # wired in — confirmed live: deploy-infra.yml's identical Bicep PUT
      # caused every dispatched loop task to fail with `MCPClient requires
      # a resolved base_url` / `VaultClientExt requires a resolved
      # base_url` (see deploy-infra.yml's own "Wire live FQDNs..." step,
      # added in the same fix as this one, for the full incident writeup).
      # This workflow deploys the identical shared template and would
      # cause the identical regression the next time it runs a real
      # deploy — same class of gap L-0065's RECURRENCE already documents
      # for the 7 `*ContainerImage` params (deploy-governance.yml only
      # ever handling ONE of several sibling workflows' shared-template
      # side effects). No "wait for ready" here first (unlike
      # deploy-infra.yml) — `az containerapp update --set-env-vars` does
      # not require the just-created revision to be Ready to succeed; it
      # simply creates one more new revision on top with the corrected env.
      - name: Wire live FQDNs for orchestrator's 4 dependent services as env vars
        run: |
          set -e
          declare -A APP_ENV_MAP=(
            ["ca-vault"]="VAULT_API_URL"
            ["ca-model-gateway"]="CMOS_GATEWAY_BASE_URL"
            ["mcp-web"]="CMOS_MCP_WEB_BASE_URL"
            ["ca-gatekeeper"]="CMOS_GATEKEEPER_BASE_URL"
          )
          SET_ARGS=()
          for APP_NAME in "${!APP_ENV_MAP[@]}"; do
            ENV_VAR="${APP_ENV_MAP[$APP_NAME]}"
            FQDN=$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP_NAME" --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || true)
            if [ -z "$FQDN" ]; then
              echo "::warning::$APP_NAME has no live ingress FQDN yet -- skipping $ENV_VAR (will be wired on a future run of this workflow once $APP_NAME exists)"
              continue
            fi
            echo "$APP_NAME -> $ENV_VAR=https://$FQDN"
            SET_ARGS+=("${ENV_VAR}=https://${FQDN}")
          done
          if [ "${#SET_ARGS[@]}" -eq 0 ]; then
            echo "no dependent-service FQDNs resolved -- nothing to wire, leaving ca-orchestrator's env vars unchanged"
            exit 0
          fi
          az containerapp update -n ca-orchestrator -g "$RESOURCE_GROUP" \
            --set-env-vars "${SET_ARGS[@]}"

      # Bare `job start`, no CLI container-argument override (`--yaml`,
      # `--env-vars`, `--command`, `--args`) — the job's real command/env is
      # baked into its Bicep-persisted template at deploy time
      # (governance-migration-job.bicep), resolved from real deploy-time
      # values (postgres.outputs.fqdn, the loaded migration SQL), not
      # supplied here. This sidesteps the CLI override bug class entirely
      # (L-0022: any container-argument flag replaces the whole container
      # spec; L-0023: `--yaml` overrides can be silently ignored) — those
      # only apply when a per-run override is passed to `start`, which this
      # call never does.
      - name: Start governance schema migration job
        run: az containerapp job start -g "$RESOURCE_GROUP" -n "$GOVERNANCE_MIGRATE_JOB"

      # Same poll shape and budget as deploy-infra.yml's caj-vault-migrate
      # poll: 20 attempts x 15s = 300s / 5 minutes.
      - name: Poll governance migration job execution to Succeeded
        run: |
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=15
          ATTEMPT=1
          STATUS=""
          EXEC_NAME=""
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            EXEC_NAME=$(az containerapp job execution list -g "$RESOURCE_GROUP" -n "$GOVERNANCE_MIGRATE_JOB" --query "[0].name" -o tsv 2>/dev/null || true)
            STATUS=$(az containerapp job execution list -g "$RESOURCE_GROUP" -n "$GOVERNANCE_MIGRATE_JOB" --query "[0].properties.status" -o tsv 2>/dev/null || echo "Unknown")
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: $GOVERNANCE_MIGRATE_JOB status = $STATUS"
            if [ "$STATUS" = "Succeeded" ] || [ "$STATUS" = "Failed" ]; then
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          echo "GOVERNANCE_MIGRATE_EXEC=$EXEC_NAME" >> "$GITHUB_ENV"
          echo "GOVERNANCE_MIGRATE_STATUS=$STATUS" >> "$GITHUB_ENV"

      # Unconditional dump — always useful, not just on failure.
      # `--container governance-migrate` is required even for this
      # single-container job (L-0024: `job logs show` fails fast without an
      # explicit --container).
      #
      # Round-2 fix: the L-0027 assumption ("raw stdout is clean
      # JSON-per-line") does NOT hold in general — confirmed live on this
      # exact job class: `grep -o '{.*}' | jq -r '.Log // empty'` crashed
      # with `jq: parse error: Invalid numeric literal ...` and printed
      # NOTHING (a greedy single-line `grep -o '{.*}'` can span from the
      # first `{` to the LAST `}` on a line, or simply not match a JSON
      # object that got wrapped across physical lines by the CLI's own
      # rendering — either way, one bad match kills jq's entire stream and
      # silently discards every line that would have parsed fine). Always
      # dump the raw, unparsed output first — human-readable either way,
      # JSON-wrapped or not — then make a best-effort structured pass with
      # `jq -R 'fromjson? | ...'`, which evaluates each line independently
      # and simply skips (not aborts on) any line that isn't valid JSON.
      - name: Dump governance migration job logs
        if: always()
        run: |
          az containerapp job logs show -g "$RESOURCE_GROUP" -n "$GOVERNANCE_MIGRATE_JOB" --execution "$GOVERNANCE_MIGRATE_EXEC" --container governance-migrate > /tmp/governance-migrate.log 2>&1 || true
          echo "--- raw output ---"
          cat /tmp/governance-migrate.log || true
          echo "--- best-effort .Log extraction (lines that are JSON-wrapped; silently skips lines that aren't) ---"
          jq -R 'fromjson? | .Log // empty' /tmp/governance-migrate.log 2>/dev/null || true

      - name: Assert governance migration job succeeded
        run: |
          if [ "$GOVERNANCE_MIGRATE_STATUS" != "Succeeded" ]; then
            echo "$GOVERNANCE_MIGRATE_JOB did not reach Succeeded (last status: $GOVERNANCE_MIGRATE_STATUS)"
            exit 1
          fi

      # gatekeeper-app.bicep / gatekeeper-approval-app.bicep / publisher-app.bicep
      # each carry a revisionSuffix that changes on every deploy (see their
      # own comments) specifically so a Postgres password rotation always
      # reaches the running container — but that means every governance
      # deploy now genuinely creates a NEW revision, and a new revision is
      # not instantly Ready (image pull + pip install + Uvicorn startup,
      # same cold-start cost the smoke script's own gate-check retry
      # already tolerates). Wait for latestReadyRevisionName to catch up to
      # latestRevisionName on all three apps BEFORE starting the smoke job,
      # mirroring deploy-gateway.yml's "wait for the new revision to be
      # Ready" step — the smoke script's per-call retries are defense in
      # depth for transient slowness, not a substitute for this.
      - name: Wait for governance app revisions to be Ready
        run: |
          for APP in ca-gatekeeper ca-publisher ca-gatekeeper-approval; do
            LATEST=$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP" --query "properties.latestRevisionName" -o tsv)
            echo "$APP latestRevisionName=$LATEST"
            MAX_ATTEMPTS=20
            SLEEP_SECONDS=15
            ATTEMPT=1
            READY=""
            while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
              READY=$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP" --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
              echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: $APP latestReadyRevisionName=$READY (waiting for $LATEST)"
              if [ "$READY" = "$LATEST" ]; then
                break
              fi
              ATTEMPT=$((ATTEMPT + 1))
              if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
                sleep "$SLEEP_SECONDS"
              fi
            done
            if [ "$READY" != "$LATEST" ]; then
              echo "$APP never reported $LATEST as its latestReadyRevisionName (last seen: $READY)"
              exit 1
            fi
          done

      # F-VAULT-SECRET-RESYNC (4 Aug 2026, heartbeat round 16): this
      # workflow's `az deployment group create` above runs against the
      # ENTIRE shared main.bicep (see the header comment above the
      # "az deployment group create (real deploy)" step) — not just the
      # governance apps this workflow is nominally about. Two side effects
      # of that follow every single run, whether or not anything
      # governance-related changed: (1) a fresh Postgres admin password
      # (this job's own "Generate fresh Postgres admin password" step,
      # applied straight to the live server via postgres.bicep's
      # administratorLoginPassword), and (2) a forced new ca-vault
      # revision (ca-vault/container-app.bicep's vaultDeployToken param
      # defaults to utcNow(), so it changes on every deploy regardless of
      # which workflow triggered it — this workflow never overrides it).
      #
      # deploy-infra.yml already accounts for exactly this: it follows its
      # own equivalent "Wait for ca-vault revision to be Ready" step with
      # "Start Vault secret-writer job" + a poll-to-Succeeded, so
      # caj-vault-secret-writer (the in-VNet job that writes the current
      # password into the `vault-db-connection-string` Key Vault secret —
      # see infra/modules/vault/secret-writer-job.bicep) re-syncs the
      # secret ca-vault reads at boot to the password Postgres actually
      # has. This workflow was missing that trio entirely: it rotates the
      # password and forces the ca-vault restart as an unrequested side
      # effect, then never re-syncs the secret the new revision reads —
      # leaving ca-vault stranded on the PREVIOUS password until some
      # later, unrelated deploy-infra run happens to fix it. Root-caused
      # from four consecutive deploy-loop-e2e-smoke failures (heartbeat
      # attempts #37-#40) all showing
      # asyncpg.exceptions.InvalidPasswordError for user "cmosadmin" at
      # vault's GET /campaigns, with no deploy-governance run firing
      # between them — see claude/cmos-operator-log-2026-08-02.md's round
      # 16 section for the full trace. Mirrors deploy-infra.yml's own
      # three steps verbatim (same step names minus "F-VAULT-SECRET-
      # RESYNC" so a future diff between the two workflows stays obvious).
      - name: Wait for ca-vault revision to be Ready
        run: |
          LATEST=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-vault --query "properties.latestRevisionName" -o tsv)
          echo "ca-vault latestRevisionName=$LATEST"
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=15
          ATTEMPT=1
          READY=""
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            READY=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-vault --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: ca-vault latestReadyRevisionName=$READY (waiting for $LATEST)"
            if [ "$READY" = "$LATEST" ]; then
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          if [ "$READY" != "$LATEST" ]; then
            echo "ca-vault never reported $LATEST as its latestReadyRevisionName (last seen: $READY)"
            exit 1
          fi

      - name: Start Vault secret-writer job (loads vault-db-connection-string in-VNet)
        run: az containerapp job start -g "$RESOURCE_GROUP" -n caj-vault-secret-writer

      - name: Poll secret-writer job execution to Succeeded
        run: |
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=15
          ATTEMPT=1
          STATUS=""
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            STATUS=$(az containerapp job execution list -g "$RESOURCE_GROUP" -n caj-vault-secret-writer --query "[0].properties.status" -o tsv 2>/dev/null || echo "Unknown")
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: secret-writer job status = $STATUS"
            if [ "$STATUS" = "Succeeded" ] || [ "$STATUS" = "Failed" ]; then
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          if [ "$STATUS" != "Succeeded" ]; then
            echo "caj-vault-secret-writer did not reach Succeeded (last status: $STATUS)"
            exit 1
          fi

      # Same reasoning as the migration job start above: bare `start`, no
      # CLI container-argument override — the smoke script and its
      # GATEKEEPER_URL/PUBLISHER_URL/DATABASE_URL env are baked into
      # governance-smoke-test-job.bicep's persisted template at deploy time,
      # resolved from real module outputs (gatekeeperApp.outputs.internalFqdn
      # etc. — never a hardcoded hostname, L-0025). L-0022/L-0023's CLI
      # override bugs don't apply here either.
      - name: Start governance gate-cycle smoke test job
        run: az containerapp job start -g "$RESOURCE_GROUP" -n "$GOVERNANCE_SMOKE_JOB"

      # 40 attempts x 15s = 600s / 10 minutes. Deliberately roomier than
      # the migrate poll: the smoke job's own bounded backoff around the
      # first CryptographyClient call can consume ~2 minutes
      # (8+16+32+64s), plus container cold start and a pip install, and
      # the gate cycle itself is well under a minute. 10 minutes leaves
      # more than 7 minutes of margin over that retry budget.
      - name: Poll governance smoke test job execution to Succeeded
        run: |
          MAX_ATTEMPTS=40
          SLEEP_SECONDS=15
          ATTEMPT=1
          STATUS=""
          EXEC_NAME=""
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            EXEC_NAME=$(az containerapp job execution list -g "$RESOURCE_GROUP" -n "$GOVERNANCE_SMOKE_JOB" --query "[0].name" -o tsv 2>/dev/null || true)
            STATUS=$(az containerapp job execution list -g "$RESOURCE_GROUP" -n "$GOVERNANCE_SMOKE_JOB" --query "[0].properties.status" -o tsv 2>/dev/null || echo "Unknown")
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: $GOVERNANCE_SMOKE_JOB status = $STATUS"
            if [ "$STATUS" = "Succeeded" ] || [ "$STATUS" = "Failed" ]; then
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          echo "GOVERNANCE_SMOKE_EXEC=$EXEC_NAME" >> "$GITHUB_ENV"
          echo "GOVERNANCE_SMOKE_STATUS=$STATUS" >> "$GITHUB_ENV"

      # Unconditional dump (see the migration job's identical step above for
      # why raw output is dumped first and the jq pass is best-effort only).
      # SMOKE-STEP-*/SMOKE-RETRY/SMOKE-FAIL/SMOKE-PASS lines come straight
      # from governance-smoke-test-job.bicep's embedded script.
      - name: Dump governance smoke test job logs
        if: always()
        run: |
          az containerapp job logs show -g "$RESOURCE_GROUP" -n "$GOVERNANCE_SMOKE_JOB" --execution "$GOVERNANCE_SMOKE_EXEC" --container governance-smoke > /tmp/governance-smoke.log 2>&1 || true
          echo "--- raw output ---"
          cat /tmp/governance-smoke.log || true
          echo "--- best-effort .Log extraction (lines that are JSON-wrapped; silently skips lines that aren't) ---"
          jq -R 'fromjson? | .Log // empty' /tmp/governance-smoke.log 2>/dev/null || true

      - name: Assert governance smoke test job succeeded
        run: |
          if [ "$GOVERNANCE_SMOKE_STATUS" != "Succeeded" ]; then
            echo "$GOVERNANCE_SMOKE_JOB did not reach Succeeded (last status: $GOVERNANCE_SMOKE_STATUS)"
            echo "The job's exit code encodes the full gate cycle: decision -> Key Vault sign -> verify -> replay-rejection."
            echo "See the dumped logs above for SMOKE-STEP-*/SMOKE-RETRY/SMOKE-FAIL lines."
            exit 1
          fi

      - name: Re-check the only external governance surface is the approval app
        run: |
          # Belt-and-braces against a future revision accidentally
          # publishing an internal API to the internet.
          for APP in ca-gatekeeper ca-publisher; do
            EXTERNAL=$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP" --query properties.configuration.ingress.external -o tsv)
            echo "$APP ingress.external = $EXTERNAL"
            test "$EXTERNAL" = "false"
          done
          APPROVAL_EXTERNAL=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-gatekeeper-approval --query properties.configuration.ingress.external -o tsv)
          echo "ca-gatekeeper-approval ingress.external = $APPROVAL_EXTERNAL"
          test "$APPROVAL_EXTERNAL" = "true"

      - name: Re-check Postgres public network access remains Disabled
        run: |
          PG=$(az resource list -g "$RESOURCE_GROUP" --resource-type Microsoft.DBforPostgreSQL/flexibleServers --query '[0].name' -o tsv)
          ACCESS=$(az postgres flexible-server show -g "$RESOURCE_GROUP" -n "$PG" --query network.publicNetworkAccess -o tsv)
          echo "Postgres publicNetworkAccess = $ACCESS"
          test "$ACCESS" = "Disabled"
