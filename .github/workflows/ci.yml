name: ci

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install lint tooling
        run: pip install ruff
      - name: Run lint (ruff check)
        run: ruff check services functions scripts console

  # F-BICEP-UNVALIDATED: until this job, nothing in CI or in a local
  # checkout ever compiled these templates -- a syntax error, a bad
  # function call or a reference to a module output that does not exist
  # would all have been caught for the first time by deploy-infra, against
  # the live subscription, after review and merge. Every other interface
  # here is validated before it ships; the infrastructure that runs them
  # was the exception.
  validate-bicep:
    name: validate-bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The Azure CLI is preinstalled on GitHub-hosted ubuntu runners, so
      # `az bicep install` is the cheapest way to get the compiler --
      # scripts/validate_bicep.sh also accepts a standalone `bicep` on
      # PATH or a BICEP=/path override for local runs.
      - name: Install the Bicep compiler
        run: az bicep install
      - name: Compile infra templates and hold the warning ratchet
        run: bash scripts/validate_bicep.sh

  # F-ALLOWLIST-DRIFT: the hosts a scan may fetch are written down twice
  # -- functions/_shared/scan-profiles.yaml (no deploy needed) and
  # MCP_WEB_ALLOWLIST in infra/main.bicep (deploy needed). A URL added to
  # a profile but not to the Bicep is rejected by mcp-web, caught by
  # dispatch.py's per-source try/except and skipped, so the scan quietly
  # degrades rather than failing. Bicep cannot read YAML, so this job is
  # the connection between them.
  check-allowlist-sync:
    name: check-allowlist-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Check mcp-web allow-list matches the scan profiles
        run: python scripts/check_allowlist_sync.py

  # F-CLIENT-DOMAIN-IN-PROFILE: PR 5a landed source URLs for all twelve
  # scan profiles in one agent-researched bootstrap, so the hostnames in
  # functions/_shared/scan-profiles.yaml are no longer a short hand-curated
  # list a reviewer can eyeball. A client's own site appearing there is the
  # case Fn 129's allowlist rule (v3 11.4) hard-excludes -- but Fn 129 is
  # not wired in yet (Appendix D PR 5c), so until it is, this job is the
  # only thing standing between a bootstrap pass and scanning a client.
  # The script's own docstring states the substring-match limitation; it is
  # a build-time guard, not the structural answer.
  check-scan-profiles-no-client-domains:
    name: check-scan-profiles-no-client-domains
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Check no scan-profile hostname looks like a client domain
        run: python scripts/check_scan_profiles_no_client_domains.py

  validate-contracts:
    name: validate-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install contract validation dependencies
        run: pip install pyyaml jsonschema openapi-spec-validator
      # Validates OpenAPI/JSON Schema contract correctness and the
      # frozen-v1 breaking-change baseline check (contracts/.frozen-v1.sha256)
      # in one pass.
      - name: Validate contracts and check for breaking changes
        run: python scripts/validate_contracts.py

  # risk-security RS-01: this exact check (deploy-governance.yml's own
  # "verify-bundles" job, which this mirrors step-for-step) only ran on
  # workflow_dispatch/workflow_run — never on pull_request — so a PR that
  # added a new gatekeeper/publisher source file without updating both
  # BUNDLE_MANIFEST.txt and infra/main.bicep's loadTextContent entries
  # merged clean and only broke at the next real deploy (a crash-looping
  # revision inside the VNet, the exact defect RS-01 found live this
  # session). Free, self-contained, independent of every other job here —
  # adding it to pull_request's job list closes that gap without touching
  # anything else in this file.
  verify-governance-bundle:
    name: verify-governance-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install governance service dependencies
        run: |
          pip install -r services/gatekeeper/requirements.txt
          pip install -r services/publisher/requirements.txt

      # Catches a bundle/manifest/unpack-script defect here, on a free
      # runner, instead of at container start inside the VNet where the
      # only symptom is a crash-looping revision.
      - name: Verify governance bundle reconstruction (with fault injection)
        run: python scripts/verify_governance_bundle_reconstruction.py --self-test

  migration-test:
    name: migration-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cmos
          POSTGRES_PASSWORD: cmos_ci_password
          POSTGRES_DB: cmos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_URL: postgresql://cmos:cmos_ci_password@localhost:5432/cmos
    steps:
      - uses: actions/checkout@v7
      - name: Install postgresql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # Mirrors the real caj-vault-migrate path (migration-job.bicep): the
      # schema is base64-encoded before becoming a Container Apps job secret,
      # because Container Apps collapses a literal "$$" in secret/env values
      # to "$", which corrupts schema.sql's "$$ ... $$" PL/pgSQL dollar
      # quoting. Applying schema.sql directly here would miss that failure
      # mode entirely, as it did before this regression was caught in a live
      # deploy.
      - name: Apply Vault schema migration (via the same base64 encoding the deploy job uses)
        run: |
          B64=$(base64 -w0 contracts/vault-schema/schema.sql)
          ESCAPED=$(printf '%s' "$B64" | sed 's/\$\$/\$/g')
          if [ "$B64" != "$ESCAPED" ]; then
            echo "base64-encoded schema.sql contains '\$\$' — Container Apps secret escaping would corrupt it in the real deploy"
            exit 1
          fi
          printf '%s' "$B64" | base64 -d > /tmp/schema.sql
          diff contracts/vault-schema/schema.sql /tmp/schema.sql
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f /tmp/schema.sql
      - name: Assert all 9 Vault tables exist
        run: |
          COUNT=$(psql "$PG_URL" -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name in ('signals','opportunity_cards','briefs','assets','campaigns','agent_runs','gate_decisions','costs','consent_register')")
          test "$COUNT" = "9"

  # -- session/s2-vault: begin --
  # Applies the vault_internal sidecar migration (services/vault/migrations/
  # 0001_vault_internal_init.sql) against a disposable Postgres instance,
  # twice in a row, to prove idempotency — mirroring the migration-test
  # job's base64-encoding regression check above (Container Apps collapses
  # a literal "$$" in secret/env values, which this file's "DO $$ ... $$"
  # PL/pgSQL blocks are vulnerable to; see the file's own header comment
  # and infra/modules/vault/sidecar-migration-job.bicep for the real
  # in-VNet job mirroring caj-vault-migrate). The frozen public schema is
  # applied first since vault_internal's tables FK-reference public
  # tables (campaigns, consent_register).
  vault-internal-migration-test:
    name: vault-internal-migration-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cmos
          POSTGRES_PASSWORD: cmos_ci_password
          POSTGRES_DB: cmos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_URL: postgresql://cmos:cmos_ci_password@localhost:5432/cmos
    steps:
      - uses: actions/checkout@v7
      - name: Install postgresql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply frozen public schema (prerequisite for vault_internal FKs)
        run: psql "$PG_URL" -v ON_ERROR_STOP=1 -f contracts/vault-schema/schema.sql
      - name: Apply vault_internal migration (via the same base64 encoding the deploy job uses)
        run: |
          B64=$(base64 -w0 services/vault/migrations/0001_vault_internal_init.sql)
          ESCAPED=$(printf '%s' "$B64" | sed 's/\$\$/\$/g')
          if [ "$B64" != "$ESCAPED" ]; then
            echo "base64-encoded 0001_vault_internal_init.sql contains '\$\$' — Container Apps secret escaping would corrupt it in the real deploy"
            exit 1
          fi
          printf '%s' "$B64" | base64 -d > /tmp/vault_internal_0001.sql
          diff services/vault/migrations/0001_vault_internal_init.sql /tmp/vault_internal_0001.sql
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f /tmp/vault_internal_0001.sql
      - name: Re-apply vault_internal migration a second time (idempotency check)
        run: psql "$PG_URL" -v ON_ERROR_STOP=1 -f /tmp/vault_internal_0001.sql
      - name: Assert all 7 vault_internal tables exist
        run: |
          COUNT=$(psql "$PG_URL" -Atc "select count(*) from information_schema.tables where table_schema='vault_internal' and table_name in ('object_taxonomy','consent_linkage','audit_log','retention_policy','retention_run','access_log','utilisation_daily')")
          test "$COUNT" = "7"
  # -- session/s2-vault: end --

  # -- Appendix D PR 1 (ratification model): option_cards / approval_decisions /
  # standing_permissions — public schema, alongside agent_runs. Same base64
  # round-trip and re-apply-twice pattern as vault-internal-migration-test.
  options-inbox-migration-test:
    name: options-inbox-migration-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cmos
          POSTGRES_PASSWORD: cmos_ci_password
          POSTGRES_DB: cmos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_URL: postgresql://cmos:cmos_ci_password@localhost:5432/cmos
    steps:
      - uses: actions/checkout@v7
      - name: Install postgresql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply frozen public schema (prerequisite for the agent_runs FK)
        run: psql "$PG_URL" -v ON_ERROR_STOP=1 -f contracts/vault-schema/schema.sql
      - name: Apply options_inbox migration (via the same base64 encoding the deploy job uses)
        run: |
          B64=$(base64 -w0 services/vault/migrations/0002_options_inbox_init.sql)
          ESCAPED=$(printf '%s' "$B64" | sed 's/\$\$/\$/g')
          if [ "$B64" != "$ESCAPED" ]; then
            echo "base64-encoded 0002_options_inbox_init.sql contains '\$\$' — Container Apps secret escaping would corrupt it in the real deploy"
            exit 1
          fi
          printf '%s' "$B64" | base64 -d > /tmp/options_inbox_0002.sql
          diff services/vault/migrations/0002_options_inbox_init.sql /tmp/options_inbox_0002.sql
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f /tmp/options_inbox_0002.sql
      - name: Re-apply options_inbox migration a second time (idempotency check)
        run: psql "$PG_URL" -v ON_ERROR_STOP=1 -f /tmp/options_inbox_0002.sql
      - name: Apply options_inbox migration 0003 (approval_decisions.channel)
        run: |
          B64=$(base64 -w0 services/vault/migrations/0003_approval_decisions_add_channel.sql)
          ESCAPED=$(printf '%s' "$B64" | sed 's/\$\$/\$/g')
          if [ "$B64" != "$ESCAPED" ]; then
            echo "base64-encoded 0003_approval_decisions_add_channel.sql contains '\$\$' — Container Apps secret escaping would corrupt it in the real deploy"
            exit 1
          fi
          printf '%s' "$B64" | base64 -d > /tmp/options_inbox_0003.sql
          diff services/vault/migrations/0003_approval_decisions_add_channel.sql /tmp/options_inbox_0003.sql
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f /tmp/options_inbox_0003.sql
      - name: Re-apply options_inbox migration 0003 a second time (idempotency check)
        run: psql "$PG_URL" -v ON_ERROR_STOP=1 -f /tmp/options_inbox_0003.sql
      - name: Assert all 3 options_inbox tables exist, and approval_decisions has channel
        run: |
          COUNT=$(psql "$PG_URL" -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name in ('option_cards','approval_decisions','standing_permissions')")
          test "$COUNT" = "3"
          CHANNEL_COL=$(psql "$PG_URL" -Atc "select count(*) from information_schema.columns where table_schema='public' and table_name='approval_decisions' and column_name='channel'")
          test "$CHANNEL_COL" = "1"
      - name: Assert option_cards.agent_run_id really references agent_runs(id)
        run: |
          psql "$PG_URL" -v ON_ERROR_STOP=1 -c "
            insert into campaigns (id, name) values ('11111111-1111-1111-1111-111111111111', 'ci-fixture');
            insert into agent_runs (id, campaign_id, agent_name, status) values ('22222222-2222-2222-2222-222222222222', '11111111-1111-1111-1111-111111111111', 'ci-fixture', 'succeeded');
            insert into option_cards (card_id, kind, autonomy_level, risk_tier, agent_run_id, produced_by_function, card, created_at, expires_at)
              values ('33333333-3333-3333-3333-333333333333', 'content.reply', 1, 'low', '22222222-2222-2222-2222-222222222222', 116, '{}'::jsonb, now(), now() + interval '1 day');
          "
          FAILS=$(psql "$PG_URL" -Atc "
            insert into option_cards (card_id, kind, autonomy_level, risk_tier, agent_run_id, produced_by_function, card, created_at, expires_at)
              values ('44444444-4444-4444-4444-444444444444', 'content.reply', 1, 'low', '99999999-9999-9999-9999-999999999999', 116, '{}'::jsonb, now(), now() + interval '1 day');
          " 2>&1 | grep -c "violates foreign key constraint" || true)
          test "$FAILS" = "1"

  validate-loops:
    name: validate-loops
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # scripts/validate_loops.py imports orchestrator.loop_loader, which
      # imports orchestrator.models (pydantic-backed) — pyyaml/jsonschema
      # alone are not sufficient. Installing the orchestrator package
      # itself (same as the orchestrator-test job below) is what actually
      # provides that import, matching what a local run needs too.
      - name: Install loop validation dependencies
        run: pip install -e services/orchestrator
      - name: Validate shipped loop definitions (schema + acyclicity)
        # Every loop file, by glob, not two of them by name. main.py's
        # _load_shipped_loops() globs loops/*.yaml and catches a bad file
        # so startup does not crash -- which means a malformed loop ships,
        # logs one error, and is silently absent from the registry with
        # nothing else complaining. Naming two files here left
        # source-discovery-loop, nightly-analytics-ingest-loop and
        # publish-loop unvalidated. The shell glob also fails loudly if
        # the directory is ever moved, rather than passing on an empty
        # argument list.
        run: |
          set -o pipefail
          LOOPS=$(ls services/orchestrator/loops/*.yaml)
          echo "$LOOPS"
          python scripts/validate_loops.py $LOOPS

  orchestrator-test:
    name: orchestrator-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cmos
          POSTGRES_PASSWORD: cmos_ci_password
          POSTGRES_DB: cmos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_URL: postgresql://cmos:cmos_ci_password@localhost:5432/cmos
      DATABASE_URL: postgresql://cmos:cmos_ci_password@localhost:5432/cmos
      VAULT_API_URL: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install postgresql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # Mirrors the migration-test job's Vault-schema step and the real
      # caj-vault-migrate path (migration-job.bicep): the schema is
      # base64-encoded before becoming a Container Apps job secret, because
      # Container Apps collapses a literal "$$" in secret/env values to "$",
      # which would corrupt any future "$$ ... $$" PL/pgSQL dollar quoting
      # added to this migration. Applying the .sql file directly here would
      # miss that failure mode entirely.
      - name: Apply orchestrator schema migration (via the same base64 encoding the deploy job uses)
        run: |
          B64=$(base64 -w0 services/orchestrator/migrations/0001_orchestrator_init.sql)
          ESCAPED=$(printf '%s' "$B64" | sed 's/\$\$/\$/g')
          if [ "$B64" != "$ESCAPED" ]; then
            echo "base64-encoded 0001_orchestrator_init.sql contains '\$\$' — Container Apps secret escaping would corrupt it in the real deploy"
            exit 1
          fi
          printf '%s' "$B64" | base64 -d > /tmp/orchestrator_schema.sql
          diff services/orchestrator/migrations/0001_orchestrator_init.sql /tmp/orchestrator_schema.sql
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f /tmp/orchestrator_schema.sql
      - name: Apply orchestrator schema migration again (idempotency check)
        run: psql "$PG_URL" -v ON_ERROR_STOP=1 -f /tmp/orchestrator_schema.sql
      # 0002_task_result_ref.sql (plan step 2, this session): a single
      # additive nullable column -- same base64 round-trip check as 0001
      # above, applied twice for the same idempotency proof.
      - name: Apply orchestrator schema migration 0002 (task_result_ref)
        run: |
          B64=$(base64 -w0 services/orchestrator/migrations/0002_task_result_ref.sql)
          ESCAPED=$(printf '%s' "$B64" | sed 's/\$\$/\$/g')
          if [ "$B64" != "$ESCAPED" ]; then
            echo "base64-encoded 0002_task_result_ref.sql contains '\$\$' — Container Apps secret escaping would corrupt it in the real deploy"
            exit 1
          fi
          printf '%s' "$B64" | base64 -d > /tmp/orchestrator_schema_0002.sql
          diff services/orchestrator/migrations/0002_task_result_ref.sql /tmp/orchestrator_schema_0002.sql
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f /tmp/orchestrator_schema_0002.sql
      - name: Apply orchestrator schema migration 0002 again (idempotency check)
        run: psql "$PG_URL" -v ON_ERROR_STOP=1 -f /tmp/orchestrator_schema_0002.sql
      - name: Apply orchestrator schema migration 0003 (qa_blocked reason)
        run: |
          B64=$(base64 -w0 services/orchestrator/migrations/0003_qa_blocked_reason.sql)
          ESCAPED=$(printf '%s' "$B64" | sed 's/\$\$/\$/g')
          if [ "$B64" != "$ESCAPED" ]; then
            echo "base64-encoded 0003_qa_blocked_reason.sql contains '\$\$' — Container Apps secret escaping would corrupt it in the real deploy"
            exit 1
          fi
          printf '%s' "$B64" | base64 -d > /tmp/orchestrator_schema_0003.sql
          diff services/orchestrator/migrations/0003_qa_blocked_reason.sql /tmp/orchestrator_schema_0003.sql
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f /tmp/orchestrator_schema_0003.sql
      - name: Apply orchestrator schema migration 0003 again (idempotency check)
        run: psql "$PG_URL" -v ON_ERROR_STOP=1 -f /tmp/orchestrator_schema_0003.sql
      # 0004_dependency_dead_lettered_reason.sql (F-DISPATCH-CASCADE,
      # 2026-08-04): extends task_transitions.reason's CHECK constraint
      # with 'dependency_dead_lettered' -- same base64 round-trip check as
      # 0001/0002/0003 above, applied twice for the same idempotency proof.
      - name: Apply orchestrator schema migration 0004 (dependency_dead_lettered reason)
        run: |
          B64=$(base64 -w0 services/orchestrator/migrations/0004_dependency_dead_lettered_reason.sql)
          ESCAPED=$(printf '%s' "$B64" | sed 's/\$\$/\$/g')
          if [ "$B64" != "$ESCAPED" ]; then
            echo "base64-encoded 0004_dependency_dead_lettered_reason.sql contains '\$\$' — Container Apps secret escaping would corrupt it in the real deploy"
            exit 1
          fi
          printf '%s' "$B64" | base64 -d > /tmp/orchestrator_schema_0004.sql
          diff services/orchestrator/migrations/0004_dependency_dead_lettered_reason.sql /tmp/orchestrator_schema_0004.sql
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f /tmp/orchestrator_schema_0004.sql
      - name: Apply orchestrator schema migration 0004 again (idempotency check)
        run: psql "$PG_URL" -v ON_ERROR_STOP=1 -f /tmp/orchestrator_schema_0004.sql
      # contracts/vault-schema/schema.sql (frozen) + governance's migration:
      # the new dispatch handlers (step 6+) write real Vault objects and
      # gate-check through the real Gatekeeper policy during the e2e
      # suite/orchestrator tests -- both schemas must exist in the same CI
      # Postgres the orchestrator-test job already stood up.
      - name: Apply Vault + governance schemas (needed by the new dispatch handlers' tests)
        run: |
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f contracts/vault-schema/schema.sql
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f infra/modules/governance/migrations/0001_governance_init.sql
      # options_inbox (Appendix D PR 5): sibling package, same convention
      # as telemetry-lib -- Fn 116's compose_options_handler imports
      # options_inbox.cards.build_card directly, so the real package (not
      # a copy of its logic) must be importable in this job too.
      - name: Install telemetry-lib + options_inbox (sibling dependencies) + orchestrator package and test dependencies
        run: |
          pip install -e services/telemetry-lib
          pip install -e services/options_inbox
          cd services/orchestrator
          pip install -e .
          pip install -r requirements-test.txt
      - name: Run orchestrator test suite
        run: cd services/orchestrator && pytest -q

  # The Gatekeeper's own suite has never run in CI. Every other service
  # has a job here; this one -- the service that decides what a human is
  # asked to approve, and what a signed gate token authorises -- did not,
  # and its tests had been failing on a real database for weeks without
  # anyone seeing it: two asserted a 24h approval-link TTL that became 30
  # days on 6 Aug 2026, and one posted an all-zeros agent_run_id straight
  # into a NOT NULL foreign key. A suite nothing runs is documentation,
  # not a gate.
  gatekeeper-tests:
    name: gatekeeper-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cmos
          POSTGRES_PASSWORD: cmos_ci_password
          POSTGRES_DB: cmos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_URL: postgresql://cmos:cmos_ci_password@localhost:5432/cmos
      TEST_DATABASE_URL: postgresql://cmos:cmos_ci_password@localhost:5432/cmos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install postgresql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # conftest.py applies both schemas itself, but only if it can reach
      # the database; applying them here too means a failure to create the
      # schema is reported as a schema error rather than as 60 skips.
      - name: Apply Vault + governance schemas
        run: |
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f contracts/vault-schema/schema.sql
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f infra/modules/governance/migrations/0001_governance_init.sql
      # option_cards / approval_decisions / standing_permissions (Appendix
      # D PR 1/3) -- app/routers/option_decide.py's tests need both.
      - name: Apply options_inbox migrations
        run: |
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f services/vault/migrations/0002_options_inbox_init.sql
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f services/vault/migrations/0003_approval_decisions_add_channel.sql
      # NOT `pip install -e services/gatekeeper`: the service is not an
      # installable package. Its flat layout has two top-level directories
      # (app/ and policy/) and no discovery config, so setuptools refuses
      # with "Multiple top-level packages discovered in a flat-layout".
      # It does not need installing either -- its pyproject carries
      # [tool.pytest.ini_options] pythonpath = ["."], so running pytest
      # from services/gatekeeper puts the service root, and therefore the
      # `app` package and main.py, on sys.path. Only the runtime deps and
      # the test-only ones are needed.
      #
      # jsonschema is a test-only dependency (test_token_issuance.py
      # validates the gate-token contract) and is deliberately absent from
      # requirements.txt, which is the deployed image's list.
      - name: Install telemetry-lib (sibling dependency) + gatekeeper dependencies
        run: |
          pip install -e services/telemetry-lib
          pip install -r services/gatekeeper/requirements.txt
          pip install pytest jsonschema
      # One run, then the skip check reads its output -- a second `pytest`
      # invocation would double the job for no extra coverage.
      #
      # The skip check is the point of the job as much as the tests are:
      # without a reachable TEST_DATABASE_URL every database-backed test
      # skips cleanly by design (L-0001), so a misconfigured job would go
      # green having proved nothing. That is the failure this whole job
      # exists to end, and it must not be able to reintroduce it.
      - name: Run gatekeeper test suite
        run: |
          cd services/gatekeeper
          set -o pipefail
          pytest -q 2>&1 | tee /tmp/gatekeeper-pytest.log
      - name: Assert the database-backed tests actually ran
        run: |
          SKIPPED=$(grep -oE '[0-9]+ skipped' /tmp/gatekeeper-pytest.log | tail -1 | grep -oE '^[0-9]+' || echo 0)
          echo "skipped: $SKIPPED"
          if [ "$SKIPPED" -gt 5 ]; then
            echo "too many skips ($SKIPPED) — TEST_DATABASE_URL is probably not reaching conftest,"
            echo "so the database-backed tests skipped instead of running."
            exit 1
          fi

  # THE GAP THIS CLOSES, demonstrated rather than theorised. Nothing in
  # .github/workflows ran services/publisher/tests. This file had jobs for
  # the orchestrator, gatekeeper, analytics-ingest, telemetry-lib and the
  # console, and installed services/publisher/requirements.txt only so
  # verify-governance-bundle could reconstruct the bundle -- it never ran a
  # publisher test.
  #
  # On 2 Sep 2026 PR #129 passed all 18 checks with two of its own tests
  # failing. It added two optional keyword arguments to
  # BufferClient.create_draft and updated the one production call site;
  # five test doubles across four files still declared the narrow
  # signature, and two of those sit on paths the publish router walks, so
  # the suite raised TypeError. Every check was green.
  #
  # The publisher is the service that decides whether a verified,
  # gate-approved asset actually reaches an audience. Its refusal ladder
  # (token absent/expired/replayed, kill switch, content-hash mismatch,
  # queue cap) is the last thing between a bad draft and a live post, and
  # it was the one service whose tests nobody ran.
  publisher-tests:
    name: publisher-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cmos
          POSTGRES_PASSWORD: cmos_ci_password
          POSTGRES_DB: cmos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_URL: postgresql://cmos:cmos_ci_password@localhost:5432/cmos
      TEST_DATABASE_URL: postgresql://cmos:cmos_ci_password@localhost:5432/cmos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install postgresql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # Both schemas, in this order. tests/conftest.py truncates
      # governance.{approval_actions,approval_inbox,publish_attempts,
      # jti_ledger,kill_switches} between tests and the publish path writes
      # Vault rows, so a suite run against only one of them fails on the
      # first database-backed test rather than skipping cleanly.
      - name: Apply Vault + governance schemas
        run: |
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f contracts/vault-schema/schema.sql
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f infra/modules/governance/migrations/0001_governance_init.sql
      # NOT `pip install -e services/publisher`, and NOT telemetry-lib.
      #
      # The first for the reason gatekeeper-tests gives: pyproject.toml
      # carries [tool.pytest.ini_options] pythonpath = ["."], so running
      # pytest from services/publisher puts the service root -- and
      # therefore the `app` package and main.py -- on sys.path. Nothing
      # needs installing.
      #
      # The second is deliberate and load-bearing. app/telemetry_wiring.py
      # imports telemetry_lib ONLY inside configure_tracer's try/except,
      # reached only when APPLICATIONINSIGHTS_CONNECTION_STRING is set, so
      # the deployed image legitimately does not carry it. Installing it
      # here would make CI's import surface WIDER than production's, which
      # is the exact shape of the failure hard rule 8 exists for. The
      # tests need the OpenTelemetry SDK (test_telemetry_wiring.py builds
      # an InMemorySpanExporter); the app itself needs only the API, which
      # is why the SDK is installed as a test-only dependency here and is
      # absent from requirements.txt.
      #
      # respx is likewise test-only -- test_esp_client.py mocks httpx with
      # it -- and deliberately absent from the deployed image's list.
      #
      # Verified in a clean 3.12 venv holding nothing but these four
      # lines: without opentelemetry-sdk the suite fails at COLLECTION,
      # taking every other test with it.
      - name: Install publisher dependencies (runtime + test-only)
        run: |
          pip install -r services/publisher/requirements.txt
          pip install pytest respx opentelemetry-sdk
      # One run, then the skip check reads its output -- a second `pytest`
      # would double the job for no extra coverage.
      - name: Run publisher test suite
        run: |
          cd services/publisher
          set -o pipefail
          pytest -q 2>&1 | tee /tmp/publisher-pytest.log
      # The point of the job as much as the tests are. Every
      # database-backed test skips cleanly by design when
      # TEST_DATABASE_URL is unreachable (L-0001), so a misconfigured job
      # goes green having proved nothing -- which is how this service went
      # untested in the first place.
      #
      # The threshold is not a guess: this suite skips ZERO tests when the
      # database is reachable, and 29 when it is not. Measured both ways.
      # 5 sits far below the failure and far above the healthy state.
      - name: Assert the database-backed tests actually ran
        run: |
          SKIPPED=$(grep -oE '[0-9]+ skipped' /tmp/publisher-pytest.log | tail -1 | grep -oE '^[0-9]+' || echo 0)
          echo "skipped: $SKIPPED"
          if [ "$SKIPPED" -gt 5 ]; then
            echo "too many skips ($SKIPPED) — TEST_DATABASE_URL is probably not reaching conftest,"
            echo "so the database-backed tests skipped instead of running."
            exit 1
          fi

  # CORRECTION to this job's original justification. analytics-image.yml
  # DOES have a `test` job that runs this suite -- the claim that nothing
  # ran it was wrong, reached by checking this file and not the other
  # eleven workflows. What is true is narrower, and still worth a job:
  #
  # That job is path-gated to services/analytics-ingest/**,
  # infra/modules/analytics/** and its own file. As of process 8 the
  # ORCHESTRATOR writes into the analytics schema
  # (db.register_utm_campaign / db.record_scheduled_post), so a change
  # under services/orchestrator/** can now break the measurement stage
  # without touching a single path that job watches. This one is
  # unconditional, so it covers exactly that case.
  #
  # It also runs bare `pytest` where that job runs `python -m pytest`.
  # The -m form silently prepends the working directory to sys.path,
  # which is why the missing `pythonpath` in pytest.ini never surfaced
  # there -- that job could not have caught it.
  #
  # analytics-ingest is the measurement stage, the code deciding which
  # published asset a metric belongs to, and a regression there is silent
  # by nature: rows quarantine, KPIs report nothing, no page turns red.
  analytics-ingest-tests:
    name: analytics-ingest-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cmos
          POSTGRES_PASSWORD: cmos_ci_password
          POSTGRES_DB: cmos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_URL: postgresql://cmos:cmos_ci_password@localhost:5432/cmos
      DATABASE_URL: postgresql://cmos:cmos_ci_password@localhost:5432/cmos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install postgresql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # The analytics tables carry FKs into the frozen public schema, so
      # that goes on first; conftest applies the analytics migration
      # itself, and applying it here too reports a schema error as a
      # schema error rather than as a wall of skips.
      - name: Apply Vault + analytics schemas
        run: |
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f contracts/vault-schema/schema.sql
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f services/analytics-ingest/migrations/0001_analytics_init.sql
      - name: Install analytics-ingest dependencies
        run: |
          pip install -r services/analytics-ingest/requirements.txt
          pip install -r services/analytics-ingest/requirements-test.txt
      # No skip guard here, unlike gatekeeper-tests, and deliberately so:
      # this suite ERRORS when it cannot reach DATABASE_URL (16 collection
      # errors, non-zero exit) rather than skipping cleanly, so a missing
      # database already turns the job red on its own. A guard copied over
      # from the Gatekeeper would read 0 skips forever and never once
      # reject anything, which is the same "check that has never been
      # shown to fail" this repository rejects elsewhere.
      #
      # Bare `pytest`, not `python -m pytest`: the -m form silently
      # prepends the working directory to sys.path, which would hide a
      # missing pythonpath setting in the service's own pytest.ini. This
      # runs the suite the way the config claims it works.
      - name: Run analytics-ingest test suite
        run: cd services/analytics-ingest && pytest -q

  telemetry-lib-tests:
    name: telemetry-lib-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install telemetry-lib + test deps
        run: pip install -e services/telemetry-lib pytest
      - name: Run telemetry-lib tests
        run: pytest services/telemetry-lib/tests

  console-tests:
    name: console-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install telemetry-lib + console + test deps
        run: pip install -e services/telemetry-lib -e "console[test]"
      - name: Run console tests
        run: pytest console/tests

  # GOAL-005/GOAL-005b — tooling availability was probed this session per
  # L-0001 (`npx --yes lighthouse@latest --version` and `npx --yes
  # @axe-core/cli --version` both succeeded; ubuntu-latest GitHub-hosted
  # runners ship Google Chrome pre-installed, which both tools need).
  # Ungated: no Azure resource is touched — the console runs locally in
  # mock mode against fixtures seeded via the same CONSOLE_SEED_FIXTURES_JSON_B64
  # mechanism deploy-console.yml's gated smoke job uses against the real
  # deployment (console/tests/seed_fixtures.py).
  console-accessibility:
    name: console-accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install telemetry-lib + console
        run: pip install -e services/telemetry-lib -e console
      - name: Seed fixtures and start the console locally (mock mode)
        working-directory: console
        run: |
          set -e
          export CONSOLE_SEED_FIXTURES_JSON_B64=$(python tests/seed_fixtures.py)
          export VAULT_API_MODE=mock
          export GATEKEEPER_API_MODE=mock
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/console.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health || { echo "console did not start"; cat /tmp/console.log; exit 1; }

      # The ubuntu-latest runner image's preinstalled system Chrome and its
      # preinstalled system chromedriver drift out of sync independently
      # (image snapshots update the two packages on different schedules) —
      # axe-core's selenium-webdriver session creation fails hard the
      # moment they diverge ("This version of ChromeDriver only supports
      # Chrome version N"), even though Lighthouse's chrome-launcher
      # (CDP-only, no chromedriver involved) is unaffected by the same skew.
      # Install a version-matched Chrome+chromedriver pair ourselves so
      # neither step depends on the runner image's own pairing being in
      # sync, per the tool's own error-message recommendation.
      - name: Install a version-matched Chrome + ChromeDriver pair
        run: |
          set -e
          npx --yes browser-driver-manager install chrome
          eval "$(npx --yes browser-driver-manager which)"
          echo "CHROME_PATH=$CHROME_TEST_PATH" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER_PATH=$CHROMEDRIVER_TEST_PATH" >> "$GITHUB_ENV"
          echo "SE_CHROME=$CHROME_TEST_PATH" >> "$GITHUB_ENV"
          echo "SE_CHROMEDRIVER=$CHROMEDRIVER_TEST_PATH" >> "$GITHUB_ENV"
          # Also win any PATH-based `chromedriver` lookup (axe-core's
          # bundled selenium-webdriver falls back to this when no
          # SE_CHROMEDRIVER/webdriver.chrome.driver override is honored).
          mkdir -p "$RUNNER_TEMP/matched-driver"
          ln -sf "$CHROMEDRIVER_TEST_PATH" "$RUNNER_TEMP/matched-driver/chromedriver"
          echo "$RUNNER_TEMP/matched-driver" >> "$GITHUB_PATH"

      # GOAL-005: Lighthouse accessibility >=0.90 on the 3 Must screens
      # (task queue/trace timeline combined via /tasks, approval inbox,
      # cost ledger). No app-level auth check exists on GET routes (Easy
      # Auth enforcement is a Container Apps platform feature, not
      # reproducible locally) — the X-MS-CLIENT-PRINCIPAL-* extra header
      # below documents what an authenticated request looks like without
      # being load-bearing for these unauthenticated-locally GET routes.
      - name: Lighthouse accessibility — task queue, approvals, cost ledger (GOAL-005)
        run: |
          set -e
          FAIL=0
          for SCREEN in tasks approvals costs; do
            npx --yes lighthouse@latest "http://127.0.0.1:8000/$SCREEN" \
              --only-categories=accessibility \
              --output=json --output-path="./lh-$SCREEN.json" \
              --extra-headers='{"X-MS-CLIENT-PRINCIPAL-ID":"ci-test-operator","X-MS-CLIENT-PRINCIPAL-NAME":"ci-test-operator@example.com"}' \
              --chrome-flags="--headless=new --no-sandbox"
            node -e "const r=require('./lh-$SCREEN.json'); const s=r.categories.accessibility.score; console.log('$SCREEN score:', s); process.exit(s >= 0.90 ? 0 : 1)" || FAIL=1
          done
          exit $FAIL

      # Every console route requires an authenticated principal
      # (require_principal, routes_reads.py) -- Easy Auth supplies the
      # X-MS-CLIENT-PRINCIPAL-* headers in the real deployed environment,
      # and the Lighthouse step above reproduces that locally via its own
      # --extra-headers flag. axe-core's CLI has no equivalent flag (no
      # --extra-headers / --header option exists anywhere in `axe --help`)
      # -- without it, both pages 401 and Chrome's native JSON viewer
      # renders the bare {"detail":"authentication required"} body (no
      # <title>/lang/<main>/<h1>, and the JSON viewer's own <pre> sits
      # outside any landmark), which is indistinguishable from 5 genuine
      # template defects unless you go looking. A tiny local reverse
      # proxy that injects the same two headers on every request lets
      # axe-core exercise the real authenticated page instead -- zero
      # changes to console's own application code.
      - name: Start a local auth-header-injecting proxy for axe-core
        run: |
          set -e
          cat > /tmp/auth_proxy.py <<'PYEOF'
          import http.server
          import urllib.error
          import urllib.request

          UPSTREAM = "http://127.0.0.1:8000"
          EXTRA_HEADERS = {
              "X-MS-CLIENT-PRINCIPAL-ID": "ci-test-operator",
              "X-MS-CLIENT-PRINCIPAL-NAME": "ci-test-operator@example.com",
          }
          HOP_BY_HOP = {"connection", "transfer-encoding", "content-encoding"}


          class AuthInjectingProxy(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self._forward()

              def do_POST(self):
                  self._forward()

              def _forward(self):
                  headers = {k: v for k, v in self.headers.items()}
                  headers.update(EXTRA_HEADERS)
                  length = int(self.headers.get("Content-Length", 0))
                  body = self.rfile.read(length) if length else None
                  req = urllib.request.Request(
                      UPSTREAM + self.path, data=body, headers=headers, method=self.command
                  )
                  try:
                      resp = urllib.request.urlopen(req)
                  except urllib.error.HTTPError as exc:
                      resp = exc
                  self.send_response(resp.status if hasattr(resp, "status") else resp.code)
                  for key, value in resp.headers.items():
                      if key.lower() not in HOP_BY_HOP:
                          self.send_header(key, value)
                  self.end_headers()
                  self.wfile.write(resp.read())

              def log_message(self, fmt, *args):
                  pass


          http.server.ThreadingHTTPServer(("127.0.0.1", 8001), AuthInjectingProxy).serve_forever()
          PYEOF
          nohup python /tmp/auth_proxy.py > /tmp/auth_proxy.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf -H "X-MS-CLIENT-PRINCIPAL-ID: ci-test-operator" http://127.0.0.1:8001/health && break
            sleep 0.5
          done
          curl -sf -H "X-MS-CLIENT-PRINCIPAL-ID: ci-test-operator" http://127.0.0.1:8001/health \
            || { echo "auth proxy did not start"; cat /tmp/auth_proxy.log; exit 1; }

      # GOAL-005b: axe-core, 0 critical/serious violations, on the 2
      # Should screens (Vault search, kill-switch panel) — via the proxy
      # above (port 8001), so these requests are authenticated the same
      # way the Lighthouse step's requests are.
      - name: axe-core — Vault search, kill switch (GOAL-005b)
        run: |
          npx --yes @axe-core/cli http://127.0.0.1:8001/vault-search http://127.0.0.1:8001/kill-switch \
            --chrome-options="no-sandbox,headless=new" --exit

  # The weekly system auditor rotates through the lens briefs in
  # .claude/skills/system-audit/lenses/, and claude-system-audit.yml's
  # workflow_dispatch choice list names them a second time. Nothing else keeps
  # the two in sync -- the same drift class check-allowlist-sync guards for the
  # scan-profile allow-list. The self-test also proves the rotation covers every
  # lens exactly once per cycle, so a lens cannot be added and then never run.
  validate-audit-lenses:
    name: validate-audit-lenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify the audit lens rotation and its workflow choice list
        run: python scripts/select_audit_lens.py --self-test

  # deploy-infra rolls ca-vault onto its new image as part of
  # `az deployment group create` and only THEN starts caj-vault-migrate, so
  # for ~30-45s the new code serves traffic against a database that does not
  # yet have the columns it writes. A change that adds a column AND the code
  # writing it has to be split across two deploys; this job is what makes
  # that non-optional. See the script's docstring for why the deploy ordering
  # cannot simply be reversed.
  check-schema-code-ordering:
    name: check-schema-code-ordering
    runs-on: ubuntu-latest
    steps:
      # Full history: the check diffs against the PR's base branch, which a
      # shallow clone does not contain.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Proves the detector still works before its verdict is trusted
      # (L-0051) -- a checker that silently stopped matching would otherwise
      # pass everything.
      - name: Verify the detector can both pass and fail
        run: python scripts/check_schema_code_ordering.py --self-test
      - name: Check no Vault column is added and written in one change
        run: |
          BASE="${{ github.base_ref || 'main' }}"
          git fetch --no-tags origin "$BASE"
          python scripts/check_schema_code_ordering.py --base "origin/$BASE"

  # The vault had no Python test job at all -- `migration-test` and
  # `vault-internal-migration-test` apply its schema SQL, which says nothing
  # about the service that reads it. That gap is why a fastapi bump closing
  # seven starlette advisories could not be verified when the dependency audit
  # first surfaced them, and had to be baselined in
  # .github/pip-audit-ignore.txt instead of fixed.
  #
  # DELIBERATE CHOICE: this job stands the service up and drives it over HTTP,
  # rather than running only the tests that need no endpoint. The suite that
  # needs an endpoint (tests/test_contract_smoke.py, the same one
  # caj-vault-smoke-test runs in dev) is 90 of the 94 tests and the only thing
  # here that exercises real request handling -- which is exactly what a
  # starlette major-version change puts at risk. Running only
  # test_telemetry_wiring.py would be four tests and would have proved nothing
  # about the bump.
  #
  # The five deselected tests need a real Azure Storage account
  # (vault/storage.py builds a https://<account>.blob.core.windows.net URL and
  # authenticates with DefaultAzureCredential, so there is no emulator path
  # without changing the service). They fail identically on both sides of the
  # bump and are unaffected by it. Every other asset test -- including
  # test_asset_consent_gate_rejects_without_active_consent and
  # test_asset_consent_rejection_writes_audit_row -- still runs, so this is a
  # narrow deselect by node id, not a blanket `-k "not asset"`.
  vault-tests:
    name: vault-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cmos
          POSTGRES_PASSWORD: cmos_ci_password
          POSTGRES_DB: cmos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_URL: postgresql://cmos:cmos_ci_password@localhost:5432/cmos
      DATABASE_URL: postgresql://cmos:cmos_ci_password@localhost:5432/cmos
      VAULT_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install postgresql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Same order the real deploy uses: the frozen public schema first, since
      # vault_internal's tables FK-reference it (see
      # vault-internal-migration-test above).
      - name: Apply the frozen public schema and the vault_internal migration
        run: |
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f contracts/vault-schema/schema.sql
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f services/vault/migrations/0001_vault_internal_init.sql
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f services/vault/migrations/0002_options_inbox_init.sql
          psql "$PG_URL" -v ON_ERROR_STOP=1 -f services/vault/migrations/0003_approval_decisions_add_channel.sql

      # telemetry-lib is a sibling package, not on any index, and
      # vault/telemetry_wiring.py imports it on the request path -- without it
      # every request through the middleware 500s.
      - name: Install telemetry-lib (sibling dependency) + vault dependencies
        run: |
          pip install -e services/telemetry-lib
          pip install -r services/vault/requirements.txt -r services/vault/requirements-test.txt

      # DATABASE_URL is set, so config.py takes the direct-connection path and
      # never reaches for Key Vault. No storage account is configured, which is
      # why the five blob-backed tests are deselected below.
      - name: Start the vault and wait for it to serve
        run: |
          cd services/vault
          nohup python -m uvicorn vault.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/vault-service.log 2>&1 &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1 && break
            sleep 0.5
          done
          # Ground truth in the log before any assertion on it, per L-0064.
          echo "--- vault startup log ---"; cat /tmp/vault-service.log
          curl -sf http://127.0.0.1:8000/health \
            || { echo "vault did not come up"; exit 1; }

      - name: Run the vault test suite against the running service
        run: |
          cd services/vault
          set -o pipefail
          pytest -q \
            --deselect 'tests/test_contract_smoke.py::test_create_and_roundtrip_taxonomy[assets-True-<lambda>]' \
            --deselect 'tests/test_contract_smoke.py::test_asset_chain_byte_identical' \
            --deselect 'tests/test_contract_smoke.py::test_asset_dedup_no_duplicate_blob' \
            --deselect 'tests/test_contract_smoke.py::test_asset_delete' \
            --deselect 'tests/test_contract_smoke.py::test_retention_expiry_deletes_expired_objects' \
            tests/ 2>&1 | tee /tmp/vault-pytest.log

      # Without this, a job that reached the service but collected almost
      # nothing -- a bad path, an import error swallowing a module, a deselect
      # pattern that grew to match everything -- would report success having
      # proved nothing. 89 pass locally against the same schema; 80 leaves room
      # for tests to be added or removed without becoming a second place that
      # has to be kept in sync exactly.
      - name: Assert the suite actually ran
        run: |
          PASSED=$(grep -oE '[0-9]+ passed' /tmp/vault-pytest.log | tail -1 | grep -oE '^[0-9]+' || echo 0)
          echo "passed: $PASSED"
          if [ "$PASSED" -lt 80 ]; then
            echo "only $PASSED tests passed — the suite did not really run."
            echo "Check the startup log above: the service is the usual cause."
            exit 1
          fi

      - name: Show the vault log on failure
        if: failure()
        run: cat /tmp/vault-service.log
