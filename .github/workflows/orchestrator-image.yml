name: orchestrator-image

# Builds and pushes the orchestrator service container image to the
# single shared platform ACR (infra/modules/container-registry.bicep) via
# OIDC — no client secrets, no ACR admin account credentials anywhere in
# this workflow (AC-022).
#
# INCIDENT (deploy-infra run 30624109154, 2026-07-31): this used to resolve
# its target registry with `az acr list -g cmos-dev --query "[0].name"` —
# the exact order-dependent "list and take index 0" anti-pattern L-0021
# documents. cmos-dev holds two Microsoft.ContainerRegistry resources: the
# orphaned pre-convention one (acrcmosdev<uniqueString>) and the
# Bicep-managed canonical one (acrcmosshared<uniqueString>,
# container-registry.bicep's `module containerRegistry` in
# infra/main.bicep). `[0]` picked the orphan — the image built and pushed
# successfully, but ca-orchestrator's Bicep-managed registries[] binding
# pointed at the canonical registry, which never had ANY orchestrator tag
# in it, so the next deploy failed hard with MANIFEST_UNKNOWN. Same class
# of bug vault-image.yml already documents and fixes (see that file's
# header) — this workflow just hadn't been migrated onto that fix yet.
# Resolves from the container-registry module's own deployment record now
# (same mechanism vault-image.yml uses), never an ambient list.
#
# Also drops the `:latest` tag entirely (C11 wart noted the same day for
# services/vault/, tracked separately, not fixed here to keep this PR
# small) — every image reference downstream of this workflow is pinned to
# the building commit's SHA, mirroring deploy-gateway.yml's tagging
# convention exactly. `:latest` is inherently ambiguous under concurrent
# pushes/retries; a SHA is not.
#
# Two jobs, mirroring deploy-gateway.yml's/deploy-console.yml's split
# precisely: build-and-push is free and idempotent, so it runs ungated;
# deploy (the only thing that ever calls `az containerapp update` on
# ca-orchestrator, i.e. the only thing that ever sets a REAL, non-placeholder
# orchestrator image — see infra/main.bicep's orchestratorContainerImage
# param header) sits behind the same `environment: cmos-dev` approval gate
# every other production-affecting action in this repo uses, and joins the
# shared `cmos-dev-deploy` concurrency group so it can never race
# deploy-infra.yml's Bicep PUT that owns ca-orchestrator's lifecycle (the
# exact deploy-console.yml maiden-deploy incident this mirrors the fix
# for — see that workflow's own header).
#
# No workflow_run trigger anywhere in this file (AC-034 — a workflow
# cannot listen to itself, L-0009; this workflow does not self-trigger and
# does not watch itself).

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "services/orchestrator/**"
      - ".github/workflows/orchestrator-image.yml"

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: cmos-dev
  CONTAINER_APP: ca-orchestrator
  IMAGE_NAME: orchestrator

jobs:
  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve the canonical ACR (from container-registry module's own deployment output)
        id: acr
        run: |
          set -e
          LOGIN_SERVER=$(az deployment group show -g "$RESOURCE_GROUP" -n container-registry --query "properties.outputs.loginServer.value" -o tsv 2>/dev/null || true)
          test -n "$LOGIN_SERVER" || { echo "container-registry module deployment not found in $RESOURCE_GROUP — has infra/main.bicep been deployed yet?"; exit 1; }
          NAME="${LOGIN_SERVER%%.*}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      - name: az acr login (OIDC-backed az login above — no admin credentials)
        run: az acr login --name "${{ steps.acr.outputs.name }}"

      # ---------------------------------------------------------------
      # Stage the frozen contracts INTO the docker build context.
      #
      # The build context below is `services/orchestrator`, and Docker's
      # COPY cannot reach outside its own context — but contracts/ lives at
      # the repository root, a sibling of services/. loop_loader.py and
      # producer.py read four schema files from it at RUNTIME (loop
      # validation on startup + by the smoke test's own prediction path;
      # outgoing envelope validation before every publish, AC-026) —
      # confirmed live, 2026-07-31: ca-orchestrator's startup logs showed
      # `loop_load_failed ... No such file or directory:
      # '/contracts/orchestrator/loop-definition.schema.json'` and
      # caj-orchestrator-smoke-test crashed with the same FileNotFoundError
      # before it could publish anything, because without this step the
      # built image simply does not contain them.
      #
      # Staging here rather than widening the build context to the repo
      # root keeps the Dockerfile's existing context-relative COPY paths
      # correct and copies only the four files the service actually needs
      # — no infra/, no other service, no .git. Mirrors
      # deploy-gateway.yml's identical "Stage the frozen contracts into the
      # build context" step exactly.
      # ---------------------------------------------------------------
      - name: Stage the frozen contracts into the build context
        run: |
          set -e
          mkdir -p services/orchestrator/contracts/orchestrator
          mkdir -p services/orchestrator/contracts/service-bus
          cp contracts/orchestrator/loop-definition.schema.json \
             contracts/orchestrator/heartbeat-event.schema.json \
             contracts/orchestrator/dead-letter-alert.schema.json \
             services/orchestrator/contracts/orchestrator/
          cp contracts/service-bus/task-envelope.schema.json \
             services/orchestrator/contracts/service-bus/
          ls -lR services/orchestrator/contracts

      # ---------------------------------------------------------------
      # Stage the numbered function packages dispatch.py's handlers read at
      # RUNTIME (session/s8-first-loop, plan step 25's rebase reconciliation
      # pass) INTO the docker build context -- same reasoning as the
      # contracts/ staging step immediately above: functions/ lives at the
      # repository root, a sibling of services/, outside this image's build
      # context (services/orchestrator), which Docker's COPY cannot reach.
      # Only the files dispatch.py's handlers actually read at runtime (see
      # Dockerfile's own comment for the full list) -- never a whole
      # function package (evals/, tool_check.py, skill.md stay out, same
      # RISK-002 minimal-image intent as contracts/ above).
      #
      # EXTENDED (6 Aug 2026, PR #84 -- weekly-content-loop dispatch
      # handlers): 9 more prompt.md-only packages added (functions 26, 39,
      # 41, 43, 45, 46, 47, 48, 52). Caught during the post-merge deploy
      # check, not live -- see Dockerfile's own "EXTENDED" comment for the
      # incident this would otherwise have caused (every new handler except
      # the deterministic Monday planner would FileNotFoundError on first
      # dispatch).
      # ---------------------------------------------------------------
      - name: Stage the frozen functions into the build context
        run: |
          set -e
          mkdir -p services/orchestrator/functions/09-market-intelligence-director
          mkdir -p services/orchestrator/functions/42-linkedin-post-writer
          mkdir -p services/orchestrator/functions/02-brand-steward-qa
          mkdir -p services/orchestrator/functions/26-client-advocacy-harvester
          mkdir -p services/orchestrator/functions/39-insight-to-story-editor
          mkdir -p services/orchestrator/functions/41-research-brief-writer
          mkdir -p services/orchestrator/functions/43-executive-ghostwriter
          mkdir -p services/orchestrator/functions/45-carousel-post-writer
          mkdir -p services/orchestrator/functions/46-newsletter-writer
          mkdir -p services/orchestrator/functions/47-case-study-writer
          mkdir -p services/orchestrator/functions/48-fact-check-verdict
          mkdir -p services/orchestrator/functions/52-content-repurposer
          cp functions/09-market-intelligence-director/prompt.md \
             functions/09-market-intelligence-director/schema.json \
             services/orchestrator/functions/09-market-intelligence-director/
          # The eleven S10 fan-out scanners: prompt.md is read by
          # _read_prompt() and schema.json by the runtime output
          # validation, both at dispatch time.
          for pkg in 10-competitor-discovery-scanner \
            11-competitor-change-monitor \
            12-competitive-positioning-analyst \
            13-competitor-content-performance-scout \
            16-microsoft-fabric-ecosystem-scout \
            18-01-vertical-intel-logistics-fleet \
            18-02-vertical-intel-mining-industrial \
            18-03-vertical-intel-manufacturing \
            18-04-vertical-intel-construction \
            18-05-vertical-intel-fmcg-beverage \
            18-06-vertical-intel-financial-services; do
            mkdir -p "services/orchestrator/functions/$pkg"
            cp "functions/$pkg/prompt.md" "functions/$pkg/schema.json" \
               "services/orchestrator/functions/$pkg/"
          done
          # Shared across all twelve scan profiles, so it lives outside any
          # one package (F-SCAN-PROFILE-SINGLETON) -- read at runtime by
          # dispatch.py's ingest-signals handler on every dispatch.
          mkdir -p services/orchestrator/functions/_shared
          cp functions/_shared/scan-profiles.yaml \
             services/orchestrator/functions/_shared/
          cp functions/42-linkedin-post-writer/prompt.md \
             services/orchestrator/functions/42-linkedin-post-writer/
          cp functions/02-brand-steward-qa/prompt.md \
             functions/02-brand-steward-qa/permission_check.py \
             services/orchestrator/functions/02-brand-steward-qa/
          cp functions/26-client-advocacy-harvester/prompt.md \
             services/orchestrator/functions/26-client-advocacy-harvester/
          cp functions/39-insight-to-story-editor/prompt.md \
             services/orchestrator/functions/39-insight-to-story-editor/
          cp functions/41-research-brief-writer/prompt.md \
             services/orchestrator/functions/41-research-brief-writer/
          cp functions/43-executive-ghostwriter/prompt.md \
             services/orchestrator/functions/43-executive-ghostwriter/
          cp functions/45-carousel-post-writer/prompt.md \
             services/orchestrator/functions/45-carousel-post-writer/
          cp functions/46-newsletter-writer/prompt.md \
             services/orchestrator/functions/46-newsletter-writer/
          cp functions/47-case-study-writer/prompt.md \
             services/orchestrator/functions/47-case-study-writer/
          cp functions/48-fact-check-verdict/prompt.md \
             services/orchestrator/functions/48-fact-check-verdict/
          cp functions/52-content-repurposer/prompt.md \
             services/orchestrator/functions/52-content-repurposer/
          ls -lR services/orchestrator/functions

      # ---------------------------------------------------------------
      # Stage docs/permission-register.yaml (output-reviewer F2, major) INTO
      # the docker build context -- SAME reasoning as the two staging steps
      # above: docs/ lives at the repository root, outside this image's
      # build context (services/orchestrator). permission_check.py's
      # register_path() reads this one file at RUNTIME whenever
      # client_references is non-empty (currently dormant only because
      # dispatch.py hardcodes client_references=[] today, per plan.md's
      # risk register) -- never the rest of docs/.
      # ---------------------------------------------------------------
      - name: Stage the permission register into the build context
        run: |
          set -e
          mkdir -p services/orchestrator/docs
          cp docs/permission-register.yaml services/orchestrator/docs/
          ls -l services/orchestrator/docs

      # ---------------------------------------------------------------
      # Stage services/telemetry-lib into the docker build context (INCIDENT,
      # 2026-08-01, live — caj-loop-e2e-smoke #8 attempt 2): dispatch.py
      # imports the shared telemetry-lib sibling package at module level
      # (`from telemetry_lib import set_span_attribute`), but this image
      # never installed it, so every dispatched task crashed with
      # ModuleNotFoundError the instant a task reached dispatch.py — see
      # Dockerfile's own incident note for the full writeup. Same reasoning
      # as the contracts/functions/docs staging steps above: telemetry-lib
      # lives at the repository root (services/telemetry-lib), a sibling of
      # services/orchestrator, outside this image's build context, which
      # Docker's COPY cannot reach. Mirrors console/Dockerfile's own
      # working COPY services/telemetry-lib convention, just staged first
      # instead of widening this workflow's build context to the repo root.
      # ---------------------------------------------------------------
      - name: Stage telemetry-lib into the build context
        run: |
          set -e
          cp -r services/telemetry-lib services/orchestrator/telemetry-lib
          rm -rf services/orchestrator/telemetry-lib/tests services/orchestrator/telemetry-lib/telemetry_lib.egg-info
          ls -lR services/orchestrator/telemetry-lib

      - uses: docker/setup-buildx-action@v3

      - name: Build and push orchestrator image (tagged with the commit SHA only — never :latest)
        uses: docker/build-push-action@v6
        with:
          context: services/orchestrator
          push: true
          tags: ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Verify the pushed tag is retrievable (agent-native operability check, AC-029)
        run: |
          az acr repository show-tags \
            -n "${{ steps.acr.outputs.name }}" \
            --repository "$IMAGE_NAME" \
            --query "contains(@, '${{ github.sha }}')" \
            -o tsv

  deploy:
    name: deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: cmos-dev
    # Shared with deploy-infra.yml/deploy-gateway.yml/deploy-console.yml on
    # purpose: this job's `az containerapp update` and deploy-infra.yml's
    # `az deployment group create` both own ca-orchestrator's lifecycle
    # (the latter creates it, via orchestratorContainerApp module; this job
    # only ever updates an already-created app). Without this shared lock,
    # this job's push trigger fires immediately and independently of
    # deploy-infra's indirect workflow_run chain (azure-provider-registration
    # -> deploy-infra), so it could reach `az containerapp update` before
    # deploy-infra had a chance to create the app at all — the exact
    # deploy-console.yml maiden-deploy incident (run 30622834209).
    concurrency:
      group: cmos-dev-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bootstrap az CLI extensions (non-interactive)
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az config set extension.dynamic_install_allow_preview=true
          az extension add --name containerapp --yes

      - name: Resolve the canonical ACR (from container-registry module's own deployment output)
        id: acr
        run: |
          set -e
          LOGIN_SERVER=$(az deployment group show -g "$RESOURCE_GROUP" -n container-registry --query "properties.outputs.loginServer.value" -o tsv 2>/dev/null || true)
          test -n "$LOGIN_SERVER" || { echo "container-registry module deployment not found in $RESOURCE_GROUP"; exit 1; }
          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      # Bicep (deploy-infra.yml's orchestratorContainerApp module) owns
      # creating ca-orchestrator; this job only ever updates it. The
      # `cmos-dev-deploy` concurrency group above prevents this job from
      # running WHILE deploy-infra's Bicep PUT is in flight, but does not
      # by itself guarantee deploy-infra ran (and succeeded) FIRST — e.g. a
      # manual workflow_dispatch of this workflow before deploy-infra has
      # ever completed. A short bounded poll here turns that residual gap
      # into a clear, fast, actionable failure instead of `az containerapp
      # update`'s bare "does not exist" error — same fix deploy-console.yml
      # applied for the identical class of maiden-deploy race.
      - name: Wait for ca-orchestrator to exist (created by deploy-infra.yml's orchestratorContainerApp module)
        run: |
          set -e
          MAX_ATTEMPTS=10
          SLEEP_SECONDS=15
          ATTEMPT=1
          EXISTS="false"
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            if az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" -o none 2>/dev/null; then
              EXISTS="true"
              break
            fi
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: $CONTAINER_APP does not exist yet in $RESOURCE_GROUP"
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          if [ "$EXISTS" != "true" ]; then
            echo "::error::$CONTAINER_APP does not exist in $RESOURCE_GROUP after $((MAX_ATTEMPTS * SLEEP_SECONDS))s."
            echo "This job only ever UPDATES an existing Container App — it never creates one."
            echo "$CONTAINER_APP is created by deploy-infra.yml's orchestratorContainerApp Bicep module (infra/main.bicep)."
            echo "Check whether deploy-infra.yml has ever successfully completed its gated deploy job:"
            echo "  gh run list --workflow=deploy-infra.yml --limit 5"
            echo "If it hasn't, trigger it (workflow_dispatch is one of its triggers) and approve the"
            echo "cmos-dev environment gate, then re-run this workflow."
            exit 1
          fi

      - name: Deploy the new image to the Container App
        run: |
          set -e
          UPDATE_RESPONSE=$(az containerapp update \
            -n "$CONTAINER_APP" \
            -g "$RESOURCE_GROUP" \
            --image "${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}")
          # L-0027: az CLI JSON output is parsed with jq, never a naive
          # grep/regex against raw stdout.
          NEW_REVISION=$(echo "$UPDATE_RESPONSE" | jq -r '.properties.latestRevisionName // empty')
          test -n "$NEW_REVISION" || { echo "az containerapp update did not report a latestRevisionName"; exit 1; }
          echo "deployed revision: $NEW_REVISION"
          echo "NEW_REVISION=$NEW_REVISION" >> "$GITHUB_ENV"

      # Governance-round-4 revisionSuffix/readiness pattern (same as
      # container-app.bicep's own deployToken-driven revisionSuffix): `az
      # containerapp update` returning success only means the ARM PUT
      # completed and a new revision was CREATED, not that it's
      # healthy/traffic-serving yet.
      - name: Wait for ca-orchestrator revision to be Ready and receiving traffic
        run: |
          set -e
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=15
          ATTEMPT=1
          READY=""
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            READY=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: latestReadyRevisionName=$READY (waiting for $NEW_REVISION)"
            if [ "$READY" = "$NEW_REVISION" ]; then
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          if [ "$READY" != "$NEW_REVISION" ]; then
            echo "revision $NEW_REVISION never became the latest READY revision (last seen: $READY)"
            exit 1
          fi

      # AGENT-NATIVE-F1 / PERF-04 fix (review-gate blockers, both same root
      # cause): all 4 of ca-orchestrator's client base-URL resolvers
      # (vault_client_ext.py, gateway_client.py, mcp_client.py,
      # gatekeeper_client.py — orchestrator/clients/) fall through to
      # azure_fqdn.py's resolve_live_fqdn(), which shells out to `az
      # containerapp show` via subprocess — but ca-orchestrator's own
      # Docker image never installs azure-cli, so that fallback raises
      # FileNotFoundError in the real deployed container (caught and
      # turned into None, breaking every dispatch handler and GET
      # /runs/{task_ref}). spec.json v4 explicitly does NOT authorize a 4th
      # main.bicep carve-out for this (no Bicep env-var param exists for
      # any of these 4 apps) — the required, spec-mandated fix is exactly
      # this CI/deploy-workflow step, mirroring deploy-console.yml's
      # existing `az containerapp update --set-env-vars` post-deploy
      # wiring pattern (see that workflow's "Seed console fixtures" step).
      #
      # Each env var name below matches exactly what its resolver function
      # reads (see each client module's resolve_*_base_url() docstring).
      # A dependent app that doesn't exist yet / has no live ingress FQDN
      # (e.g. very first bootstrap ordering, before that service's own
      # deploy workflow has ever run) is skipped with a warning, not a
      # hard failure — ca-orchestrator's resolvers already degrade
      # gracefully to None rather than crash (agent-native lens:
      # "graceful degradation on downstream outage"), and the next run of
      # THIS workflow (any future push to services/orchestrator/**, or a
      # manual workflow_dispatch) re-resolves and re-wires once that app
      # exists.
      - name: Wire live FQDNs for orchestrator's 4 dependent services as env vars
        run: |
          set -e
          declare -A APP_ENV_MAP=(
            ["ca-vault"]="VAULT_API_URL"
            ["ca-model-gateway"]="CMOS_GATEWAY_BASE_URL"
            ["mcp-web"]="CMOS_MCP_WEB_BASE_URL"
            ["ca-gatekeeper"]="CMOS_GATEKEEPER_BASE_URL"
          )
          SET_ARGS=()
          for APP_NAME in "${!APP_ENV_MAP[@]}"; do
            ENV_VAR="${APP_ENV_MAP[$APP_NAME]}"
            FQDN=$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP_NAME" --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || true)
            if [ -z "$FQDN" ]; then
              echo "::warning::$APP_NAME has no live ingress FQDN yet -- skipping $ENV_VAR (will be wired on a future run of this workflow once $APP_NAME exists)"
              continue
            fi
            echo "$APP_NAME -> $ENV_VAR=https://$FQDN"
            SET_ARGS+=("${ENV_VAR}=https://${FQDN}")
          done
          if [ "${#SET_ARGS[@]}" -eq 0 ]; then
            echo "no dependent-service FQDNs resolved -- nothing to wire, leaving $CONTAINER_APP's env vars unchanged"
            exit 0
          fi
          az containerapp update -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
            --set-env-vars "${SET_ARGS[@]}"
