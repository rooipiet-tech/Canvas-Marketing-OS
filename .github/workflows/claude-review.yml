# Independent per-PR reviewer.
#
# This repository is written by parallel agent sessions, so the author of a
# change has had no second reader. This job is that reader: a Claude review of
# every human-authored PR, posted as inline comments.
#
# It cannot merge and it cannot approve -- `permissions:` below grants read
# access to contents and pull requests only, so the strongest thing it can do is
# leave a comment. Its standards come from REVIEW.md and CLAUDE.md at the repo
# root; edit those rather than this file to change what it flags.
#
# Requires an ANTHROPIC_API_KEY repository secret (or swap the input for
# claude_code_oauth_token). Without it the job skips cleanly instead of failing.
name: claude-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    name: claude-review
    # Dependabot and other bot PRs are skipped: the action rejects bot actors
    # unless they are allow-listed, so triggering it here would fail the run on
    # every dependency bump.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # A force-push mid-review wastes the run in progress, so cancel it.
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      # `secrets` is not available in an `if:` conditional, so the presence
      # check is hoisted into a job-level env var.
      HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review the pull request
        if: env.HAS_API_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # --comment posts findings on the PR; without it the review is only
          # readable in this run's log.
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The action starts the inline-comment MCP server only when
          # --allowedTools names it, even though the skill's own frontmatter does.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'

      - name: Report a missing API key
        if: env.HAS_API_KEY != 'true'
        run: |
          echo "::notice title=claude-review skipped::No ANTHROPIC_API_KEY secret is set." \
               "See docs/continuous-review.md for setup."
