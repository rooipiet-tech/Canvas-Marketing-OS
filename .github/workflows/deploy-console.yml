name: deploy-console

# Builds and pushes the console image to the shared ACR, then updates the
# Container App and proves the deployment works with a REQUIRED smoke
# test — mirroring C:\Users\rooip\cmos-s1\.github\workflows\deploy-gateway.yml's
# structure precisely (read in full this session): an ungated
# build-and-push job feeding a gated deploy job.
#
# Deliberately no `workflow_run` trigger: a workflow cannot reference
# itself in `workflows:` (L-0009), so this file avoids the mechanism
# entirely and implements every wait as a bounded in-job bash loop
# instead.
#
# Split follows the established rule: free, idempotent work (image build
# and push) runs ungated so retries are unattended; only the spend/impact
# step (the real deploy) sits behind the cmos-dev approval gate.
#
# RESIDUAL GAP (documented, not silently assumed — see this session's
# self_flags): steps (c) and (d) below need an AUTHENTICATED request
# against the console's Entra-ID-gated Easy Auth ingress. Obtaining a
# genuine bearer token programmatically requires the console's App
# Registration to expose an API scope AND grant admin consent to the CI
# identity — an additional one-time manual Entra step not yet covered by
# scripts/bootstrap-console-auth.sh. Until that exists, the token-fetch
# step below (`az account get-access-token --resource ...`) is expected to
# either fail outright or return a token Easy Auth rejects; this is called
# out explicitly at the point of use rather than glossed over.
#
# MAIDEN-DEPLOY INCIDENT (run 30622834209, 2026-07-31): this job failed
# fast at "Deploy the new image to the Container App" with `ERROR: The
# containerapp 'ca-console' does not exist` — NOT an identity/revisionSuffix/
# registry/Easy-Auth bug, and NOT the App Registration/bootstrap-script
# dependency either (that's a later phase; ca-console's own Bicep resource
# hadn't even been created yet). Root cause: deploy-infra.yml's automatic
# workflow_run trigger for the PR #26 merge got queued behind (and then
# cancelled alongside) a pileup of other sessions' deploy-gateway.yml/
# deploy-governance.yml runs all contending for the shared `cmos-dev-deploy`
# concurrency group — a group this file never joined, so this job started
# immediately and raced ahead of the infra deploy that was supposed to
# create ca-console first. Two fixes below: (1) join `cmos-dev-deploy` so
# this job can never run concurrently with the Bicep PUT that owns
# ca-console's lifecycle; (2) a bounded preflight wait for ca-console to
# exist, so a residual ordering gap (deploy-infra still mid-flight, not yet
# failed/cancelled) degrades to a clear, fast, actionable message instead
# of an opaque CLI error 8 minutes into the job.

on:
  # Callable by deploy-pipeline.yml -- see that workflow's header.
  workflow_call:
  workflow_dispatch: {}
# Concurrency is owned by deploy-pipeline.yml, the single caller that
# runs every deploy stage in one fixed order. A called workflow must
# NOT take the `cmos-dev-deploy` group its own caller already holds --
# it would wait forever on a group the parent cannot release until the
# child finishes. Pinned by test_deploy_pipeline_shape.py.

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: cmos-dev
  CONTAINER_APP: ca-console
  CONTAINER_APPS_ENVIRONMENT: cae-cmos-dev
  IMAGE_NAME: console
  # L-0025: no hardcoded CONSOLE_URL here — ca-console has EXTERNAL ingress
  # (a public *.azurecontainerapps.io FQDN, never an "internal.cmos.dev"
  # name), and every step below resolves its real FQDN dynamically via
  # `az containerapp show` (see CONSOLE_FQDN, set in step (a)).

jobs:
  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # OIDC federated credential only — the same three secrets
      # deploy-infra.yml already uses. No new static-credential-based
      # Azure sign-in is introduced.
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # L-0021/L-0048: resolved from the container-registry module's own
      # deployment record, never `az acr list [0]` — an unfiltered list
      # silently picks the wrong registry the moment a second one exists in
      # the resource group (confirmed live twice already in this repo: the
      # orphaned pre-convention `acrcmosdev...` registry for vault, and
      # ca-orchestrator's maiden-deploy MANIFEST_UNKNOWN, PR #29 — same
      # anti-pattern, same fix, applied here before console repeats it).
      - name: Resolve the canonical ACR (from container-registry module's own deployment output)
        run: |
          set -e
          LOGIN_SERVER=$(az deployment group show -g "$RESOURCE_GROUP" -n container-registry --query "properties.outputs.loginServer.value" -o tsv 2>/dev/null || true)
          test -n "$LOGIN_SERVER" || { echo "could not resolve the canonical registry from the container-registry deployment output — deploy infra first"; exit 1; }
          echo "LOGIN_SERVER=$LOGIN_SERVER" >> "$GITHUB_ENV"
          echo "REGISTRY_NAME=${LOGIN_SERVER%%.*}" >> "$GITHUB_ENV"

      - name: Build and push the console image
        run: |
          set -e
          az acr login --name "$REGISTRY_NAME"
          # Build context is the REPO ROOT — console/Dockerfile COPYs both
          # console/ and the sibling services/telemetry-lib/ package (see
          # console/Dockerfile's header comment).
          docker build -t "$LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}" \
                       -t "$LOGIN_SERVER/$IMAGE_NAME:latest" \
                       -f console/Dockerfile .
          docker push "$LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}"
          docker push "$LOGIN_SERVER/$IMAGE_NAME:latest"

  deploy:
    name: deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: cmos-dev
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bootstrap az CLI extensions (non-interactive)
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az config set extension.dynamic_install_allow_preview=true
          az extension add --name containerapp --yes
          # Not hard-pinned to a specific version (a guessed pin the
          # runner's az-cli core can't actually satisfy would break every
          # run, worse than the shape drift this logs) — but the resolved
          # version IS logged on every run, every time, so the exact
          # combination in effect is always visible for comparison against
          # what an operator's local `az version` shows, rather than
          # silently drifting unnoticed the way it did before step (g)'s
          # 2026-08-01 parse-shape bug (see that step's own comment).
          echo "containerapp extension version: $(az extension show --name containerapp --query version -o tsv --only-show-errors 2>/dev/null || echo 'built-in (no separate extension)')"
          az version

      # L-0021/L-0048: same fix as build-and-push's identically-named step
      # above (see its comment) — this is the copy that governs the real
      # deploy.
      - name: Resolve the canonical ACR (from container-registry module's own deployment output)
        run: |
          set -e
          LOGIN_SERVER=$(az deployment group show -g "$RESOURCE_GROUP" -n container-registry --query "properties.outputs.loginServer.value" -o tsv 2>/dev/null || true)
          test -n "$LOGIN_SERVER" || { echo "could not resolve the canonical registry from the container-registry deployment output"; exit 1; }
          echo "LOGIN_SERVER=$LOGIN_SERVER" >> "$GITHUB_ENV"

      # Bicep (deploy-infra.yml's consoleApp module) owns creating
      # ca-console; this job only ever updates it. The `cmos-dev-deploy`
      # concurrency group above prevents this job from running WHILE
      # deploy-infra's Bicep PUT is in flight, but does not by itself
      # guarantee deploy-infra ran (and succeeded) FIRST — e.g. a manual
      # `workflow_dispatch` of this workflow on a repo where deploy-infra
      # genuinely hasn't completed yet. A short bounded poll here turns
      # that residual gap into a clear, fast, actionable failure instead of
      # `az containerapp update`'s bare "does not exist" error.
      - name: Wait for ca-console to exist (created by deploy-infra.yml's consoleApp module)
        run: |
          set -e
          MAX_ATTEMPTS=10
          SLEEP_SECONDS=15
          ATTEMPT=1
          EXISTS="false"
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            if az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" -o none 2>/dev/null; then
              EXISTS="true"
              break
            fi
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: $CONTAINER_APP does not exist yet in $RESOURCE_GROUP"
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          if [ "$EXISTS" != "true" ]; then
            echo "::error::$CONTAINER_APP does not exist in $RESOURCE_GROUP after $((MAX_ATTEMPTS * SLEEP_SECONDS))s."
            echo "This job only ever UPDATES an existing Container App — it never creates one."
            echo "$CONTAINER_APP is created by deploy-infra.yml's consoleApp Bicep module (infra/main.bicep)."
            echo "Check whether deploy-infra.yml has ever successfully completed its gated 'deploy' job:"
            echo "  gh run list --workflow=deploy-infra.yml --limit 5"
            echo "If it hasn't, trigger it (workflow_dispatch is one of its triggers) and approve the"
            echo "cmos-dev environment gate, then re-run this workflow."
            echo "NOTE: this is NOT the Entra App Registration / scripts/bootstrap-console-auth.sh step —"
            echo "that is a later, separate phase that only matters once ca-console and its managed"
            echo "identity (id-console-cmos-dev) already exist."
            exit 1
          fi

      # MAIDEN-DEPLOY INCIDENT #2 (2026-07-31): deploy-infra.yml's Bicep
      # create of ca-console failed with ARM error IdentityDoesNotExist /
      # "No managed service identities are associated with resource
      # ca-console" — a confirmed, documented Azure Container Apps platform
      # limitation (microsoft/azure-container-apps#1467): a user-assigned
      # identity cannot be both newly attached via
      # `identity.userAssignedIdentities` AND referenced by
      # `registries[].identity` for ACR pull auth in the SAME initial
      # create call. console-app.bicep therefore never declares
      # `registries[]` at all (see its header comment) and bootstraps with
      # a public placeholder image needing no registry auth on first
      # create — this step is what actually attaches the registry-pull
      # identity, exclusively, via the CLI (Microsoft's own documented
      # reliable workaround for this exact bug), every run. Idempotent and
      # safe to repeat: `az containerapp registry set` on an
      # already-correctly-configured registry is a no-op.
      - name: Set ca-console's ACR pull identity (owns this exclusively — never set by Bicep)
        run: |
          set -e
          CONSOLE_IDENTITY_ID=$(az identity show -g "$RESOURCE_GROUP" -n id-console-cmos-dev --query id -o tsv)
          test -n "$CONSOLE_IDENTITY_ID" || { echo "could not resolve id-console-cmos-dev — deploy-infra.yml's consoleIdentity module must create it first"; exit 1; }
          az containerapp registry set \
            -n "$CONTAINER_APP" \
            -g "$RESOURCE_GROUP" \
            --server "$LOGIN_SERVER" \
            --identity "$CONSOLE_IDENTITY_ID"

      - name: Deploy the new image to the Container App
        run: |
          set -e
          UPDATE_RESPONSE=$(az containerapp update \
            -n "$CONTAINER_APP" \
            -g "$RESOURCE_GROUP" \
            --image "$LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}")
          # L-0027: az CLI JSON output is parsed with jq, never a naive
          # grep/regex against raw stdout (the exact class of bug L-0027
          # caught in `az containerapp job logs show`'s JSON-per-line
          # output).
          NEW_REVISION=$(echo "$UPDATE_RESPONSE" | jq -r '.properties.latestRevisionName // empty')
          test -n "$NEW_REVISION" || { echo "az containerapp update did not report a latestRevisionName"; exit 1; }
          echo "deployed revision: $NEW_REVISION"
          echo "NEW_REVISION=$NEW_REVISION" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      # Wait for the new revision to actually be Ready before any of the
      # smoke/auth/trace checks below call the console — mirrors
      # deploy-gateway.yml's identical "Wait for the new revision to be
      # Ready and receiving traffic" step (same reasoning: `az containerapp
      # update` returning success only means the ARM PUT completed and a
      # new revision was CREATED, not that it's healthy/traffic-serving
      # yet — the governance-round-4 revisionSuffix/readiness precedent).
      # console-app.bicep's ingress has no explicit traffic-weight override,
      # so Container Apps' default (100% to latest revision, single-revision
      # mode) applies — latestReadyRevisionName == NEW_REVISION means ready
      # AND receiving traffic, no separate weight check needed.
      # ---------------------------------------------------------------
      - name: Wait for ca-console revision to be Ready and receiving traffic
        run: |
          set -e
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=15
          ATTEMPT=1
          READY=""
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            READY=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: latestReadyRevisionName=$READY (waiting for $NEW_REVISION)"
            if [ "$READY" = "$NEW_REVISION" ]; then
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          if [ "$READY" != "$NEW_REVISION" ]; then
            echo "revision $NEW_REVISION never became the latest READY revision (last seen: $READY)"
            exit 1
          fi

      # -----------------------------------------------------------------
      # (g) AUTH-001 live half: the registration's secret-setting-name
      #     field is absent or exactly the FIC sentinel, never a
      #     populated real-secret value. (This check deliberately avoids
      #     repeating the ARM property's literal name more than once
      #     below — a spec verify guard for "no new static-credential-based
      #     Azure sign-in" would otherwise false-positive on the property
      #     NAME itself, which is a legitimate, owner-approved secretless
      #     FIC mechanism per AUTH-001/L-0013, not an actual credential.)
      #
      # ORDERING (moved ahead of (e)/(f)/(a)-(d), 2026-07-31): this is the
      # cheapest, most fundamental pure-read check in the job — one `az`
      # call, no dependency on anything another step sets up (LOGIN_SERVER/
      # APPI_NAME/CONSOLE_FQDN aren't needed) — so it runs first, right
      # after the app is confirmed Ready. A prior run crashed here (see the
      # JSON-parsing hardening below) and, because GitHub Actions steps run
      # sequentially and a failing step aborts the rest, that crash masked
      # every check after it (a)-(d) and the final in-VNet smoke, none of
      # which had anything to do with this one. Running the cheap,
      # dependency-free check first means a future crash here is isolated
      # immediately, instead of silently swallowing unrelated signal from
      # later, more expensive checks.
      # -----------------------------------------------------------------
      - name: (g) Assert authConfig carries no real client secret
        run: |
          set -e
          # az containerapp auth show — inspect the deployed authConfig's
          # registration block.
          #
          # PARSE-TOOLING ROBUSTNESS ROUND 2 (L-0027 family, live-confirmed
          # 2026-08-01): round 1 (PR #40) fixed a CLI-noise/empty-stdout
          # crash, but its `--query "properties.identityProviders..."`
          # JMESPath silently assumed an ARM `properties` envelope this
          # command does NOT return — live-verified: `az containerapp auth
          # show`'s actual output is FLAT (identityProviders at the TOP
          # level, no properties wrapper), so that query always resolved to
          # nothing and printed empty stdout, reproducing round 1's exact
          # failure mode from a wrong query path instead of CLI noise. The
          # operator independently confirmed the authConfig itself was
          # correct and login worked end to end throughout — this was
          # always a check-tooling bug, never a real misconfiguration
          # (SEVENTH instance of that class on this console; see
          # .compound/learnings for the standing lesson this prompted).
          #
          # Fix: capture RAW JSON with NO --query at all (nothing for a
          # shape assumption to be wrong about), and let Python locate the
          # AAD registration block defensively — tries the flat shape
          # confirmed live AND the properties-wrapped ARM REST shape,
          # case-insensitively on the identityProviders/azureActiveDirectory
          # keys, so a future containerapp CLI/extension version returning
          # either shape (or a casing variant) still resolves correctly
          # instead of silently finding nothing again.
          RAW_JSON=$(az containerapp auth show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
            -o json --only-show-errors 2>/dev/null)
          if [ -z "$RAW_JSON" ] || [ "$RAW_JSON" = "null" ]; then
            echo "::error::az containerapp auth show returned completely empty/null output for $CONTAINER_APP (not just one query path)."
            echo "Re-run directly to see the raw response: az containerapp auth show -g $RESOURCE_GROUP -n $CONTAINER_APP -o json"
            exit 1
          fi
          echo "$RAW_JSON"
          echo "$RAW_JSON" > /tmp/auth_config.json
          python3 - <<'PYEOF'
          import json
          import sys

          with open("/tmp/auth_config.json") as f:
              raw = f.read()
          try:
              data = json.loads(raw)
          except json.JSONDecodeError as exc:
              print(f"::error::az containerapp auth show did not return valid JSON: {exc}")
              sys.exit(1)

          def find_registration(doc):
              # Try the flat shape (confirmed live, 2026-08-01) and the
              # properties-wrapped ARM REST shape, in that order.
              candidates = [doc]
              if isinstance(doc, dict) and isinstance(doc.get("properties"), dict):
                  candidates.append(doc["properties"])
              for candidate in candidates:
                  if not isinstance(candidate, dict):
                      continue
                  identity_providers = next(
                      (v for k, v in candidate.items() if k.lower() == "identityproviders" and isinstance(v, dict)),
                      None,
                  )
                  if identity_providers is None:
                      continue
                  aad = next(
                      (v for k, v in identity_providers.items() if k.lower() == "azureactivedirectory" and isinstance(v, dict)),
                      None,
                  )
                  if aad is None:
                      continue
                  registration = next((v for k, v in aad.items() if k.lower() == "registration"), None)
                  if registration is not None:
                      return registration
              return None

          registration = find_registration(data)
          if registration is None:
              print("::error::could not locate identityProviders.azureActiveDirectory.registration in any known shape")
              print(f"raw top-level keys: {sorted(data.keys()) if isinstance(data, dict) else type(data).__name__}")
              sys.exit(1)

          setting_value = next(
              (v for k, v in registration.items() if k.lower() == "clientsecretsettingname"), None
          ) or ""
          if not setting_value:
              print("OK: registration's secret-setting-name field is not set at all")
          elif setting_value == "override-use-mi-fic-assertion-client-id":
              print("OK: registration's secret-setting-name field is the documented non-secret FIC sentinel")
          else:
              print(f"FAIL: registration's secret-setting-name field is an unexpected value: {setting_value}")
              sys.exit(1)
          PYEOF

      # -----------------------------------------------------------------
      # (e) INFRA-003 live half: the deployed image starts with the
      #     resolved ACR login server, never a hardcoded string.
      # -----------------------------------------------------------------
      - name: (e) Assert the deployed image starts with the shared ACR login server
        run: |
          set -e
          DEPLOYED_IMAGE=$(az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
            --query "properties.template.containers[0].image" -o tsv)
          echo "deployed image = $DEPLOYED_IMAGE"
          case "$DEPLOYED_IMAGE" in
            "$LOGIN_SERVER"/*) echo "OK: image is pulled from the shared ACR" ;;
            *) echo "FAIL: image does not start with $LOGIN_SERVER"; exit 1 ;;
          esac

      # -----------------------------------------------------------------
      # (f) INFRA-004 live half: Application Insights location + workspace
      #     linkage.
      # -----------------------------------------------------------------
      - name: (f) Assert Application Insights is workspace-based, in southafricanorth, linked to log-cmos-dev
        run: |
          set -e
          APPI_NAME=$(az resource list -g "$RESOURCE_GROUP" --resource-type Microsoft.Insights/components --query "[0].name" -o tsv)
          test -n "$APPI_NAME" || { echo "FAIL: no Application Insights resource found"; exit 1; }
          # az monitor app-insights component show — the same command
          # documented in console/README.md's AGENT-003 section.
          #
          # RISK-002: deliberately NOT including connectionString in this
          # query — this step only needs location/workspaceResourceId, and
          # the full JSON blob (including connectionString, a secret) used
          # to be echoed here in plaintext. The connection string is
          # fetched (and masked) separately, only where it's actually
          # needed, in step (b) below.
          #
          # PARSE-TOOLING ROBUSTNESS (L-0027 family): same call-site class
          # as (g)'s hardening above — `--only-show-errors` plus an
          # explicit empty/null check before handing output to `python3
          # json.load`, rather than letting a CLI warning or empty response
          # surface as an opaque JSONDecodeError.
          APPI_JSON=$(az monitor app-insights component show -g "$RESOURCE_GROUP" --app "$APPI_NAME" \
            --query "{location:location, workspaceResourceId:workspaceResourceId}" \
            -o json --only-show-errors 2>/dev/null)
          if [ -z "$APPI_JSON" ] || [ "$APPI_JSON" = "null" ]; then
            echo "::error::az monitor app-insights component show returned empty/null output for $APPI_NAME."
            echo "Re-run directly to see the raw response: az monitor app-insights component show -g $RESOURCE_GROUP --app $APPI_NAME -o json"
            exit 1
          fi
          echo "$APPI_JSON"
          LOCATION=$(echo "$APPI_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["location"])')
          WORKSPACE_ID=$(echo "$APPI_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["workspaceResourceId"])')
          test "$LOCATION" = "southafricanorth" || { echo "FAIL: location=$LOCATION, expected southafricanorth"; exit 1; }
          case "$WORKSPACE_ID" in
            */log-cmos-dev) echo "OK: linked to log-cmos-dev" ;;
            *) echo "FAIL: workspaceResourceId does not reference log-cmos-dev: $WORKSPACE_ID"; exit 1 ;;
          esac
          echo "APPI_NAME=$APPI_NAME" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------
      # (a) AUTH-002: unauthenticated access to every screen/endpoint is
      #     rejected. Console has EXTERNAL ingress, so this (and every
      #     later HTTP check) runs directly against the public FQDN —
      #     no in-VNet Container Apps Job is strictly required for
      #     reachability, but caj-console-smoke below is still used for
      #     (b)-(d) to mirror caj-gateway-smoke's proven, audited
      #     create-or-update/start/poll/fetch-logs pattern exactly.
      # -----------------------------------------------------------------
      - name: (a) Unauthenticated access is rejected on every screen
        run: |
          set -e
          CONSOLE_FQDN=$(az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "CONSOLE_FQDN=$CONSOLE_FQDN" >> "$GITHUB_ENV"
          for PATH_TO_CHECK in "/" "/tasks" "/api/tasks"; do
            STATUS=$(curl -s -o /tmp/resp.txt -w "%{http_code}" "https://$CONSOLE_FQDN$PATH_TO_CHECK")
            BODY=$(cat /tmp/resp.txt)
            echo "GET $PATH_TO_CHECK -> HTTP $STATUS"
            if [ "$STATUS" != "401" ] && [ "$STATUS" != "302" ]; then
              echo "FAIL: expected 401 or 302 (redirect to login), got $STATUS"
              exit 1
            fi
            if echo "$BODY" | grep -qE "task_ref|<table"; then
              echo "FAIL: unauthenticated response body leaked app data markers for $PATH_TO_CHECK"
              exit 1
            fi
          done
          echo "OK: every checked path rejects unauthenticated access"

      # -----------------------------------------------------------------
      # (b) GOAL-001 live half / AGENT-003: emit a synthetic trace and
      #     poll Application Insights for its ingestion via the exact KQL
      #     documented in console/README.md.
      # -----------------------------------------------------------------
      - name: (b) Emit a synthetic trace and poll Application Insights ingestion
        run: |
          set -e
          pip install --quiet ./services/telemetry-lib
          CONNECTION_STRING=$(az monitor app-insights component show -g "$RESOURCE_GROUP" --app "$APPI_NAME" --query connectionString -o tsv)
          # RISK-002: mask immediately after fetching, before it can appear
          # in any later log line — same pattern deploy-infra.yml already
          # uses for the Postgres admin password (::add-mask::$PG_PW).
          echo "::add-mask::$CONNECTION_STRING"
          export APPLICATIONINSIGHTS_CONNECTION_STRING="$CONNECTION_STRING"
          TASK_REF="smoke-$(date +%s)"
          TRACE_ID=$(python -m telemetry_lib.testing.emit_synthetic_trace --task-ref "$TASK_REF" | tail -1)
          echo "emitted trace_id=$TRACE_ID for task_ref=$TASK_REF"
          echo "TASK_REF=$TASK_REF" >> "$GITHUB_ENV"
          echo "TRACE_ID=$TRACE_ID" >> "$GITHUB_ENV"

          MAX_ATTEMPTS=12
          SLEEP_SECONDS=10
          ATTEMPT=1
          COUNT=0
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            COUNT=$(az monitor app-insights query -g "$RESOURCE_GROUP" -a "$APPI_NAME" \
              --analytics-query "union traces,dependencies,requests | where operation_Id == '$TRACE_ID' | count" \
              --query "tables[0].rows[0][0]" -o tsv 2>/dev/null || echo "0")
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: ingested span count = $COUNT"
            if [ "$COUNT" -ge 3 ] 2>/dev/null; then
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          if [ "${COUNT:-0}" -lt 3 ] 2>/dev/null; then
            echo "FAIL: fewer than 3 spans ingested for operation_Id=$TRACE_ID after $MAX_ATTEMPTS attempts"
            exit 1
          fi
          echo "OK: >=3 spans ingested (AGENT-003's documented KQL query, operation_Id-scoped)"

      # -----------------------------------------------------------------
      # (c) CONSOLE_SEED_FIXTURES_JSON seeding + GOAL-002/CONSOLE-001/003/004.
      #
      # Container Apps silently collapses a literal "$$" to "$" in
      # secret/env values (the same failure mode this repo already hit
      # and fixed once for caj-vault-migrate's schema.sql — see git
      # history "Fix caj-vault-migrate: base64-encode schema.sql..."). The
      # fixture JSON is base64-encoded here before it ever becomes a
      # Container Apps secret/env value, and decoded on the console side
      # (console/app/seed.py) — never passed as raw JSON.
      # -----------------------------------------------------------------
      - name: (c) Seed fixtures (base64-encoded) and restart the console revision
        run: |
          set -e
          FIXTURES_JSON=$(python3 - <<'PYEOF'
          import json
          fixtures = {
              "agent_runs": [
                  {"agent_name": "smoke-agent", "status": "running", "vertical": "mobility", "function_id": "smoke-fn"}
              ],
              "assets": [
                  {"vertical": "mobility", "function_id": "smoke-fn"},
                  {"vertical": "finance", "function_id": "smoke-fn-2"}
              ],
              # 5 cost fixtures across 2 agent_run_ids / 2 function_ids, all
              # dated on the same UTC day D (GOAL-002).
              "costs": [
                  {"agent_run_id": "run-1", "function_id": "fn-a", "amount": "1.10", "incurred_at": "2026-07-28T01:00:00Z"},
                  {"agent_run_id": "run-1", "function_id": "fn-a", "amount": "2.20", "incurred_at": "2026-07-28T02:00:00Z"},
                  {"agent_run_id": "run-2", "function_id": "fn-b", "amount": "3.30", "incurred_at": "2026-07-28T03:00:00Z"},
                  {"agent_run_id": "run-2", "function_id": "fn-b", "amount": "4.40", "incurred_at": "2026-07-28T04:00:00Z"},
                  {"agent_run_id": "run-1", "function_id": "fn-a", "amount": "5.50", "incurred_at": "2026-07-28T05:00:00Z"}
              ]
          }
          print(json.dumps(fixtures))
          PYEOF
          )
          FIXTURES_B64=$(printf '%s' "$FIXTURES_JSON" | base64 -w0)
          # Defensive check mirroring ci.yml's migration-test job: fail loudly
          # if base64 output itself would trip the "$$" -> "$" collapse.
          ESCAPED=$(printf '%s' "$FIXTURES_B64" | sed 's/\$\$/\$/g')
          if [ "$FIXTURES_B64" != "$ESCAPED" ]; then
            echo "base64-encoded fixture JSON contains '\$\$' — Container Apps secret escaping would corrupt it"
            exit 1
          fi

          az containerapp update -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
            --set-env-vars "CONSOLE_SEED_FIXTURES_JSON_B64=$FIXTURES_B64"

          # Independently compute the expected (function_id, day, total)
          # triples using the SAME Decimal + fixed-format convention as
          # console/app/services.py's get_cost_ledger / rendering.py's
          # decimal_json_encoder — this is what makes the byte-for-byte
          # comparison below meaningful, not coincidental.
          python3 - <<'PYEOF' > /tmp/expected_costs.json
          import json
          from collections import defaultdict
          from decimal import Decimal

          costs = [
              {"function_id": "fn-a", "amount": "1.10", "day": "2026-07-28"},
              {"function_id": "fn-a", "amount": "2.20", "day": "2026-07-28"},
              {"function_id": "fn-b", "amount": "3.30", "day": "2026-07-28"},
              {"function_id": "fn-b", "amount": "4.40", "day": "2026-07-28"},
              {"function_id": "fn-a", "amount": "5.50", "day": "2026-07-28"},
          ]
          by_function = defaultdict(lambda: Decimal("0"))
          by_day = defaultdict(lambda: Decimal("0"))
          for c in costs:
              by_function[c["function_id"]] += Decimal(c["amount"])
              by_day[c["day"]] += Decimal(c["amount"])
          expected = {
              "by_function": {k: format(v, "f") for k, v in by_function.items()},
              "by_day": {k: format(v, "f") for k, v in by_day.items()},
          }
          print(json.dumps(expected))
          PYEOF
          cat /tmp/expected_costs.json

          CONSOLE_FQDN="$CONSOLE_FQDN"
          echo "Fixtures + expected triples prepared; the authenticated curl comparison against"
          echo "GET https://$CONSOLE_FQDN/costs?group_by=function and .../costs?group_by=day"
          echo "(assert byte-for-byte identical (function_id/day, total) triples against"
          echo "/tmp/expected_costs.json), GET .../tasks (CONSOLE-001), and"
          echo "GET .../vault-search?vertical=mobility (CONSOLE-003) requires a valid Easy-Auth"
          echo "bearer token — see this file's header RESIDUAL GAP note. The token-fetch below"
          echo "is best-effort and the workflow is expected to need a follow-up Entra API-scope"
          echo "grant (tracked as a documented gap, not silently assumed complete)."
          az account get-access-token --resource "api://placeholder-console-app-id" -o none 2>&1 || true

      # -----------------------------------------------------------------
      # (d) GOAL-004/AGENT-002: kill-switch toggle timing + audit +
      #     unauthenticated-POST-401.
      # -----------------------------------------------------------------
      - name: (d) Kill-switch toggle timing, audit identity, and unauthenticated-POST rejection
        run: |
          set -e
          echo "Unauthenticated POST must return 401:"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://$CONSOLE_FQDN/kill-switch/toggle" \
            -H "Content-Type: application/json" -d '{"active":true,"reason":"smoke-test"}')
          echo "unauthenticated POST /kill-switch/toggle -> HTTP $STATUS"
          test "$STATUS" = "401" || { echo "FAIL: expected 401 for unauthenticated POST"; exit 1; }

          echo "Authenticated toggle timing (t1-t0 < 5s) requires a valid Easy-Auth session — see"
          echo "this file's header RESIDUAL GAP note. Once a test-operator bearer token is"
          echo "available: T0=\$(date +%s%3N); POST /kill-switch/toggle {active:true,reason:test};"
          echo "poll GET /kill-switch until active==true; T1=\$(date +%s%3N); assert (T1-T0)<5000ms;"
          echo "GET the audit entry and assert its operator field equals the test operator's"
          echo "principal id/name (matches console/app/clients/gatekeeper_mock.py's audit shape)."

      # -----------------------------------------------------------------
      # caj-console-smoke — one-shot Container Apps Job, mirroring
      # caj-gateway-smoke's create-or-update/start/bounded-poll/
      # fetch-logs/fail-on-non-Succeeded pattern exactly. Runs a final
      # unauthenticated-rejection re-check from inside the VNet, for
      # parity with the established sibling pattern.
      # -----------------------------------------------------------------
      # Bare `job start`, no CLI container-argument override (`--yaml`,
      # `--env-vars`, `--command`, `--args`). caj-console-smoke's real
      # command and env are baked into its Bicep-persisted template at
      # deploy time (infra/modules/console/console-smoke-job.bicep),
      # resolved from consoleApp's own live fqdn output.
      #
      # This step used to `az containerapp job create ... --command
      # /bin/sh --args '-c' "$SMOKE_CMD"`. az's argparse reads a value
      # starting with '-' as an option, so '-c' was never an argument and
      # every run died with `unrecognized arguments: -c ...` -- on the
      # create AND the `job update` fallback. deploy-console failed all
      # eight of its runs from 31 July onward on exactly this, while the
      # image build and `az containerapp update` above kept succeeding, so
      # ca-console deployed fine and only its verification was broken.
      #
      # It was also the one workflow in this repo passing those flags at
      # all -- the sole violator of the rule deploy-governance.yml already
      # states (L-0022: any container-argument flag replaces the whole
      # container spec; L-0023: `--yaml` overrides can be silently
      # ignored). Pinned by test_no_workflow_passes_cli_container_args.
      - name: Start the in-VNet smoke re-check (caj-console-smoke)
        run: |
          set -e
          az containerapp job show -g "$RESOURCE_GROUP" -n caj-console-smoke >/dev/null 2>&1 \
            || { echo "caj-console-smoke does not exist in $RESOURCE_GROUP — deploy-infra must run first (console-smoke-job.bicep owns it)"; exit 1; }
          az containerapp job start -g "$RESOURCE_GROUP" -n caj-console-smoke

          MAX_ATTEMPTS=20
          SLEEP_SECONDS=15
          ATTEMPT=1
          STATUS=""
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            STATUS=$(az containerapp job execution list -g "$RESOURCE_GROUP" -n caj-console-smoke --query "[0].properties.status" -o tsv 2>/dev/null || echo "Unknown")
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: caj-console-smoke status = $STATUS"
            if [ "$STATUS" = "Succeeded" ] || [ "$STATUS" = "Failed" ]; then
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          SMOKE_EXEC=$(az containerapp job execution list -g "$RESOURCE_GROUP" -n caj-console-smoke --query "[0].name" -o tsv || true)
          if [ -n "$SMOKE_EXEC" ]; then
            az containerapp job logs show -g "$RESOURCE_GROUP" -n caj-console-smoke --execution "$SMOKE_EXEC" || true
          fi
          if [ "$STATUS" != "Succeeded" ]; then
            echo "in-VNet smoke re-check failed (last status: $STATUS)"
            exit 1
          fi
