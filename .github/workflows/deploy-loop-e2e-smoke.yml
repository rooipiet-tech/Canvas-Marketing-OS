name: deploy-loop-e2e-smoke

# Runs caj-loop-e2e-smoke (plan step 21; AC-18) — the S8 proof-circuit
# live smoke test (orchestrator/loop_e2e_smoke.py): publishes a synthetic
# daily-signal-loop heartbeat onto the real `event` queue, then polls
# ca-orchestrator's own GET /runs/{task_ref} until the proof circuit
# (draft-content -> qa-review -> request-approval) reaches a terminal
# state. signal->brief->draft->QA->approval-card-created is the smoke's
# success condition (the GOAL's own wording); the Buffer write stays
# dry-run regardless, structurally enforced by Publisher (step 14) —
# this smoke never calls POST /publish.
#
# TRIGGER: chained via `workflow_run` on deploy-infra's completion, not
# `push` — mirrors deploy-mcp.yml's identical reasoning (a different
# workflow, so this is not a self-reference under L-0009): deploy-infra
# is what provisions caj-loop-e2e-smoke in the first place (infra/main.bicep,
# via the S8 LOOP E2E SMOKE JOB append-only block), so this must run
# after it, never in parallel with it.
#
# GUARD: mirrors deploy-infra.yml's own caj-orchestrator-smoke-test guard
# ("refuse to run the live smoke test against the bootstrap placeholder
# image") — ca-orchestrator's REAL image is only ever set by
# orchestrator-image.yml's gated deploy job, a SEPARATE workflow from
# deploy-infra; deploy-infra completing successfully does not by itself
# guarantee a real (non-placeholder) orchestrator image is live yet.
#
# AC-18 / L-0022 / L-0023: this job's own persisted Bicep template
# (loop-e2e-smoke-job.bicep) already carries the correct command/env —
# no start-time override is functionally required — but the GOAL's own
# hard rule mandates the `az rest` bare StartJobExecutionTemplate pattern
# for every new Container Apps Job regardless, so this workflow uses it:
# the job's own CURRENT resolved container spec (`az containerapp job
# show`) is re-POSTed verbatim to the `/start` action's bare body shape
# (`containers`/`initContainers` at the top level, no `properties`/
# `template` wrapper — L-0023), never `az containerapp job start --yaml`.

on:
  # Callable by deploy-pipeline.yml -- see that workflow's header.
  workflow_call:
    inputs:
      mode:
        required: false
        type: string
        default: full
  workflow_dispatch:
    inputs:
      mode:
        description: >
          'full' runs the real proof-circuit smoke (default, unchanged
          behaviour). 'gate-check-only' is a one-off, deterministic test
          of the request-approval -> gate-check -> Teams-webhook path only
          (orchestrator/teams_webhook_smoke.py) -- bypasses
          ingest-signals/draft-brief/draft-content/qa-review and every LLM
          call among them entirely. See that module's docstring (round
          19j follow-up, 6 Aug 2026) for the full rationale and the
          SECURITY NOTE on why it reuses the real publish.social_post
          policy entry rather than a synthetic test one. Never fires
          except via an explicit manual workflow_dispatch with this input
          set -- the workflow_run chain trigger below always runs 'full'.
        required: false
        type: choice
        default: full
        options:
          - full
          - gate-check-only
# Concurrency is owned by deploy-pipeline.yml, the single caller that
# runs every deploy stage in one fixed order. A called workflow must
# NOT take the `cmos-dev-deploy` group its own caller already holds --
# it would wait forever on a group the parent cannot release until the
# child finishes. Pinned by test_deploy_pipeline_shape.py.

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: cmos-dev

jobs:
  smoke:
    name: loop-e2e-smoke
    # Inverted deliberately. Under `workflow_call` github.event_name is the
    # CALLER's event (push), never 'workflow_call' -- so the old allow-list
    # of event names evaluated false and would have skipped this job
    # silently, disabling the deploy while reporting green. Stated as "run
    # unless I was chained off a workflow_run that did not succeed", which
    # is identical on the workflow_run path and correct on the other three.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: cmos-dev
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bootstrap az CLI extensions (non-interactive)
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az config set extension.dynamic_install_allow_preview=true
          az extension add --name containerapp --yes

      # workflow_run-triggered runs have no `inputs` context at all (only
      # workflow_dispatch does) — default to 'full' there so the normal
      # deploy-infra chain trigger is completely unaffected by this input.
      - name: Resolve smoke mode
        run: |
          # `inputs` is populated for workflow_dispatch and workflow_call
          # alike, and both declare the same 'full' default, so this no
          # longer needs to branch on the event shape at all.
          MODE="${{ inputs.mode || 'full' }}"
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "resolved mode: $MODE"

      - name: Fail fast if caj-loop-e2e-smoke doesn't exist yet
        run: |
          set -e
          az containerapp job show -n caj-loop-e2e-smoke -g "$RESOURCE_GROUP" >/dev/null 2>&1 \
            || { echo "caj-loop-e2e-smoke does not exist in $RESOURCE_GROUP — run deploy-infra first"; exit 1; }
          az containerapp show -n ca-orchestrator -g "$RESOURCE_GROUP" >/dev/null 2>&1 \
            || { echo "ca-orchestrator does not exist in $RESOURCE_GROUP — run deploy-infra first"; exit 1; }

      # gate-check-only only: teams_webhook_smoke.py's resolve_live_fqdn()
      # az-CLI-subprocess fallback is not reliable inside caj-loop-e2e-smoke's
      # plain orchestrator-image container (no az CLI installed there) — the
      # SAME reason orchestrator-image.yml sets CMOS_GATEKEEPER_BASE_URL
      # explicitly on ca-orchestrator (the real app) rather than relying on
      # that fallback in production. Resolved here, on the runner (which
      # does have az CLI + a live login), and injected as a start-time env
      # override in the next step.
      - name: "Resolve ca-gatekeeper's internal FQDN (gate-check-only mode)"
        if: env.MODE == 'gate-check-only'
        run: |
          set -e
          az containerapp show -n ca-gatekeeper -g "$RESOURCE_GROUP" >/dev/null 2>&1 \
            || { echo "ca-gatekeeper does not exist in $RESOURCE_GROUP — run deploy-infra/deploy-governance first"; exit 1; }
          FQDN=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-gatekeeper --query "properties.configuration.ingress.fqdn" -o tsv)
          test -n "$FQDN" || { echo "ca-gatekeeper has no resolvable ingress FQDN"; exit 1; }
          echo "GATEKEEPER_BASE_URL=https://$FQDN" >> "$GITHUB_ENV"
          echo "resolved ca-gatekeeper base URL: https://$FQDN"

      # F-TEAMS-WEBHOOK-SMOKE round 19l INCIDENT: the script's first live run
      # 500'd on a Postgres FK violation (gate_decisions.agent_run_id has no
      # backing agent_runs row) because it called /gate-check with a bare
      # uuid4(), never registering a real Vault agent_run first — every real
      # production caller (request_approval_handler) always has one already,
      # created earlier in the same task lineage. The fix has the script make
      # the same real get_or_create_campaign()/create_agent_run() calls every
      # dispatch handler makes, which needs ca-vault's base URL for the SAME
      # reason ca-gatekeeper's is resolved above — resolve_live_fqdn()'s
      # az-CLI fallback doesn't work inside this job's plain container.
      - name: "Resolve ca-vault's internal FQDN (gate-check-only mode)"
        if: env.MODE == 'gate-check-only'
        run: |
          set -e
          az containerapp show -n ca-vault -g "$RESOURCE_GROUP" >/dev/null 2>&1 \
            || { echo "ca-vault does not exist in $RESOURCE_GROUP — run deploy-infra/deploy-governance first"; exit 1; }
          VAULT_FQDN=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-vault --query "properties.configuration.ingress.fqdn" -o tsv)
          test -n "$VAULT_FQDN" || { echo "ca-vault has no resolvable ingress FQDN"; exit 1; }
          echo "VAULT_BASE_URL=https://$VAULT_FQDN" >> "$GITHUB_ENV"
          echo "resolved ca-vault base URL: https://$VAULT_FQDN"

      # Same guard as deploy-infra.yml's own caj-orchestrator-smoke-test
      # step (see that workflow's identical incident comment): a real,
      # non-placeholder image is only ever set by orchestrator-image.yml's
      # gated deploy job, a separate workflow this one does not chain off.
      - name: "Guard: refuse to run against the bootstrap placeholder image"
        run: |
          set -e
          PLACEHOLDER="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          CURRENT=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-orchestrator --query "properties.template.containers[0].image" -o tsv)
          if [ "$CURRENT" = "$PLACEHOLDER" ]; then
            echo "::error::ca-orchestrator is still running the bootstrap placeholder image ($PLACEHOLDER)."
            echo "A real image is only ever set by orchestrator-image.yml's gated 'deploy' job -- check whether it has run and been approved:"
            echo "  gh run list --workflow=orchestrator-image.yml --limit 5"
            exit 1
          fi
          echo "ca-orchestrator's resolved image is not the placeholder ($CURRENT) — proceeding."
          echo "ORCHESTRATOR_IMAGE=$CURRENT" >> "$GITHUB_ENV"

      # F-SMOKE-JOB-IMAGE-STALENESS (2026-08-05, round 19b): caj-loop-e2e-smoke
      # runs orchestrator/loop_e2e_smoke.py baked into ITS OWN Container App
      # Job image (infra/main.bicep's orchestratorLoopE2eSmokeJob module sets
      # `orchestratorImage: orchestratorContainerImage`) -- a SEPARATE image
      # reference from ca-orchestrator (the app)'s own live image, resolved
      # once at deploy-infra.yml's "preserve live image" what-if/deploy step.
      # orchestrator-image.yml's gated deploy job only ever calls `az
      # containerapp update` (an APP), never `az containerapp job update` (a
      # JOB) -- it has no code path that touches caj-loop-e2e-smoke at all.
      # Confirmed live, 2026-08-05: after PR #73 (F-QA-SUPERLATIVE-GUARD) and
      # PR #74 (F-SMOKE-GREEN-REDEFINITION) both merged and orchestrator-image
      # redeployed ca-orchestrator to e0e0a80, a same-push auto-triggered
      # deploy-infra run resolved ca-orchestrator's live image BEFORE
      # orchestrator-image's own deploy step had updated it (both auto-fire
      # off the same push, queued only by the shared concurrency group, with
      # no ordering guarantee between them) -- so deploy-infra's Bicep baked
      # the STALE pre-e0e0a80 image into caj-loop-e2e-smoke. The very next
      # smoke run then executed the OLD evaluate_final_state()-less
      # loop_e2e_smoke.py against a real QA_BLOCKED verdict and failed with
      # the pre-PR-#74 message shape, even though ca-orchestrator itself was
      # already fully current. Fix: refresh caj-loop-e2e-smoke's image to
      # ca-orchestrator's CURRENT live image (just re-verified non-placeholder
      # above) immediately before every start, closing the staleness window
      # regardless of deploy-infra/orchestrator-image ordering on any given
      # push -- this smoke run is now guaranteed to execute the same code
      # that is actually live on ca-orchestrator, not a snapshot from
      # whenever deploy-infra last happened to run.
      - name: Refresh caj-loop-e2e-smoke's image to match ca-orchestrator's current live image
        run: |
          set -e
          JOB_IMAGE=$(az containerapp job show -g "$RESOURCE_GROUP" -n caj-loop-e2e-smoke --query "properties.template.containers[0].image" -o tsv)
          if [ "$JOB_IMAGE" = "$ORCHESTRATOR_IMAGE" ]; then
            echo "caj-loop-e2e-smoke's image ($JOB_IMAGE) already matches ca-orchestrator's live image -- no update needed."
          else
            echo "caj-loop-e2e-smoke's image ($JOB_IMAGE) is stale relative to ca-orchestrator's live image ($ORCHESTRATOR_IMAGE) -- updating."
            az containerapp job update -g "$RESOURCE_GROUP" -n caj-loop-e2e-smoke --image "$ORCHESTRATOR_IMAGE"
            UPDATED=$(az containerapp job show -g "$RESOURCE_GROUP" -n caj-loop-e2e-smoke --query "properties.template.containers[0].image" -o tsv)
            test "$UPDATED" = "$ORCHESTRATOR_IMAGE" || { echo "::error::caj-loop-e2e-smoke's image is still $UPDATED after update -- expected $ORCHESTRATOR_IMAGE"; exit 1; }
            echo "caj-loop-e2e-smoke's image is now $UPDATED."
          fi

      # MAIDEN-DEPLOY INCIDENT (2026-08-01) fix: loop-e2e-smoke-job.bicep now
      # declares `registries[]` itself (mirrors smoke-test-job.bicep's own,
      # already-working pattern for this exact identity), so no separate
      # `job registry set` step is needed here — matching how deploy-infra.yml
      # never runs one for caj-orchestrator-smoke-test either.

      # AC-18 / L-0022 / L-0023: skip `job start --yaml` entirely (it
      # silently ignores a `properties/template` wrapper -- L-0023) and
      # skip any Container-Argument flag (`--env-vars`/`--command`, which
      # switches into a from-scratch override mode and drops every field
      # not re-supplied -- L-0022). Instead: read the job's own CURRENTLY
      # PERSISTED container spec and re-POST it verbatim, in the bare
      # StartJobExecutionTemplate shape (`containers` at the top level, no
      # wrapper) the ARM `/start` action actually accepts.
      - name: Start caj-loop-e2e-smoke (az rest bare StartJobExecutionTemplate)
        id: start
        run: |
          set -e
          az containerapp job show -g "$RESOURCE_GROUP" -n caj-loop-e2e-smoke \
            --query "properties.template.containers" -o json > /tmp/loop-e2e-smoke-containers.json
          jq -n --slurpfile containers /tmp/loop-e2e-smoke-containers.json \
            '{containers: $containers[0]}' > /tmp/loop-e2e-smoke-start.json

          # gate-check-only only: override this ONE execution's command to
          # run teams_webhook_smoke.py instead of the normal proof-circuit
          # smoke, and inject CMOS_GATEKEEPER_BASE_URL + VAULT_API_URL
          # (both resolved by the runner in the previous two steps) since
          # that script needs both and the job's persisted spec never
          # carries either (the normal smoke never talks to gatekeeper, and
          # already gets ca-vault's URL via resolve_live_fqdn() at
          # container-runtime since the normal smoke DOES have az CLI
          # available in ITS image — teams_webhook_smoke.py runs in the
          # SAME image but that fallback still isn't reliable enough to
          # depend on for a test, per the FQDN-resolution step's own
          # comment above). This mutates only the one-off /start request
          # body, in memory, on the runner -- it does NOT call `job
          # update`, so caj-loop-e2e-smoke's own persisted definition (what
          # deploy-infra.yml's Bicep owns) is completely untouched; the
          # very next 'full'-mode run goes right back to the normal command
          # with no trace of this override.
          if [ "$MODE" = "gate-check-only" ]; then
            echo "gate-check-only mode: overriding this execution's command + env (job definition itself is untouched)"
            jq --arg gk_url "$GATEKEEPER_BASE_URL" --arg vault_url "$VAULT_BASE_URL" '
              .containers[0].command = ["python", "-m", "orchestrator.teams_webhook_smoke"]
              | .containers[0].env = (
                  [.containers[0].env[]? | select(.name != "CMOS_GATEKEEPER_BASE_URL" and .name != "VAULT_API_URL")]
                  + [{name: "CMOS_GATEKEEPER_BASE_URL", value: $gk_url}, {name: "VAULT_API_URL", value: $vault_url}]
                )
            ' /tmp/loop-e2e-smoke-start.json > /tmp/loop-e2e-smoke-start.override.json
            mv /tmp/loop-e2e-smoke-start.override.json /tmp/loop-e2e-smoke-start.json
          fi

          START_RESPONSE=$(az rest --method post \
            --url "https://management.azure.com/subscriptions/{subscriptionId}/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.App/jobs/caj-loop-e2e-smoke/start?api-version=2024-03-01" \
            --body @/tmp/loop-e2e-smoke-start.json)
          EXEC_NAME=$(echo "$START_RESPONSE" | jq -r '.name // empty')
          test -n "$EXEC_NAME" || { echo "job start did not return an execution name: $START_RESPONSE"; exit 1; }
          echo "started execution: $EXEC_NAME"
          echo "EXEC_NAME=$EXEC_NAME" >> "$GITHUB_ENV"

      - name: Poll caj-loop-e2e-smoke execution to Succeeded
        run: |
          MAX_ATTEMPTS=40
          SLEEP_SECONDS=15
          ATTEMPT=1
          STATUS=""
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            STATUS=$(az containerapp job execution list -g "$RESOURCE_GROUP" -n caj-loop-e2e-smoke --query "[?name=='$EXEC_NAME'].properties.status" -o tsv 2>/dev/null || echo "Unknown")
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: caj-loop-e2e-smoke ($EXEC_NAME) status = $STATUS"
            if [ "$STATUS" = "Succeeded" ] || [ "$STATUS" = "Failed" ]; then
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          echo "LOOP_SMOKE_STATUS=$STATUS" >> "$GITHUB_ENV"

      # L-0024: `job logs show` requires an explicit --container even for
      # a single-container job (matches loop-e2e-smoke-job.bicep's
      # declared container name 'loop-e2e-smoke'). L-0027: dump raw
      # output first, then a best-effort structured `jq .Log` pass that
      # skips (not aborts on) any line that isn't valid JSON.
      - name: Dump caj-loop-e2e-smoke logs
        if: always()
        run: |
          az containerapp job logs show -g "$RESOURCE_GROUP" -n caj-loop-e2e-smoke --execution "$EXEC_NAME" --container loop-e2e-smoke > /tmp/loop-e2e-smoke.log 2>&1 || true
          echo "--- raw output ---"
          cat /tmp/loop-e2e-smoke.log || true
          echo "--- best-effort .Log extraction (lines that are JSON-wrapped; silently skips lines that aren't) ---"
          jq -R 'fromjson? | .Log // empty' /tmp/loop-e2e-smoke.log 2>/dev/null || true

      - name: Assert caj-loop-e2e-smoke succeeded
        run: |
          if [ "$LOOP_SMOKE_STATUS" != "Succeeded" ]; then
            echo "caj-loop-e2e-smoke did not reach Succeeded (last status: $LOOP_SMOKE_STATUS)"
            exit 1
          fi

      # Ordered AFTER the assert above deliberately: `if: failure()` is
      # false until a step has actually failed, and the assert is the
      # step that fails. Run #117 proved it -- placed before the assert,
      # this step silently skipped on a red run, which is the one run it
      # exists for.
      # The smoke job's own logs say WHICH stages failed; they can never say
      # WHY, because the work happens in ca-orchestrator, a different
      # container. Run #115 dead-lettered all 7 stages and the dump above
      # named every one of them without a single line of causal detail --
      # the handler's own fetch_url_failed / DispatchError messages were
      # sitting in ca-orchestrator's log the whole time, and no workflow in
      # this repo dumped them. Diagnosing a red loop meant a human with az
      # CLI access. This closes that gap: on failure, the reason lands in
      # the same run that reports the failure.
      - name: Dump ca-orchestrator's own logs (why the stages failed)
        if: failure()
        run: |
          echo "--- ca-orchestrator recent logs (the handler-side reason) ---"
          az containerapp logs show \
            -g "$RESOURCE_GROUP" -n ca-orchestrator \
            --container orchestrator --tail 300 --format text \
            > /tmp/ca-orchestrator.log 2>&1 || true
          cat /tmp/ca-orchestrator.log || true
          echo "--- lines mentioning a failure the loop would dead-letter on ---"
          grep -Ei "fetch_url_failed|DispatchError|ingest-signals|redaction|traceback|error" \
            /tmp/ca-orchestrator.log || echo "(no matching lines)"

          # A handler dying on unresolved config ("requires a resolved
          # base_url") is a wiring question, not a code question, and the
          # next thing anyone asks is what ca-orchestrator was actually
          # given. orchestrator-image.yml's "Wire live FQDNs" step SKIPS
          # any dependent service with no live ingress FQDN, emitting only
          # a ::warning:: -- so a missing var here is silent by design and
          # worth printing next to the failure it causes.
          echo "--- ca-orchestrator's dependent-service env wiring ---"
          az containerapp show -g "$RESOURCE_GROUP" -n ca-orchestrator \
            --query "properties.template.containers[0].env[?contains(name,'VAULT') || contains(name,'CMOS_')].{name:name,value:value}" \
            -o table || true
          # F-INGEST-EMPTY-SCAN: fixture mode makes fetch_url return the
          # SAME synthetic body for every URL with no network call at all,
          # and it is the code-level default (`if not
          # flag_enabled("MCP_WEB_LIVE_MODE")`). Every ingest guard would
          # still pass -- the floors count URLs and distinct domains, never
          # content -- so a scan reading nothing but a fixture looks
          # identical to a real one until the model emits no signals.
          # main.bicep defaults mcpWebLiveMode to true, but deploy-mcp has
          # its own deploy cadence, so the live value is worth stating.
          echo "--- is ca-mcp-web actually fetching, or serving fixtures? ---"
          az containerapp show -g "$RESOURCE_GROUP" -n mcp-web \
            --query "properties.template.containers[0].env[?name=='MCP_WEB_LIVE_MODE' || name=='MCP_WEB_ALLOWLIST'].{name:name,value:value}" \
            -o table || true

          echo "--- do those services have resolvable ingress FQDNs at all? ---"
          for APP in ca-vault ca-model-gateway mcp-web ca-gatekeeper; do
            FQDN=$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP" \
              --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || true)
            echo "$APP -> ${FQDN:-<none>}"
          done
