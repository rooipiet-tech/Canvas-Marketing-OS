name: deploy-mcp

# Builds and pushes the 4 MCP images (mcp-web, mcp-buffer, mcp-canva,
# mcp-smoke) to the shared ACR, then updates the 3 mcp-* Container Apps'
# and caj-mcp-smoke's images, and proves the deployment works via the
# in-VNet MCP conformance smoke test.
#
# MAIDEN-DEPLOY INCIDENT (2026-07-31): deploy-infra failed provisioning
# mcp-web/mcp-buffer/mcp-canva with MANIFEST_UNKNOWN — none of their
# images had ever been built, and infra/main.bicep used to compute
# `.../mcp-web:latest` itself, with nothing ever guaranteeing that tag
# existed. This workflow used to ALSO run `az deployment group create`
# against infra/main.bicep itself (a redundant, duplicate Bicep apply of
# the exact same template deploy-infra.yml already owns) as a workaround
# for that bootstrap-ordering problem. Rebuilt from scratch to adopt the
# converged 3(+1)-part bootstrap contract this repo has now converged on
# three times over (L-0048 gateway/orchestrator, L-0049 console — see
# infra/modules/mcp/container-app.bicep's/mcp-smoke-job.bicep's header
# comments and infra/main.bicep's mcpWebContainerImage param header),
# copying deploy-gateway.yml's implementation (the most mature instance
# of this pattern) rather than re-deriving it:
#
#   (1) infra/main.bicep's mcp{Web,Buffer,Canva,Smoke}ContainerImage
#       params default to a public MCR placeholder needing no registry
#       auth at all — deploy-infra.yml is the ONLY thing that ever
#       applies infra/main.bicep, and its preflight preserves each app's
#       CURRENT live image once one exists, never regressing it back to
#       placeholder.
#   (2) infra/modules/mcp/container-app.bicep and mcp-smoke-job.bicep
#       never declare `registries[]` at all (L-0049: a user-assigned
#       identity newly attached AND referenced by `registries[].identity`
#       in the SAME initial create call is a confirmed Azure platform
#       limitation, microsoft/azure-container-apps#1467) — this
#       workflow's `deploy` job is the ONLY thing that ever attaches the
#       ACR-pull identity, via `az containerapp registry set` / `az
#       containerapp job registry set` (Microsoft's own documented
#       reliable workaround), every run, before the image update.
#   (3) This workflow is the ONLY thing that ever calls `az containerapp
#       update --image` / `az containerapp job update --image`, pinned to
#       the building commit's SHA — never `:latest`.
#
# TRIGGER: chained via `workflow_run` on deploy-infra's completion, not
# `push` — mirrors deploy-gateway.yml exactly, for the same reason
# (deploy-gateway.yml's own header comment): running on `push` would race
# deploy-infra's own push-triggered chain (azure-provider-registration ->
# deploy-infra), attempting to update mcp-web/-buffer/-canva/caj-mcp-smoke
# before deploy-infra has even created them (or, worse, before it has
# corrected a bad prior state). This IS safe under L-0009 ("a workflow
# cannot reference itself in workflows:") because this is a CROSS-workflow
# reference (deploy-mcp watching deploy-infra, a different workflow).
# `workflow_run` triggers don't support `paths:` filtering, so this now
# runs after every successful deploy-infra completion, not just mcp-file
# changes — the "fail fast if the app doesn't exist yet" checks below and
# the no-op cost of redeploying an unchanged image are the accepted
# tradeoff for correct ordering over that extra precision.
#
# Split follows the established rule: free, idempotent work (image build
# and push) runs ungated so retries are unattended; only the spend/impact
# step (the real deploy) sits behind the cmos-dev approval gate.

on:
  # Callable by deploy-pipeline.yml -- see that workflow's header.
  workflow_call:
  workflow_dispatch: {}
# Concurrency is owned by deploy-pipeline.yml, the single caller that
# runs every deploy stage in one fixed order. A called workflow must
# NOT take the `cmos-dev-deploy` group its own caller already holds --
# it would wait forever on a group the parent cannot release until the
# child finishes. Pinned by test_deploy_pipeline_shape.py.

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: cmos-dev

jobs:
  build-and-push:
    name: build-and-push
    # Mirrors deploy-infra.yml's own what-if job / deploy-gateway.yml's
    # build-and-push job: only run for a real manual dispatch, or when the
    # watched workflow (deploy-infra) actually succeeded — a workflow_run
    # event fires on ANY conclusion (including failure/cancellation), so
    # this must be checked explicitly, not inferred from the trigger
    # existing at all.
    # Inverted deliberately. Under `workflow_call` github.event_name is the
    # CALLER's event (push), never 'workflow_call' -- so the old allow-list
    # of event names evaluated false and would have skipped this job
    # silently, disabling the deploy while reporting green. Stated as "run
    # unless I was chained off a workflow_run that did not succeed", which
    # is identical on the workflow_run path and correct on the other three.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Register Microsoft.ContainerRegistry (idempotent, retried; free — not gated)
        run: |
          retry() {
            local desc="$1"; shift
            local max_attempts=3
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "$desc failed after $max_attempts attempts"
                return 1
              fi
              echo "$desc failed (attempt $attempt/$max_attempts) - retrying in 10s..."
              attempt=$((attempt + 1))
              sleep 10
            done
          }
          retry "Register Microsoft.ContainerRegistry" az provider register --namespace Microsoft.ContainerRegistry --wait

      # L-0021/L-0048: resolved from the container-registry module's own
      # deployment record (populated by deploy-infra.yml's `az deployment
      # group create`, which always runs before this workflow per the
      # workflow_run trigger above), never `az acr list [0]` — an
      # unfiltered list silently picks the wrong registry the moment a
      # second one exists in the resource group (confirmed live twice
      # already in this repo: vault's orphaned pre-convention registry,
      # and ca-orchestrator's maiden-deploy MANIFEST_UNKNOWN, PR #29).
      - name: Resolve the canonical ACR (from container-registry module's own deployment output)
        id: acr
        run: |
          set -e
          LOGIN_SERVER=$(az deployment group show -g "$RESOURCE_GROUP" -n container-registry --query "properties.outputs.loginServer.value" -o tsv 2>/dev/null || true)
          test -n "$LOGIN_SERVER" || { echo "container-registry module deployment not found in $RESOURCE_GROUP — has infra/main.bicep been deployed yet (run deploy-infra first)?"; exit 1; }
          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"
          echo "name=${LOGIN_SERVER%%.*}" >> "$GITHUB_OUTPUT"

      # INCIDENT (2026-08-02, live — caj-loop-e2e-smoke #8 attempt 3):
      # mcp-web/mcp-buffer/mcp-canva/mcp-smoke had NEVER been successfully
      # built in this environment's history — every prior run of this job
      # failed the push step with `failed to fetch anonymous token: ...
      # 401 Unauthorized`, because this workflow never authenticated
      # docker to the registry at all. `azure/login@v2` above logs the
      # Azure CLI's OWN session in, which is a separate credential store
      # from the one `docker push`/buildx reads — every other working
      # image-build workflow in this repo (orchestrator-image.yml,
      # deploy-gateway.yml) calls `az acr login` explicitly for exactly
      # this reason; this workflow's header comment claims it was copied
      # from deploy-gateway.yml's implementation, but this one step was
      # dropped in the copy. Confirmed live: `az acr repository list` on
      # the shared ACR showed console/model-gateway/orchestrator/vault
      # only — mcp-web (and buffer/canva/smoke) had no repository at all,
      # so their Container Apps have been running the Bicep bootstrap
      # placeholder (`mcr.microsoft.com/azuredocs/containerapps-helloworld`)
      # since creation. This is what caused ca-orchestrator's ingest-signals
      # task to see every fetch_url call to mcp-web time out ("The read
      # operation timed out") — mcp-web's real app was never running to
      # answer them, only the placeholder's unrelated hello-world server.
      - name: az acr login (OIDC-backed az login above — no admin credentials)
        run: az acr login --name "${{ steps.acr.outputs.name }}"

      # ---------------------------------------------------------------
      # Stage services/telemetry-lib into the mcp/ build context (INCIDENT,
      # 2026-08-02, live — caj-mcp-smoke, first successful build after the
      # az acr login fix above): mcp_common/telemetry.py's
      # open_tool_call_span() does an unguarded `from telemetry_lib import
      # start_span`, called unconditionally on every POST /mcp request —
      # none of the 4 mcp-* Dockerfiles ever installed the sibling package
      # (services/telemetry-lib), so the first real tool call to any of
      # mcp-web/mcp-buffer/mcp-canva would 500 with ModuleNotFoundError,
      # and caj-mcp-smoke's own conformance test would fail the same way.
      # Same bug class as orchestrator-image.yml's "Stage telemetry-lib
      # into the build context" step (PR #49) — staged ONCE here (not per
      # Dockerfile) because all 4 mcp-* images already share this single
      # `mcp/` build context, unlike orchestrator's own dedicated context.
      # ---------------------------------------------------------------
      - name: Stage telemetry-lib into the build context
        run: |
          set -e
          cp -r services/telemetry-lib mcp/telemetry-lib
          rm -rf mcp/telemetry-lib/tests mcp/telemetry-lib/telemetry_lib.egg-info
          ls -lR mcp/telemetry-lib

      - uses: docker/setup-buildx-action@v4

      - name: Build and push mcp-web image (tagged with the commit SHA only — never :latest)
        uses: docker/build-push-action@v7
        with:
          context: mcp/
          file: mcp/mcp-web/Dockerfile
          push: true
          tags: ${{ steps.acr.outputs.login_server }}/mcp-web:${{ github.sha }}

      - name: Build and push mcp-buffer image (tagged with the commit SHA only — never :latest)
        uses: docker/build-push-action@v7
        with:
          context: mcp/
          file: mcp/mcp-buffer/Dockerfile
          push: true
          tags: ${{ steps.acr.outputs.login_server }}/mcp-buffer:${{ github.sha }}

      - name: Build and push mcp-canva image (tagged with the commit SHA only — never :latest)
        uses: docker/build-push-action@v7
        with:
          context: mcp/
          file: mcp/mcp-canva/Dockerfile
          push: true
          tags: ${{ steps.acr.outputs.login_server }}/mcp-canva:${{ github.sha }}

      - name: Build and push mcp-smoke image (tagged with the commit SHA only — never :latest)
        uses: docker/build-push-action@v7
        with:
          context: mcp/
          file: mcp/Dockerfile.smoke
          push: true
          tags: ${{ steps.acr.outputs.login_server }}/mcp-smoke:${{ github.sha }}

      # `docker push` returning success doesn't guarantee the manifest is
      # immediately visible for a pull from every path a moment later —
      # brief registry propagation lag. The `deploy` job (a separate
      # runner, `needs: build-and-push`) pulls these exact tags right
      # after this job finishes; a bounded retry here is cheap insurance
      # against that race (mirrors deploy-gateway.yml's identical check).
      - name: Verify the pushed images are visible in the registry (retry for propagation lag)
        run: |
          set -e
          for IMAGE in mcp-web mcp-buffer mcp-canva mcp-smoke; do
            MAX_ATTEMPTS=3
            ATTEMPT=1
            until az acr repository show --name "${{ steps.acr.outputs.name }}" --image "$IMAGE:${{ github.sha }}" >/dev/null 2>&1; do
              if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
                echo "$IMAGE:${{ github.sha }} still not visible in ${{ steps.acr.outputs.name }} after $MAX_ATTEMPTS attempts"
                exit 1
              fi
              echo "attempt $ATTEMPT/$MAX_ATTEMPTS: $IMAGE:${{ github.sha }} not yet visible, retrying..."
              ATTEMPT=$((ATTEMPT + 1))
              sleep 5
            done
            echo "confirmed: $IMAGE:${{ github.sha }} is visible in the registry"
          done

  deploy:
    name: deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: cmos-dev
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bootstrap az CLI extensions (non-interactive)
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az config set extension.dynamic_install_allow_preview=true
          az extension add --name containerapp --yes

      # Fail fast with a clear message rather than attempting to create
      # any of these resources here. infra/main.bicep (deployed by
      # deploy-infra.yml) is the sole source of truth for their shape
      # (identity, ingress, role assignments, scale) — this workflow only
      # ever updates their image on a resource that already exists; it
      # must never `az containerapp create`/`az containerapp job create`
      # one imperatively, since that would leave a resource Bicep doesn't
      # know about and can drift from deploy-infra's template.
      - name: Fail fast if any mcp-* resource doesn't exist yet
        run: |
          set -e
          for APP in mcp-web mcp-buffer mcp-canva; do
            az containerapp show -n "$APP" -g "$RESOURCE_GROUP" >/dev/null 2>&1 \
              || { echo "$APP does not exist in $RESOURCE_GROUP — run deploy-infra first"; exit 1; }
          done
          az containerapp job show -n caj-mcp-smoke -g "$RESOURCE_GROUP" >/dev/null 2>&1 \
            || { echo "caj-mcp-smoke does not exist in $RESOURCE_GROUP — run deploy-infra first"; exit 1; }

      # Same resolution as build-and-push's step above (see its comment) —
      # this is the copy that actually governs the real deploy, kept
      # independent since this runs in a separate job/runner.
      - name: Resolve the canonical ACR (from container-registry module's own deployment output)
        id: acr
        run: |
          set -e
          LOGIN_SERVER=$(az deployment group show -g "$RESOURCE_GROUP" -n container-registry --query "properties.outputs.loginServer.value" -o tsv 2>/dev/null || true)
          test -n "$LOGIN_SERVER" || { echo "container-registry module deployment not found in $RESOURCE_GROUP"; exit 1; }
          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      # MAIDEN-DEPLOY INCIDENT / L-0049: infra/modules/mcp/container-app.bicep
      # never declares `registries[]` (see its header comment) — this step
      # is what actually attaches each app's registry-pull identity,
      # exclusively, via the CLI (Microsoft's own documented reliable
      # workaround for microsoft/azure-container-apps#1467), every run.
      # Idempotent and safe to repeat: `az containerapp registry set` on an
      # already-correctly-configured registry is a no-op.
      - name: Set mcp-web/mcp-buffer/mcp-canva's ACR pull identity (owns this exclusively — never set by Bicep)
        run: |
          set -e
          for APP_ID in mcp-web:id-mcp-web mcp-buffer:id-mcp-buffer mcp-canva:id-mcp-canva; do
            APP="${APP_ID%%:*}"
            IDENTITY_NAME="${APP_ID##*:}"
            IDENTITY_ID=$(az identity show -g "$RESOURCE_GROUP" -n "$IDENTITY_NAME" --query id -o tsv)
            test -n "$IDENTITY_ID" || { echo "could not resolve $IDENTITY_NAME — deploy-infra.yml's identity module must create it first"; exit 1; }
            az containerapp registry set \
              -n "$APP" \
              -g "$RESOURCE_GROUP" \
              --server "${{ steps.acr.outputs.login_server }}" \
              --identity "$IDENTITY_ID"
          done

      # MAIDEN-DEPLOY INCIDENT — ROUND 2 (L-0049/L-0061): unlike the 3
      # apps above, removing only `registries[]` from mcp-smoke-job.bicep
      # was NOT sufficient — caj-mcp-smoke still failed provisioning with
      # IdentityDoesNotExist even with zero registries[] block, because
      # the Bicep template still attached id-mcp-web via
      # `identity.userAssignedIdentities` in the SAME initial
      # Microsoft.App/jobs create call. Microsoft.App/jobs is stricter
      # than Microsoft.App/containerApps for this platform limitation
      # (microsoft/azure-container-apps#1467): mcp-smoke-job.bicep now
      # declares NO identity block at all (see its own header comment),
      # so this workflow is the ONLY thing that ever attaches ANY
      # identity to this job — via the documented 2-step Microsoft
      # workaround: `job identity assign` (this step) immediately
      # followed by `job registry set` (the next step). Both idempotent,
      # safe to repeat every deploy.
      - name: Assign caj-mcp-smoke's user-assigned identity (owns this exclusively — never set by Bicep)
        run: |
          set -e
          IDENTITY_ID=$(az identity show -g "$RESOURCE_GROUP" -n id-mcp-web --query id -o tsv)
          test -n "$IDENTITY_ID" || { echo "could not resolve id-mcp-web — deploy-infra.yml's identity module must create it first"; exit 1; }
          az containerapp job identity assign \
            -n caj-mcp-smoke \
            -g "$RESOURCE_GROUP" \
            --user-assigned "$IDENTITY_ID"

      # Job-scoped equivalent of the app-level "Set ... ACR pull identity"
      # step above, for caj-mcp-smoke — see mcp-smoke-job.bicep's header
      # comment. Reuses id-mcp-web's identity (just attached above), same
      # as the 3 apps.
      - name: Set caj-mcp-smoke's ACR pull identity (owns this exclusively — never set by Bicep)
        run: |
          set -e
          IDENTITY_ID=$(az identity show -g "$RESOURCE_GROUP" -n id-mcp-web --query id -o tsv)
          test -n "$IDENTITY_ID" || { echo "could not resolve id-mcp-web — deploy-infra.yml's identity module must create it first"; exit 1; }
          az containerapp job registry set \
            -n caj-mcp-smoke \
            -g "$RESOURCE_GROUP" \
            --server "${{ steps.acr.outputs.login_server }}" \
            --identity "$IDENTITY_ID"

      # Deploy the 3 apps' real, SHA-pinned images — the only thing that
      # ever calls `az containerapp update --image` on them. Each update
      # creates a new revision (image reference changed); wait for it to
      # actually go Ready before moving on, same reasoning/pattern as
      # deploy-gateway.yml's identical step (`az containerapp update`
      # returning success only means the ARM PUT completed and a new
      # revision was CREATED, not that it's healthy/traffic-serving yet).
      - name: Deploy mcp-web/mcp-buffer/mcp-canva's real images and wait for Ready
        run: |
          set -e
          for APP in mcp-web mcp-buffer mcp-canva; do
            UPDATE_RESPONSE=$(az containerapp update \
              -n "$APP" \
              -g "$RESOURCE_GROUP" \
              --image "${{ steps.acr.outputs.login_server }}/$APP:${{ github.sha }}")
            NEW_REVISION=$(echo "$UPDATE_RESPONSE" | jq -r '.properties.latestRevisionName // empty')
            test -n "$NEW_REVISION" || { echo "az containerapp update did not report a latestRevisionName for $APP"; exit 1; }
            echo "$APP deployed revision: $NEW_REVISION"

            MAX_ATTEMPTS=20
            SLEEP_SECONDS=15
            ATTEMPT=1
            READY=""
            while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
              READY=$(az containerapp show -n "$APP" -g "$RESOURCE_GROUP" --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || true)
              echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: $APP latestReadyRevisionName=$READY (waiting for $NEW_REVISION)"
              if [ "$READY" = "$NEW_REVISION" ]; then
                break
              fi
              ATTEMPT=$((ATTEMPT + 1))
              if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
                sleep "$SLEEP_SECONDS"
              fi
            done
            if [ "$READY" != "$NEW_REVISION" ]; then
              echo "$APP: revision $NEW_REVISION never became the latest READY revision (last seen: $READY)"
              exit 1
            fi
            echo "$APP: revision $NEW_REVISION is ready and serving traffic"
          done

      # Jobs have no "revision"/readiness concept — `az containerapp job
      # update --image` just rewrites the persisted template for the NEXT
      # `job start`.
      - name: Deploy caj-mcp-smoke's real image
        run: |
          set -e
          az containerapp job update \
            -n caj-mcp-smoke \
            -g "$RESOURCE_GROUP" \
            --image "${{ steps.acr.outputs.login_server }}/mcp-smoke:${{ github.sha }}"

      - name: Start mcp_ops schema migration job
        run: az containerapp job start -g "$RESOURCE_GROUP" -n caj-mcp-ops-migrate

      - name: Poll mcp_ops migration job execution to Succeeded
        run: |
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=15
          ATTEMPT=1
          STATUS=""
          EXEC_NAME=""
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            EXEC_NAME=$(az containerapp job execution list -g "$RESOURCE_GROUP" -n caj-mcp-ops-migrate --query "[0].name" -o tsv 2>/dev/null || true)
            STATUS=$(az containerapp job execution list -g "$RESOURCE_GROUP" -n caj-mcp-ops-migrate --query "[0].properties.status" -o tsv 2>/dev/null || echo "Unknown")
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: caj-mcp-ops-migrate status = $STATUS"
            if [ "$STATUS" = "Succeeded" ] || [ "$STATUS" = "Failed" ]; then
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          echo "MCP_OPS_MIGRATE_EXEC=$EXEC_NAME" >> "$GITHUB_ENV"
          echo "MCP_OPS_MIGRATE_STATUS=$STATUS" >> "$GITHUB_ENV"

      # Unconditional dump — always useful, not just on failure. L-0024:
      # `job logs show` requires an explicit --container even for a
      # single-container job (matches the 'mcp-ops-migrate' container name
      # declared in mcp-ops-migrate-job.bicep). L-0027: dump raw output
      # first (always human-readable, JSON-wrapped or not), then a
      # best-effort structured pass with `jq -R 'fromjson? | ...'`, which
      # evaluates each line independently and skips (not aborts on) any
      # line that isn't valid JSON — a single-shot `grep -o '{.*}' | jq`
      # pipe can silently discard the whole stream on one malformed line.
      - name: Dump mcp_ops migration job logs
        if: always()
        run: |
          az containerapp job logs show -g "$RESOURCE_GROUP" -n caj-mcp-ops-migrate --execution "$MCP_OPS_MIGRATE_EXEC" --container mcp-ops-migrate > /tmp/mcp-ops-migrate.log 2>&1 || true
          echo "--- raw output ---"
          cat /tmp/mcp-ops-migrate.log || true
          echo "--- best-effort .Log extraction (lines that are JSON-wrapped; silently skips lines that aren't) ---"
          jq -R 'fromjson? | .Log // empty' /tmp/mcp-ops-migrate.log 2>/dev/null || true

      - name: Assert mcp_ops migration job succeeded
        run: |
          if [ "$MCP_OPS_MIGRATE_STATUS" != "Succeeded" ]; then
            echo "caj-mcp-ops-migrate did not reach Succeeded (last status: $MCP_OPS_MIGRATE_STATUS)"
            exit 1
          fi

      # Same reasoning as the migration job start above: bare `start`, no
      # CLI container-argument override (L-0022/L-0023 don't apply here) —
      # the smoke script and its MCP_WEB_BASE_URL/MCP_BUFFER_BASE_URL/
      # MCP_CANVA_BASE_URL env are baked into mcp-smoke-job.bicep's
      # persisted template (never a hardcoded hostname, L-0025); its image
      # was just set to the real, SHA-pinned tag by the step above.
      - name: Start MCP conformance smoke job (fixture mode, in-VNet, AC-20)
        run: az containerapp job start -g "$RESOURCE_GROUP" -n caj-mcp-smoke

      - name: Poll MCP smoke job execution to Succeeded
        run: |
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=15
          ATTEMPT=1
          STATUS=""
          EXEC_NAME=""
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            EXEC_NAME=$(az containerapp job execution list -g "$RESOURCE_GROUP" -n caj-mcp-smoke --query "[0].name" -o tsv 2>/dev/null || true)
            STATUS=$(az containerapp job execution list -g "$RESOURCE_GROUP" -n caj-mcp-smoke --query "[0].properties.status" -o tsv 2>/dev/null || echo "Unknown")
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: caj-mcp-smoke status = $STATUS"
            if [ "$STATUS" = "Succeeded" ] || [ "$STATUS" = "Failed" ]; then
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done
          echo "MCP_SMOKE_EXEC=$EXEC_NAME" >> "$GITHUB_ENV"
          echo "MCP_SMOKE_STATUS=$STATUS" >> "$GITHUB_ENV"

      - name: Dump MCP smoke job logs
        if: always()
        run: |
          az containerapp job logs show -g "$RESOURCE_GROUP" -n caj-mcp-smoke --execution "$MCP_SMOKE_EXEC" --container mcp-smoke > /tmp/mcp-smoke.log 2>&1 || true
          echo "--- raw output ---"
          cat /tmp/mcp-smoke.log || true
          echo "--- best-effort .Log extraction (lines that are JSON-wrapped; silently skips lines that aren't) ---"
          jq -R 'fromjson? | .Log // empty' /tmp/mcp-smoke.log 2>/dev/null || true

      - name: Assert MCP smoke job succeeded
        run: |
          if [ "$MCP_SMOKE_STATUS" != "Succeeded" ]; then
