# Tool list — mcp-canva
#
# Validates against contracts/function-definition/tools.schema.json
# (AC-14) — the generic registry-facing manifest schema authored by
# session/s6-registry (first-to-land wins; see that schema's own header).
# Its coarse `permissions` enum (read-only/read-write/none) doesn't carry
# MCP-specific tiers, so the finer nuance (template-locked, bulk, export)
# lives in `scope` free text and in each tool's description instead.
#
# The authoritative per-tool inputSchema (actually used for the MCP
# tools/list response and runtime validation) lives ONLY in
# app/main.py's TOOLS list — this file's schema forbids extra properties
# (additionalProperties: false), so duplicating inputSchema here would
# either fail validation or silently drift from the runtime copy.
#
# Exactly 3 tools (AC-16): create_design_from_template and
# bulk_create_from_csv are both template-locked (template_id is required
# in app/main.py's inputSchema for both - no blank/free-form design
# creation path exists); export_design is the export tool.

tools:
  - name: create_design_from_template
    description: >
      Create a new Canva design from a brand template. template_id is
      always required - no blank/free-form design creation is possible
      through this tool.
    permissions: read-write
    scope: template-locked; template_id always required, no free-form design creation

  - name: bulk_create_from_csv
    description: >
      Bulk-create designs from a brand template by autofilling one row of
      CSV-shaped data per design. template_id is always required, same as
      create_design_from_template.
    permissions: read-write
    scope: template-locked bulk creation; template_id always required

  - name: export_design
    description: >
      Export an already-created Canva design to a file format (e.g. PNG).
      Does not mutate the design itself or Canva's system of record.
    permissions: read-only
    scope: export of an existing design; no design mutation
