[pytest]
testpaths = tests
# Each server (mcp-web, mcp-buffer, mcp-canva) ships its own standalone
# smoke_test.py with the bare basename "smoke_test" and no __init__.py at
# that directory level. Under pytest's default "prepend" import mode,
# passing `mcp/` as an explicit collection path (exactly what spec.json's
# verify commands do, e.g. `pytest -m mcp_conformance mcp/ -v`) makes
# pytest try to import all three as the same top-level module name,
# aborting collection with "import file mismatch" (exit 2) — even though
# none of them live under testpaths and none are meant to be collected as
# tests at all. importlib mode imports every module by its actual file
# path instead of relying on sys.path/module-name uniqueness, so three
# same-named files in different directories no longer collide. Omitting
# an explicit path (relying on testpaths=tests alone) never triggered
# this, which is why it went unnoticed until spec.json's literal
# `pytest ... mcp/ -v` form was run.
#
# --import-mode=importlib alone fixes pytest's own outer collision (each
# smoke_test.py can now be imported under a distinct identity instead of
# aborting collection entirely), but each smoke_test.py's own top-level
# code additionally does `sys.path.insert(...)` then
# `from app.<module> import ...` (see mcp/README.md's dual-mode section)
# — a plain Python sys.modules["app"] cache collision, independent of
# pytest's import mode, since mcp-web/app, mcp-buffer/app, mcp-canva/app
# are three unrelated packages that all register under the bare name
# "app". Once collection actually reaches these files (which importlib
# mode alone allows), whichever server's smoke_test.py imports first
# "wins" sys.modules["app"], and the other two fail with
# ImportError/ModuleNotFoundError for a name that only exists in the
# first one's package. python_files below (dropping pytest's other
# default pattern `*_test.py`) prevents these standalone CLI scripts —
# which contain no test_* functions and are already fully exercised via
# mcp/tests/test_smoke.py's subprocess-based approach (AC-6) — from being
# discovered as pytest test modules at all, so this collision never has
# a chance to occur during collection in the first place.
addopts = --import-mode=importlib
python_files = test_*.py
markers =
    mcp_conformance: AC-1 MCP protocol conformance (initialize/tools-list/tools-call) in fixture mode, no live secrets present.
    mcp_buffer_surface: AC-2/AC-3 mcp-buffer manifest has zero publish-intent patterns and is exactly the documented read-queue + create-draft allow-list.
    mcp_mode_switch: AC-4 fixture vs. live mode selected purely by secret/flag env var presence, no code or config edit.
    mcp_rate_limit: AC-5 mcp-web's rate limiter caps a burst at a configured ceiling within a window, then recovers.
    mcp_smoke: AC-6 per-server live smoke test: skips cleanly when absent, makes exactly one real read-only call when present.
    mcp_logging: AC-9 a real tool call through the logging code path inserts a row into mcp_ops.tool_calls.
    mcp_manifest_schema: AC-14 each server's tools.yaml validates against contracts/function-definition/tools.schema.json.
    mcp_agent_e2e: AC-15 end-to-end MCP client list/call/log-readback, purely programmatic, for all three servers.
    mcp_canva_surface: AC-16 mcp-canva manifest is template-locked and has a bulk-create-from-CSV tool and an export tool.
    mcp_web_allowlist: AC-17 mcp-web's fetch tool enforces an egress allow-list before any network call.
