[pytest]
asyncio_mode = auto

# Puts the service root — and therefore the `analytics_ingest` package —
# on sys.path, the same way services/gatekeeper/pyproject.toml's own
# [tool.pytest.ini_options] does for its `app` package.
#
# Without this the suite runs only under `python -m pytest`, which
# prepends the current directory to sys.path as a side effect of the -m
# flag; a bare `pytest` collects 8 ImportErrors. That difference is
# invisible until something runs it the other way, which is exactly what
# happened the first time this suite reached CI.
pythonpath = .
