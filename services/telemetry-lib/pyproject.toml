[project]
name = "telemetry-lib"
version = "0.1.0"
description = "Canvas Marketing OS shared OpenTelemetry helper library — span-attribute conventions and Application Insights exporter setup for console + Wave-2 service adoption."
requires-python = ">=3.12,<3.13"
dependencies = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "azure-monitor-opentelemetry-exporter>=1.0.0b28",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
