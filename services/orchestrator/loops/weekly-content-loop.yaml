# Canvas Marketing OS — weekly-content-loop
#
# Fired 07:00 SAST EVERY DAY by infra/modules/scheduling/logic-apps.bicep's
# weeklyPlanningTrigger. The loop id and the Monday..Friday task_id prefixes
# below are dependency-chain names, NOT a schedule: one heartbeat decomposes
# this whole graph and runs it as fast as depends_on allows, so a daily fire
# means one COMPLETE content cycle per day. Daily is deliberate (17 Aug 2026)
# -- see that trigger's header for the ruling. Full Mon-Fri content-studio graph: Monday plans the
# week; Tuesday researches and harvests advocacy in parallel; Wednesday fans
# out to all six drafting functions; Thursday gates each Wednesday draft
# through its OWN Brand Steward QA and fact-check verdict (one pair of
# review tasks per draft, not one aggregate pair for all six -- see the
# round-34 "batch-gating" note below); Friday schedules each QA'd social
# derivative to Buffer and publishes the newsletter, each gated only on its
# OWN draft's two Thursday verdicts, so one draft failing QA no longer
# blocks any other draft's own path to Buffer/email. Every task_id embeds
# its day name as a prefix so day-detection substring checks are
# unambiguous. Validates against
# contracts/orchestrator/loop-definition.schema.json.
#
# ROUND 34 (10 Aug 2026, docs/content-learnings.md): this loop originally
# had ONE thursday-brand-steward-qa and ONE thursday-fact-check-verdict
# task, each depending on all 6 Wednesday drafts and resolving to a single
# all-or-nothing terminal state. Confirmed live the night of 10 Aug 2026: a
# spelling typo in one draft dead-lettered friday-schedule-social-buffer
# and friday-publish-newsletter for every other draft too, including ones
# that individually passed both reviews cleanly. Restructured to the
# per-draft graph below on Pieter's explicit direction (chose the full
# per-draft rebuild over a smaller "read the aggregate's per-draft
# breakdown" patch). See dispatch.py's module docstring and
# _single_draft_qa_review for the handler-side half of this change.

schema_version: "1"
loop_id: weekly-content-loop
description: >
  Full-width weekly content studio loop: Monday planning, Tuesday research
  and advocacy harvest, Wednesday drafting across all six content functions,
  Thursday per-draft dual-verdict QA (Brand Steward + fact-check, one pair
  per draft), Friday scheduling and publication gated per-draft on that
  draft's own two Thursday verdicts (round 34 -- see header comment).
tasks:
  # --- Monday: plan --------------------------------------------------------
  - task_id: monday-plan-content
    task_type: plan-content-monday
    depends_on: []
    description: Plan the week's content calendar across all five pillars.

  # --- Tuesday: research + advocacy harvest (parallel) ----------------------
  - task_id: tuesday-research-brief
    task_type: draft-research-brief
    depends_on: [monday-plan-content]
    description: >
      Function 41 turns this week's signals into a structured research
      brief, cited proof points only, for every Wednesday drafting function
      to work from.

  # F-BRIEF-UNREVIEWED (process 3). Every one of the twelve Thursday gates
  # depends on a wednesday-draft-* task, so the research brief -- the
  # artifact all five Wednesday drafting functions build on -- passed no
  # review at all. A client-naming breach or a brand-rule violation in the
  # brief propagated into six drafts before anything looked at it.
  #
  # Reuses qa-review, which already knows how to review a brief: its
  # non-draft-content branch reads the brief body and reviews it as
  # channel "internal-brief", exactly as the daily loop's own brief gate
  # does. No new review logic, only a missing edge in the graph.
  #
  # A blocked brief blocks the week's drafts, by design: everything built
  # on a brief inherits whatever is wrong with it, so failing here is
  # cheaper than failing six times on Thursday.
  - task_id: tuesday-qa-research-brief
    task_type: qa-review
    depends_on: [tuesday-research-brief]
    description: >
      Brand Steward QA (function 02) reviews the research brief before any
      Wednesday drafting function builds on it.

  - task_id: tuesday-client-advocacy-harvest
    task_type: draft-client-advocacy-harvest
    depends_on: [monday-plan-content]
    description: >
      Function 26 harvests any proposed advocacy quotes for the week against
      the local consent-register fixture and the permission register,
      client-free unless CLEARED.

  # --- Wednesday: fan out to all six drafting functions ---------------------
  - task_id: wednesday-draft-insight-story
    task_type: draft-insight-to-story
    depends_on: [tuesday-qa-research-brief]
    description: Function 39 turns the research brief into a narrative story draft.

  - task_id: wednesday-draft-ghostwrite
    task_type: draft-executive-ghostwrite
    depends_on: [tuesday-qa-research-brief]
    description: >
      Function 43 ghostwrites an executive-voice piece from the research
      brief, never fabricating an opinion the executive did not actually
      state.

  - task_id: wednesday-draft-carousel
    task_type: draft-carousel-post
    depends_on: [tuesday-qa-research-brief]
    description: >
      Function 45 turns the research brief's proof points into a
      multi-slide carousel plus its Canva Bulk Create CSV manifest.

  - task_id: wednesday-draft-newsletter
    task_type: draft-newsletter
    depends_on: [tuesday-qa-research-brief]
    description: Function 46 drafts this week's owned-channel newsletter digest.

  - task_id: wednesday-draft-case-study
    task_type: draft-case-study
    depends_on: [tuesday-qa-research-brief, tuesday-client-advocacy-harvest]
    description: >
      Function 47 drafts a case study from the research brief and any
      cleared advocacy quote harvested this week; client-free unless
      CLEARED.

  - task_id: wednesday-draft-repurpose
    task_type: draft-content-repurpose
    depends_on: [wednesday-draft-newsletter, wednesday-draft-case-study]
    description: >
      Function 52 repurposes this week's newsletter and/or case-study draft
      into shorter derivative social formats.

  # --- Thursday: dual-verdict QA gate, ONE PAIR PER DRAFT -------------------
  # ROUND 34 (docs/content-learnings.md, the "batch-gating" finding): this
  # used to be 2 aggregate tasks, each depending on all 6 Wednesday drafts
  # at once and resolving to a single all-or-nothing terminal state -- one
  # bad draft (even a spelling typo) dead-lettered Friday's publish tasks
  # for every OTHER draft too, confirmed live the night of 10 Aug 2026 (4-5
  # of 6 drafts individually clean, both Friday tasks blocked anyway).
  # Restructured to 12 per-draft tasks -- each depends_on exactly ONE
  # Wednesday draft, so a violation in one draft can never cascade to a
  # sibling's own review or publish tasks. task_type is unchanged
  # (qa-review-brand-steward / qa-review-fact-check); dispatch.py's
  # _single_draft_qa_review is what each of these 12 tasks runs.
  - task_id: thursday-brand-steward-qa-insight-story
    task_type: qa-review-brand-steward
    depends_on: [wednesday-draft-insight-story]
    description: Brand Steward QA on the insight-to-story draft.

  - task_id: thursday-fact-check-insight-story
    task_type: qa-review-fact-check
    depends_on: [wednesday-draft-insight-story]
    description: Fact-check verdict on the insight-to-story draft.

  - task_id: thursday-brand-steward-qa-ghostwrite
    task_type: qa-review-brand-steward
    depends_on: [wednesday-draft-ghostwrite]
    description: Brand Steward QA on the executive-ghostwrite draft.

  - task_id: thursday-fact-check-ghostwrite
    task_type: qa-review-fact-check
    depends_on: [wednesday-draft-ghostwrite]
    description: Fact-check verdict on the executive-ghostwrite draft.

  - task_id: thursday-brand-steward-qa-carousel
    task_type: qa-review-brand-steward
    depends_on: [wednesday-draft-carousel]
    description: Brand Steward QA on the carousel-post draft.

  - task_id: thursday-fact-check-carousel
    task_type: qa-review-fact-check
    depends_on: [wednesday-draft-carousel]
    description: Fact-check verdict on the carousel-post draft.

  - task_id: thursday-brand-steward-qa-newsletter
    task_type: qa-review-brand-steward
    depends_on: [wednesday-draft-newsletter]
    description: Brand Steward QA on the newsletter draft.

  - task_id: thursday-fact-check-newsletter
    task_type: qa-review-fact-check
    depends_on: [wednesday-draft-newsletter]
    description: Fact-check verdict on the newsletter draft.

  - task_id: thursday-brand-steward-qa-case-study
    task_type: qa-review-brand-steward
    depends_on: [wednesday-draft-case-study]
    description: Brand Steward QA on the case-study draft.

  - task_id: thursday-fact-check-case-study
    task_type: qa-review-fact-check
    depends_on: [wednesday-draft-case-study]
    description: Fact-check verdict on the case-study draft.

  - task_id: thursday-brand-steward-qa-repurpose
    task_type: qa-review-brand-steward
    depends_on: [wednesday-draft-repurpose]
    description: Brand Steward QA on the content-repurpose draft.

  - task_id: thursday-fact-check-repurpose
    task_type: qa-review-fact-check
    depends_on: [wednesday-draft-repurpose]
    description: Fact-check verdict on the content-repurpose draft.

  # --- Friday: schedule + publish, ONE TASK PER ELIGIBLE DRAFT -------------
  # ROUND 34: each task now depends only on its OWN draft's 2 Thursday
  # review tasks, not on all 12. case-study is deliberately excluded here
  # (see draft_case_study_handler's docstring and function 47's own
  # prompt.md -- human-initiated cadence only). The old buffer_weekly_
  # post_cap batching is gone at this granularity -- each task requests
  # exactly one Buffer post for its own draft.
  - task_id: friday-schedule-social-buffer-insight-story
    task_type: schedule-social-buffer
    depends_on: [thursday-brand-steward-qa-insight-story, thursday-fact-check-insight-story]
    description: Schedule the QA'd, fact-checked insight-to-story post to Buffer.
    params:
      function_id: publish.social_post
      action_class: publish
      channel_ids:
        - "68e73facca3a4e6b746d17b4"
        - "68e74731ca3a4e6b746d2469"
        - "68e745c6ca3a4e6b746d22b2"

  - task_id: friday-schedule-social-buffer-ghostwrite
    task_type: schedule-social-buffer
    depends_on: [thursday-brand-steward-qa-ghostwrite, thursday-fact-check-ghostwrite]
    description: Schedule the QA'd, fact-checked executive-ghostwrite post to Buffer.
    params:
      function_id: publish.social_post
      action_class: publish
      channel_ids:
        - "68e73facca3a4e6b746d17b4"
        - "68e74731ca3a4e6b746d2469"
        - "68e745c6ca3a4e6b746d22b2"

  - task_id: friday-schedule-social-buffer-carousel
    task_type: schedule-social-buffer
    depends_on: [thursday-brand-steward-qa-carousel, thursday-fact-check-carousel]
    description: Schedule the QA'd, fact-checked carousel post to Buffer.
    params:
      function_id: publish.social_post
      action_class: publish
      channel_ids:
        - "68e73facca3a4e6b746d17b4"
        - "68e74731ca3a4e6b746d2469"
        - "68e745c6ca3a4e6b746d22b2"

  - task_id: friday-schedule-social-buffer-repurpose
    task_type: schedule-social-buffer
    depends_on: [thursday-brand-steward-qa-repurpose, thursday-fact-check-repurpose]
    description: Schedule the QA'd, fact-checked content-repurpose post to Buffer.
    params:
      function_id: publish.social_post
      action_class: publish
      channel_ids:
        - "68e73facca3a4e6b746d17b4"
        - "68e74731ca3a4e6b746d2469"
        - "68e745c6ca3a4e6b746d22b2"

  - task_id: friday-publish-newsletter
    task_type: publish-newsletter
    depends_on: [thursday-brand-steward-qa-newsletter, thursday-fact-check-newsletter]
    description: >
      Publish this week's QA'd and fact-checked newsletter to the owned
      email channel, reusing the closest existing publish-class autonomy.yaml
      analogue since no email-specific gate-check identifier exists.
    params:
      function_id: publish.blog_article
      action_class: publish
