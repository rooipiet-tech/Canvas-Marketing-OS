[project]
name = "orchestrator"
version = "0.1.0"
description = "Canvas Marketing OS — orchestrator service (loop scheduling, task decomposition, dependency-ordered dispatch, retry/dead-letter state machine)."
requires-python = ">=3.12,<3.13"
# telemetry-lib is a sibling package (services/telemetry-lib), not
# published to any index -- installed as a separate `pip install -e
# services/telemetry-lib` step (mirrors console/pyproject.toml's identical
# convention, see .github/workflows/ci.yml's console-tests job), never
# listed here as a file:// dependency so this file stays portable across
# a plain `pip install -e .` in any checkout layout.
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2",
    "pyyaml",
    "jsonschema",
    "httpx",
    "psycopg[binary]>=3",
    "azure-servicebus>=7.11",
    "azure-identity>=1.17",
    "opentelemetry-api>=1.25",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orchestrator*"]
