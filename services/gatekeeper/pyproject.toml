[project]
name = "gatekeeper"
version = "0.1.0"
description = "Gatekeeper service — autonomy policy evaluation, gate decisions, approval routing and gate-token issuance."
requires-python = ">=3.12"
# telemetry-lib is a sibling package (services/telemetry-lib), not
# published to any index -- installed as a separate `pip install -e
# services/telemetry-lib` step (mirrors console/pyproject.toml's
# identical convention), never listed here as a file:// dependency.
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.1",
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "azure-identity>=1.16",
    "azure-keyvault-keys>=4.9",
    "opentelemetry-api>=1.25",
]

# rootdir anchor: running `pytest services/gatekeeper/tests/...` from the
# repo root resolves rootdir to services/gatekeeper (this file carries a
# [tool.pytest.ini_options] table), so `pythonpath = ["."]` puts the
# service root — and therefore the `app` package and main.py — on sys.path.
# Gatekeeper and Publisher both ship a top-level `app` package, so their
# suites must be run as two separate pytest invocations, never one.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
