[project]
name = "publisher"
version = "0.1.0"
description = "Publisher service — gate-token verification, refusal audit and the stub Vault-recording adapter."
requires-python = ">=3.12"
# telemetry-lib is a sibling package (services/telemetry-lib), not
# published to any index -- installed as a separate `pip install -e
# services/telemetry-lib` step (mirrors console/pyproject.toml's
# identical convention), never listed here as a file:// dependency.
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.1",
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "azure-identity>=1.16",
    "azure-keyvault-keys>=4.9",
    # app/buffer_client.py and app/vault_lookup.py (plan step 14) make
    # real outbound HTTP calls -- runtime, not test-only.
    "httpx>=0.27",
    "opentelemetry-api>=1.25",
]

# rootdir anchor — see services/gatekeeper/pyproject.toml for the full
# rationale. Both services ship a top-level `app` package, so the two test
# suites must be run as two separate pytest invocations, never one.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
