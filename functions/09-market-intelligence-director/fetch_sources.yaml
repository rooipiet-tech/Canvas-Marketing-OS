# Canvas Marketing OS — function 09 (Market Intelligence Director) fetch
# source allowlist (plan step 7, AC-24, AC-28).
#
# Read at runtime by orchestrator/dispatch.py's ingest-signals handler
# (never hardcoded in Python/task-dispatch code) — each `urls` entry is
# fetched via mcp-web's sole implemented tool, fetch_url (AC-24); the
# resulting page bodies are handed to function 09's own prompt.md as
# retrieval evidence for the LLM to attribute signals against.
#
# web_search-based ingestion (mcp-web's other named-but-unimplemented
# tool) is a config-only future activation path once mcp-web actually
# ships that tool: add its results to the same `urls`-shaped evidence set
# this handler already builds, no code change to function 09 or
# orchestrator/dispatch.py required (AC-28).
#
# Every URL below resolves live with HTTP 200 (following the one
# redirect learn.microsoft.com's canonical URLs issue) at the time this
# file was authored — re-verify this liveness periodically, since a
# renamed/retired page silently narrows AC-24's "real content, not
# placeholder text" guarantee rather than failing loudly.
#
# 3 distinct domains, matching function 09's own hard rule #3 ("at least
# 2 distinct domains" per batch of signals) and DE-6's "small, explicitly
# named set" ruling (mirrored into infra/main.bicep's MCP_WEB_ALLOWLIST,
# plan step 8):
#   - learn.microsoft.com   — canonical Microsoft Fabric product source
#     (positioning.md's "Fabric-native" pillar).
#   - www.moneyweb.co.za    — South African business/finance news.
#   - businesstech.co.za    — South African business/tech news.

version: 1
topic: "Microsoft Fabric adoption and multi-entity finance consolidation in South African enterprises"
horizon_days: 30
urls:
  - https://learn.microsoft.com/en-us/fabric/get-started/whats-new
  - https://www.moneyweb.co.za/feed/
  - https://www.moneyweb.co.za/news/tech/feed/
  - https://businesstech.co.za/news/feed/
