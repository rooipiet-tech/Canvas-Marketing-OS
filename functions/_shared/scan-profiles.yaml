  - profile_id: fabric-ecosystem
    function_id: 16-microsoft-fabric-ecosystem-scout
    topic: "Microsoft Fabric and Power BI platform, partner-ecosystem and tender movement"
    # PROMOTED 2 Sep 2026, by owner instruction, from the two
    # fabric-ecosystem entries in source-candidates.yaml. Same departure
    # from the probe-first pipeline, and the same reasoning, as
    # competitor-discovery above.
    #
    # learn.microsoft.com is deliberately read by BOTH this profile and
    # market-intelligence. The candidate file left that open ("whether
    # function 16 should read it directly rather than inheriting it --
    # the probe is cheap and the answer is not obvious"); the answer
    # taken here is yes, because the two functions ask different
    # questions of the same page and neither inherits the other's
    # evidence -- each scan fetches its own sources. It costs one extra
    # fetch of an already-allow-listed host.
    #
    # Only two sources, so 1/1 is not merely a rollout setting here: at
    # 2/2 a single failing feed would fail the whole scan. Revisit if the
    # partner-ecosystem and tender layers prompt.md names ever gain
    # addresses.
    min_sources: 1
    min_distinct_domains: 1
    watchlist_note: >-
      prompt.md names Microsoft's own release channel first
      (learn.microsoft.com, techcommunity.microsoft.com), then the
      partner-ecosystem layer (competency announcements, SA Solutions
      Partner directory movement), then public-sector tenders scoring
