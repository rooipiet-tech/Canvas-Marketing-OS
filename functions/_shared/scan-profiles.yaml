# Canvas Marketing OS — scan profiles
#
# The single source of truth for WHAT the signal scanners scan and WHERE
# they read it from. Read at runtime by orchestrator/dispatch.py; the
# hostnames across every profile's `urls` are what mcp-web's egress
# allow-list must contain (scripts/check_allowlist_sync.py enforces that,
# see "Allow-list" below).
#
# WHY THIS FILE REPLACED functions/09-market-intelligence-director/
# fetch_sources.yaml (F-SCAN-PROFILE-SINGLETON):
#
# That file was shaped as ONE scan -- `topic` and `horizon_days` were
# scalars at the root -- for a firm selling into six named verticals with
# eleven scanner packages already written. Those eleven have complete
# prompts, schemas, tools and evals, but no configuration to run against,
# which is part of why none of them was ever wired: there was nowhere to
# say what 18-02 scans that 18-05 does not. It also lived inside function
# 09's own package while describing work for twelve functions.
#
# Adding a market to watch is now a reviewed block here, not a code change
# plus an infrastructure change.
#
# THE EMPTY `urls` LISTS ARE DELIBERATE AND NOT A BUG.
#
# Every profile below carries a real topic and watchlist, taken from its
# own package's prompt.md and docs/positioning.md -- nothing invented.
# What nine of the twelve do not carry is source URLs, because nobody has
# yet written down where to read each sector.
#
# STATE, 2 Sep 2026 -- keep this count honest, it is the thing people
# read this header for. THREE profiles are sourced: market-intelligence
# (4 urls), competitor-discovery (3) and fabric-ecosystem (2). NINE are
# not: the three competitor-analysis profiles (functions 11, 12, 13) and
# all six verticals (18-01 .. 18-06).
#
# Those nine are not all empty for the same reason, and the difference
# decides who can fill them:
#
#   * THE SIX VERTICALS name no publications at all, in the prompt or
#     here. Nothing blocks them: function 17 (source-scout) proposes from
#     `topic` and `watchlist_note`, both of which they carry in full, so
#     the weekly source-discovery loop can propose for all six unaided.
#     They are empty because that loop has not fired yet -- its first run
#     is Monday 7 Sep 2026 (infra/modules/scheduling/
#     source-discovery-trigger.bicep).
#
#   * THE THREE COMPETITOR-ANALYSIS PROFILES are per-COMPETITOR scans,
#     not per-publication ones, and until 2 Sep the scout was never told
#     who the competitors are -- the list existed only as prose repeated
#     in twelve prompt.md files. It is now
#     functions/_shared/competitor-register.yaml, and the profiles that
#     want it say so with `needs_competitor_register: true` below.
#
# One layer stays unfillable either way: profiles 12 and 13 both name
# LinkedIn company pages as a channel, and mcp-web's fetch_url does not
# authenticate. A LinkedIn candidate will fail its probe. That is a real
# gap in coverage, not a configuration oversight to keep retrying.
#
# A profile with no `urls` is REFUSED at dispatch, loudly, naming this
# file -- never silently scanned as empty. Filling one in is what makes
# that scanner live; they can go live one at a time.
#
# HOW ONE ACTUALLY GETS FILLED: docs/source-promotion-runbook.md. Two
# approval cards, two config edits and a week between them -- worth
# reading before the card is in front of you rather than after.
#
# ALLOW-LIST. mcp-web rejects any host not in MCP_WEB_ALLOWLIST
# (infra/main.bicep), and dispatch.py's fetch loop catches that rejection
# and continues -- so a URL added here but not there is silently skipped
# and its scan quietly degrades. scripts/check_allowlist_sync.py fails CI
# when the two disagree, and prints the value main.bicep should carry.
# Adding a URL here means running that script and updating the Bicep.
#
# The four market-intelligence URLs resolve live with HTTP 200 (following
# the one redirect learn.microsoft.com's canonical URLs issue) at the time
# this file was authored -- re-verify periodically, since a renamed or
# retired page narrows a scan silently rather than failing loudly.

version: 2

# Applied to every profile that does not override the key itself.
defaults:
  horizon_days: 30
  # Completeness floors: below either, the scan FAILS rather than writing
  # a signals row. See dispatch.py's _assert_ingest_floor -- with one
  # surviving source, or two feeds on a single host, a scanner cannot
  # satisfy its own prompt's "at least 2 distinct domains" rule.
  min_sources: 2
  min_distinct_domains: 2
  # Content floor (F-INGEST-CONTENT-FLOOR). The two floors above count
  # URLs and hostnames and never look INSIDE them, which is how a stale
  # ca-mcp-web serving a 176-byte synthetic fixture for every fetch_url
  # passed both of them for three weeks: four URLs across three hosts is
  # a healthy-looking scan, and `evidence_chars: 704` is 176 x 4.
  #
  # A source whose SHAPED body (feed items, or de-marked-up page text --
  # not the raw response) is shorter than this still reaches the model,
  # but stops counting toward min_sources and min_distinct_domains. So a
  # scan whose sources all came back as stubs now fails at retrieval,
  # before any model spend, naming the character counts.
  #
  # Raise it for a profile whose sources are all long-form; lower it for
  # one whose feeds are genuinely terse. 500 sits clear of that 176 and
  # far below any real feed or article.
  min_source_chars: 500
  # Per-source evidence budget in characters, applied AFTER a feed is
  # reduced to its items and a page has its markup stripped, so the budget
  # buys article text rather than <channel> preamble. Capped upstream by
  # mcp-web's MCP_WEB_MAX_BODY_CHARS (default 16000).
  source_chars: 8000

profiles:
  # ---------------------------------------------------------------
  # Live. The only profile with sources today.
  # ---------------------------------------------------------------
  - profile_id: market-intelligence
    function_id: 09-market-intelligence-director
    topic: "Microsoft Fabric adoption and multi-entity finance consolidation in South African enterprises"
    # TEMPORARY ROLLOUT SETTING (1 Sep 2026). The defaults above are 2/2,
    # and 2/2 is where this profile should end up. It runs at 1/1 for its
    # first fortnight live because nobody yet knows how often a source
    # actually fails: these four URLs have never been fetched by a
    # deployed scan under the floors, and tightening a gate before you can
    # see through it is how a red loop becomes background noise.
    #
    # The relaxation is narrower than it looks. It lowers how many sources
    # a scan NEEDS, not what the model is held to -- the emitted-batch
    # domain check is capped at however many domains retrieval actually
    # delivered (dispatch.py's _assert_signal_domain_floor), so on a
    # normal 3-domain morning prompt.md hard rule 3 is enforced in full,
    # and only a genuinely degraded morning relaxes it.
    #
    # REMOVE THIS OVERRIDE once ingest_signals_degraded has a fortnight of
    # real data. If one-source days are rare, delete these two lines and
    # inherit 2/2. If they are common, that is a sourcing problem to fix
    # rather than a floor to keep lowered.
    min_sources: 1
    min_distinct_domains: 1
    watchlist_note: >-
      Fabric product movement from the canonical Microsoft source, and
      South African business/tech press coverage of finance data
      consolidation.
    urls:
      - https://learn.microsoft.com/en-us/fabric/get-started/whats-new
      - https://www.moneyweb.co.za/feed/
      - https://www.moneyweb.co.za/news/tech/feed/
      - https://businesstech.co.za/news/feed/

  # ---------------------------------------------------------------
  # Competitor and ecosystem scanners. Packages complete, sources not
  # yet written down.
  # ---------------------------------------------------------------
  - profile_id: competitor-discovery
    function_id: 10-competitor-discovery-scanner
    topic: "New and newly-emerging competitive moves among South African data-and-analytics competitors"
    # PROMOTED 2 Sep 2026, by owner instruction, from the three
    # competitor-discovery entries in source-candidates.yaml.
    #
    # PROMOTED WITHOUT A PROBE, which is a departure from the pipeline
    # source-discovery-loop describes and is recorded here rather than
    # left to be inferred. That loop proposes, probes in the sandbox,
    # scores, and raises ONE approval card a person acts on -- and a
    # candidate proposed on 7 Sep could not be probed until its host
    # cleared the probe allow-list, making the first promotion mid-
    # September at the earliest. These three were seeded by hand from
    # function 10's own prompt.md, every host was ALREADY on
    # MCP_WEB_PROBE_ALLOWLIST, and a person read them and decided. The
    # loop's value is scoring and the card; for three hand-written
    # candidates the owner is the scorer.
    #
    # What that costs: nobody has confirmed these three are reachable,
    # well-formed or non-empty. The 1/1 floors below are why that is
    # survivable -- one working source carries the scan -- and the
    # content floor is why an unreachable or stub source cannot pass as
    # a working one. Watch ingest_signals_degraded and
    # ingest_source_below_content_floor for this profile_id; a URL that
    # never returns evidence should be removed from here, not tolerated.
    min_sources: 1
    min_distinct_domains: 1
    needs_competitor_register: true
    watchlist_note: >-
      prompt.md names four channels in fixed order: each competitor's own
      newsroom or blog; their LinkedIn company page for hiring and
      partnership announcements; South African IT trade press (ITWeb,
      BusinessLive, Moneyweb) for launch and tender coverage; and the
      National Treasury eTenders portal plus provincial tender bulletins
      for public-sector awards naming a competitor.
      Of those four, the trade-press and tender ones are live below. The
      per-competitor half -- each competitor's own newsroom, and their
      LinkedIn company page -- now has a register to work from
      (functions/_shared/competitor-register.yaml) and is the next thing
      source discovery proposes for this profile. LinkedIn company pages
      will not survive the probe: fetch_url does not authenticate.
    urls:
      - https://www.itweb.co.za/rss/news
      - https://www.businesslive.co.za/rss/bd/companies/
      - https://www.etenders.gov.za/content/awarded-tenders

  - profile_id: competitor-change
    function_id: 11-competitor-change-monitor
    topic: "Ongoing change across the named South African data-and-analytics competitor set: pricing, hiring, partnerships, product releases, leadership"
    # NOT BLOCKED ON A TOOL. This note used to say the profile "depends
    # on vault_signal_lookup, which mcp-web does not yet implement" and
    # to read as a second blocker on top of the missing sources. mcp-web
    # still exposes only fetch_url and probe_url, but the cross-run
    # memory this profile needs was built in the orchestrator instead
    # (F-INGEST-NO-MEMORY): _already_captured() reads GET /signals,
    # narrows to this profile's own topic inside the horizon, and hands
    # the model an exclusion list -- and _make_scanner_handler runs that
    # for all eleven fan-out scanners, not just function 09. So this
    # profile needs sources and nothing else.
    #
    # One consequence worth knowing when its sources are chosen: the
    # memory is keyed on `topic` string equality, so this profile sees
    # its OWN prior batches and never competitor-discovery's, however
    # much source overlap the two end up with. That is the right
    # boundary for delta detection -- but it means a first run has no
    # baseline and will read as all-new.
    needs_competitor_register: true
    watchlist_note: >-
      Delta, not novelty. Cards only what changed against this profile's
      own prior Vault-recorded signals: a pricing move, a hire, a
      partnership, a product release, a leadership change. Watches the
      same named competitor set as competitor-discovery, so it wants that
      profile's trade-press and tender channels plus the competitors' own
      newsrooms.
    urls: []

