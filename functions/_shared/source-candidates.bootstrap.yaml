# CMOS scan-profile bootstrap — researched by agent, 4 September 2026 (SAST), no human seeding.
# Every URL below was fetched during research; probe fields are observed, not assumed.
# Status: PROVISIONAL until each profile's option is ratified. Ratification = choosing A/B/C
# per profile (or "all recommended"). Chosen sources land on scan profiles via the normal PR path.
# Rule of this file: no client names, ever. Competitors are named; clients are not.
#
# profile_key maps to the blueprint signal class; PR 5a binds each key to the real
# scan-profile id in the repo (the twelve profiles the daily loop dispatches).
#
# Probe legend: status = HTTP on fetch; robots = robots.txt permits the path (true/false/unknown);
# last_item = most recent dated item observed; cadence = observed; authority = primary|secondary.

bootstrap:
  researched_at: "2026-09-04"
  researched_by: "agent (Cowork session), four parallel research passes"
  provisional_until_ratified: true
  re_ratify_within_days: 30      # per blueprint v3 §11.3 — provisional sources retire unless re-ratified by a source.promote card

profiles:

  - profile_key: competitor-discovery          # blueprint fn 10
