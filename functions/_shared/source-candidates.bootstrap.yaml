    rationale: "Only directory that is reachable, robots-permitted, dated (monthly re-rank) and broad (48 SA firms). B and C are competitor-owned peer lists — run as quarterly diffs; they also reveal listicle-inclusion targets."
    options:
      - id: A
        name: "Clutch — Big Data Analytics / BI companies, South Africa"
        url: https://clutch.co/za/it-services/analytics
        feed_url: null
        probe: {status: 200, robots: true, last_item: "2026-08-31 (Aug 2026 rankings)", cadence: monthly, authority: secondary}
        method: html_diff
      - id: B
        name: "Solv Systems — 'Top Fabric & Power BI consultants in South Africa'"
        url: https://solv-systems.com/resources/top-fabric-power-bi-consultants-south-africa
        feed_url: null
        probe: {status: 200, robots: true, last_item: "2026-08-28 (updated)", cadence: quarterly, authority: secondary}
        method: html_diff
      - id: C
        name: "Mint Group — 'Best Microsoft partners in South Africa'"
